<style>

::selection{background:rgba(107,42,36,0.18);color:var(--accent)}::-moz-selection{background:rgba(107,42,36,0.18);color:var(--accent)}

html{font-synthesis:weight}/* ★★[KO_NO_FAUX_ITALIC 2026-09-25 코워크 3편 ③ · 사장님 선택 «바로 세우기»] 한글 글꼴(Noto Serif·Sans KR)엔 기울임꼴이 없어 italic 이 걸린 한글을 브라우저가 억지로 비틀었다(합성 기울임). 굵기 합성만 허용하고 기울임 합성을 끈다 — 한글은 바로 서고, Cormorant 처럼 진짜 기울임꼴이 있는 영문은 그대로 기운다. 지우지 말 것 · 공통 CSS 파일이 없어 고객 화면마다 한 줄씩 있다. */

/* 스크롤바 전역 숨김(스크롤 기능은 유지) — 브랜드 규칙: 바는 보이지 않게 */
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0;height:0;display:none}

  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#FAFAF8;--bg2:#F5F3EF;--accent:#3A2D22;--sub:#5A554C;--light:#6E6959;--gold:#B89A75;--seal:#6B2A24;--border:#DDD8D1;--serif:'Cormorant Garamond',Georgia,serif;--serif-ko:'Noto Serif KR','Nanum Myeongjo',serif;--sans:'Noto Sans KR',-apple-system,sans-serif}
  html,body{background:var(--bg);color:var(--accent);font-family:var(--sans);font-weight:300;font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh;word-break:keep-all}
  .wrap{max-width:480px;margin:0 auto;padding:60px 24px 90px;text-align:center}
  .brand{font-family:var(--serif);font-size:13px;font-weight:500;letter-spacing:.34em;color:var(--accent)}
  .brand .dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--seal);margin:0 5px;vertical-align:2px}
  .brand-sub{font-size:9px;letter-spacing:.3em;color:var(--light);text-transform:uppercase;margin:7px 0 40px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:34px 26px;box-shadow:0 1px 3px rgba(28,27,25,.05)}
  .eyebrow{font-family:var(--serif);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
  .title{font-family:var(--serif-ko);font-size:19px;font-weight:500;color:var(--accent);line-height:1.5;margin-bottom:10px}
  /* [BUSY_ONE] 대기 표시는 사이트 한 벌 — 마이페이지·식순과 같은 '숨쉬는 점'(1.7s / 0.25→0.9).
     이 페이지들은 글자만 있어 같은 흐름 안에서 어떤 화면엔 점이 있고 어떤 화면엔 없었다(2026-08-04 전수조사). */
  /* ★[LOADING_ONE] 숨쉬는 점이 «하는 중»을 이미 말한다. 뒤에 말줄임표를 또 붙이면
     같은 뜻을 두 언어로 말하는 것이고, 점 개수가 변하는 판이면 글자가 좌우로 흔들린다
     (2026-09-21 사장님 지적 「점갯수에따라 글자가 좌우로 흔들리는데」와 같은 자리).
     이 페이지의 두 자리(불러오는 중 · 처리 중)에서 걷어냈다. 다시 붙이지 말 것.
     ★주석에도 그 글자를 쓰지 않는다 — 부재 검사(nochk)가 제 주석을 잡아 빨개진다
       (같은 날 merge-guard 에서 실제로 그렇게 한 번 걸렸다). */
  .bdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--seal,#6B2A24);margin-right:8px;vertical-align:middle;animation:meBreath 1.7s ease-in-out infinite}
  .btn .bdot{background:currentColor}  /* [ERR_CODE_PAGES 2026-10-07] 진사 단추 위 진사 점은 안 보였다(글자만 오른쪽으로 밀렸다) · 단추 안에서는 글자색(흰) 점 · schedule 과 같은 방식 */
  @keyframes meBreath{0%,100%{opacity:0.25;transform:scale(0.82)}50%{opacity:0.9;transform:scale(1)}}
  .desc{font-family:var(--serif-ko);font-size:13.5px;color:var(--sub);line-height:1.85}
  .info{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin:18px 0;font-family:var(--serif-ko);font-size:15px;color:var(--accent)}
  .info b{font-weight:600}
  label{display:block;text-align:left;font-size:12px;color:var(--light);margin:20px 0 6px;letter-spacing:.02em}
  input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:8px;font-family:var(--sans);font-size:15px;color:var(--accent);background:#fff;outline:none}
  input:focus{border-color:var(--gold)}
  .btn{width:100%;margin-top:18px;padding:15px;border:none;border-radius:8px;background:var(--seal);color:#fff;font-family:var(--serif-ko);font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--sub);font-weight:400;margin-top:10px}
  .note{font-size:11.5px;color:var(--light);line-height:1.75;margin-top:16px}
  a.kakao{color:var(--gold);font-weight:600;text-decoration:none}

/* ════ 2026-07-30 취소 페이지 1라운드 · 고객 입장 실측 ════ */
/* [CAN_CONTRAST] --gold(#B89A75)는 흰 카드 위 2.65:1 — 상태 라벨(eyebrow)과 문의 링크(카카오톡)가
   그 색이었다. 취소가 막힌 화면에서 유일한 출구가 카카오톡 링크인데 안 읽히던 것. */
  .eyebrow{color:#7A5F37}
  .eyebrow.ko{letter-spacing:.06em}   /* [CAN_KO_TRACK] 한글 eyebrow('안내')는 영문용 .22em이 과하다 */
  a.kakao{color:#7A5F37;position:relative;display:inline-block}
  a.kakao::before{content:'';position:absolute;left:-4px;right:-4px;top:50%;height:40px;transform:translateY(-50%)}   /* [CAN_TAP40] 문장 속 링크 — 줄 간격은 그대로, 히트영역만 40px */
/* [CAN_FOCUS] 포커스 표시가 없었고 input:focus는 테두리 색만 바꿨다 */
  :where(a,button,input,[tabindex]):focus-visible{outline:2px solid var(--seal);outline-offset:3px;border-radius:4px}
  input:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
/* ★[NO_CARET_ALL 2026-10-06 사장님 «홈페이지 전체 커서 안 생기게 해 줘»] 글 칸이 아닌 곳을 누르면 깜빡이는 커서가 생기던 것(포커스 받는 틀 · 크롬 «캐럿 브라우징» F7) ·
   페이지 전체 커서를 투명하게 · 글을 적는 칸만 되돌린다(caret-color 는 물려받는다). 글 고르기(복사)는 그대로 된다 */
html{caret-color:transparent}
input,textarea,select,[contenteditable]:not([contenteditable="false"]){caret-color:auto}
/* ★[CAN_REAPPLY_LINK 2026-10-09 D-18] 신청서 링크는 카카오톡 링크와 같은 모양 · 같은 40px 누르는 칸 */
  a.inq{color:#7A5F37;font-weight:600;text-decoration:none;position:relative;display:inline-block}
  a.inq::before{content:'';position:absolute;left:-4px;right:-4px;top:50%;height:40px;transform:translateY(-50%)}
/* ★[BRAND_DOT_MID 2026-10-09 D-18] 글자 로고의 점 — 앞 글자(T) 뒤에 자간(.34em)이 붙어 점 왼쪽만 넓었다(점이 EDIT 쪽으로 쏠림) · 점 왼쪽 여백에서 그만큼 뺀다 */
  .brand .dot{margin-left:calc(5px - .34em)}
</style>

<body>
<main class="wrap">
  <div class="brand">MOMENT<span class="dot"></span>EDIT</div>
  <div class="brand-sub">Private Wedding Studio</div>
  <h1 class="sr-only">예약 취소</h1><!-- [CAN_STRUCT] 화면 제목은 상태마다 바뀌므로 고정 제목은 보이지 않게 한 번만 -->
  <div class="card" id="card" aria-live="polite"><div class="desc"><span class="bdot"></span>불러오는 중</div></div>
</main>
<script>
var EXEC_URL = "https://script.google.com/macros/s/AKfycbyR3n9MrPJNQfBDPDocq4VeUd8y78TtyrMTZ3a3g_eOmYwOIc6im5yXo3z1pJv7QgSBEQ/exec";
/* ★★[GUEST_TIMEOUT 2026-09-13 점검 라운드 6] 12초 제한. mypage 의 api()·하객 화면의 gapi() 와 같은 처방·같은 숫자다.
   ── 무엇이 문제였나: 응답이 오지도 실패하지도 않는 망에서 이 화면은 35초를 기다려도 **카드가 비어 있었고 버튼이 0개**였다.
      예약을 취소하러 메일 링크로 들어온 고객이 아무 말도 없는 화면 앞에 선다.
   ── 아래 catch 의 「예약 정보를 불러오지 못했어요 · 네트워크 상태를 확인하고 잠시 후 다시 시도해 주세요」는
      **이미 있었다.** fetch 가 끝나지 않아 안 불렸을 뿐이다 — 고친 것은 «끝나게» 한 것뿐이다(guide·seat 과 같은 자리).
   ★12초는 GAS 콜드스타트를 자르지 않으려는 값이다. 줄이지 말 것. */
function api(payload, ms){   // [ERR_CODE_PAGES] ms = 쓰기 동작만 길게(취소 처리는 캘린더 · 메일 셋 · 알림이라 12초를 자주 넘는다)
  var ac=(typeof AbortController!=='undefined')?new AbortController():null;
  var tm=ac?setTimeout(function(){ try{ ac.abort(); }catch(e){} },ms||12000):null;
  return fetch(EXEC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ac?ac.signal:undefined})
    .then(function(r){ if(tm) clearTimeout(tm); return r.json(); }, function(e){ if(tm) clearTimeout(tm); throw e; });
}
/* ★★[ERR_CODE_PAGES 2026-10-07 사장님 «다른 부분들도 스크린샷으로 혹은 고객이 오류 코드 등을 알려 주면 관리자가 어떤 문제인지 알 수 있게 · 전부 개선»]
   실패마다 한 줄 + «(코드 B#)» · B = 상담 예약 · 문의 · 예약 취소 · 숫자 = 무슨 일(assets/err-codes.js 표와 같은 뜻).
   브라우저가 가르는 셋: 기다리다 멈춤(AbortError) 5 · 연결 끊김(fetch 실패) 6 · 서버 답이 JSON 이 아님(GAS 오류 화면) 7.
   종전엔 셋 다 «네트워크 상태를 확인하고» 한 문장이라, 서버 쪽 사고도 고객 인터넷 탓으로 말했다.
   서버(GAS)가 글 끝에 «(코드 X#)»를 붙여 보내면 그대로 쓰고(두 번 붙이지 않는다) · ecode 만 오면 1~9 일 때 붙인다(0 은 글이 곧 까닭).
   seat · guide · schedule · inquiry 와 같은 네 함수 이름이다 — 한 곳만 고치지 말 것 */
function _ecN(e){ return (e&&e.name==='AbortError')?5:(e&&e.name==='SyntaxError')?7:(e&&e.name==='TypeError'&&/Failed to fetch|Load failed|Network ?Error|network connection|Internet connection/i.test(String(e.message||'')))?6:0; }   // [ERR_N_HONEST] 6 은 fetch 가 연결을 못 한 글일 때만 · 그 밖의 스크립트 예외는 0
function _ecOff(){ try{ return navigator.onLine===false; }catch(x){ return false; } }
function _ecNet(e,L,todo){ var n=_ecN(e), off=(n===6&&_ecOff());
  if(!n) return '화면 오류예요 · 새로 고쳐 주세요 (코드 '+L+'0)';   // [ERR_N_HONEST] 화면 쪽 스크립트 예외(0) — 연결 탓으로 말하지 않는다 · 다시 눌러도 같은 자리에서 멈추니 새로 고치게
  return (n===5?'응답이 늦어요':n===7?'서버가 잠깐 멈췄어요':off?'인터넷이 끊겼어요':'연결이 끊겼어요')+(todo?' · '+todo:'')+' (코드 '+L+n+')'; }   // todo 가 비면 «무슨 일 (코드)»만 — 바로 아래 «다시 불러오기» 단추가 할 일을 말하는 자리
function _ecSrv(d,L,fb){ var t=String((d&&d.error)||'').trim(), ec=String((d&&d.ecode)||''), eid=String((d&&d.eid)||''), m=/\s*\((코드 [A-Z]\d[^)]*)\)\s*$/.exec(t), tail=m?m[1]:'';
  if(m) t=t.slice(0,m.index);
  if(!/^[A-Z]\d$/.test(ec)) ec='';
  if(/^잠시 후 다시 시도해 주세요\.?( \(서버 혼잡\))?$/.test(t)){ t='요청이 몰렸어요 · 다시 해 주세요'; ec=ec||L+'1'; }   // 옛 GAS 잠금 대기 글
  else if(/^요청을 처리하지 못했어요\. 잠시 후 다시 시도해 주세요\.?$/.test(t)){ t='서버에서 오류가 났어요 · 다시 해 주세요'; ec=ec||L+'9'; }   // 옛 GAS doPost 일반 오류 글 · [ERR_NO_DOT_PAGE] 서버가 코드 앞 마침표를 걷어 보내도(«잠시 후 다시 시도해 주세요 (코드 B9 · 7KQ2)») 맞는다
  if(!t){ t=fb; ec=ec||L+'0'; }
  if(!tail&&ec&&(ec.charAt(1)!=='0'||t===fb)) tail='코드 '+ec+(eid?' · '+eid:'');
  return tail?t.replace(/[\s.]+$/,'')+' ('+tail+')':t; }   // [ERR_NO_DOT_PAGE] 코드 앞 끝 마침표는 걷는다(«주세요. (코드» 금지)
/* ★[ERR_CODE_GLUE 2026-10-07 코디 · 신청서 390px 실측 «(코드 B9 / · 7KQ2)»] «(코드 X# · 사고번호)»는 한 덩어리다 — 괄호 안에서 줄이 갈리지 않게 nowrap 으로 싼다
   (mypage _errHtml 과 같은 처리). 글자는 그대로라 textContent 로 읽는 검사 · 낭독기 · /\(코드 [A-Z]\d/ 감지는 달라지지 않는다. 여섯 쪽이 글자까지 같은 사본 — 한 곳만 고치지 말 것 */
function _ecGlue(h){ return String(h==null?'':h).replace(/\(코드 [^)<]*\)/g,function(c){ return '<span class="ec-code" style="white-space:nowrap">'+c+'</span>'; }); }
function _ecHtml(t){ return _ecGlue(String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; })); }
function _ecRetry(d){ var c=/\(코드 [A-Z](\d)/.exec(String((d&&d.error)||'')), n=c?c[1]:String((d&&d.ecode)||'').charAt(1); return /^[1345679]$/.test(n)||/서버 혼잡|요청을 처리하지 못했어요/.test(String((d&&d.error)||'')); }   // [ERR_RETRY_3] 3(설정 · 배포 · «잠시 뒤 다시 눌러 주세요»)도 다시 해 볼 일이다 — 링크 탓으로 말하지 않는다
function _ecLink(d){ return !!d&&(String(d.ecode||'').charAt(1)==='8'||/유효하지 않은 링크/.test(String(d.error||''))); }
function q(name){ var m=new RegExp('[?&]'+name+'=([^&]*)').exec(location.search); return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var TOKEN=q('token'), SIG=q('sig'), card=document.getElementById('card');
function showMsg(eyebrow,title,desc,note){ var _ko=/[가-힣]/.test(eyebrow||'');   // [CAN_KO_TRACK] 한글 eyebrow는 영문용 .22em 자간이 과하다
  card.innerHTML='<div class="eyebrow'+(_ko?' ko':'')+'" aria-hidden="true">'+esc(eyebrow)+'</div><h2 class="title">'+title+'</h2>'+(desc?'<div class="desc">'+_ecGlue(desc)+'</div>':'')+(note?'<div class="note">'+_ecGlue(note)+'</div>':''); }   // [ERR_CODE_GLUE] 실패 줄의 «(코드 X#)»는 한 덩어리로
/* [ERR_CODE_PAGES] 다시 불러오기 — 재시도가 답인 실패(몰림 · 시간 초과 · 연결 · 서버 답 깨짐 · 서버 오류)에만 단추를 붙인다.
   «링크를 열 수 없어요 · 예약이 없어요»처럼 다시 눌러도 같은 답이 오는 자리에는 붙이지 않는다(헛된 기대 금지) */
function _ecAgain(){ card.insertAdjacentHTML('beforeend','<button type="button" class="btn btn-ghost" id="again">다시 불러오기</button>');
  var a=document.getElementById('again'); if(a) a.addEventListener('click', function(){ card.innerHTML='<div class="desc"><span class="bdot"></span>불러오는 중</div>'; loadInfo(); }); }
/* ★[ERR_CODE_PAGES] 링크가 무효인 것(토큰 · 서명이 없거나 서버가 서명을 거절)은 «불러오지 못했어요»가 아니다 — 다시 불러와도 같다.
   종전엔 서버의 «유효하지 않은 링크예요.»가 «예약 정보를 불러오지 못했어요» 제목 아래 떠서 연결 문제처럼 읽혔다. 제목 · 할 일 · 코드(B8)를 따로 둔다 */
function _ecLinkMsg(){ showMsg('안내','링크를 열 수 없어요','받으신 메일의 링크로 다시 열어 주세요 (코드 B8)'); }
if(!TOKEN||!SIG){ _ecLinkMsg(); }
else loadInfo();
/* ★[CAN_KAKAO_WAY 2026-10-09 고객 여정 A~Z 점검 2라운드 D2-11 ① ③] 막다른 안내에는 카카오톡 «길»을 함께 — 기한이 지난 처음 화면과 같은 모양(a.kakao · 문장 속 링크).
   ① 서버가 «예약 정보를 찾을 수 없어요»라 답하면 코드도 갈 곳도 없었다 → 제목 그대로 · 할 일 한 줄 + (코드 B0) · 카카오톡
   ③ 취소를 누른 뒤 기한이 지나 거절되면 «카카오톡으로 문의해 주세요»라고만 하고 링크가 없었다 → 그 낱말을 링크로(같은 말을 두 번 하지 않는다)
   서버가 채널 주소(d.kakao)를 실어 보내지 않는 답(실패 답)도 있어 채널 주소를 한 벌 둔다(seat · guide EXIT_HTML 과 같은 주소) */
var KAKAO_FB='https://pf.kakao.com/_CfxcxlX/chat';
function _kakaoA(url){ return '<a class="kakao" href="'+esc(url||KAKAO_FB)+'" target="_blank" rel="noopener">카카오톡</a>'; }
function _kakaoIn(html, url){ return /카카오톡/.test(html) ? html.replace('카카오톡', _kakaoA(url)) : html; }   // 글 속 «카카오톡»을 링크로 — 없으면 그대로(부르는 쪽이 한 줄을 더한다)
function loadInfo(){
  api({action:'emailCancelInfo', token:TOKEN, sig:SIG}).then(function(d){
    if(!d||!d.ok){
      if(_ecLink(d)){ _ecLinkMsg(); return; }
      if(/예약 정보를 찾을 수 없어요/.test(String((d&&d.error)||''))){ showMsg('안내','예약을 찾을 수 없어요','마이페이지에서 예약을 확인해&nbsp;주세요 (코드 B0)','문의가 필요하시면 '+_kakaoA()+'으로 연락 주세요.'); return; }   // [CAN_KAKAO_WAY] ① 다시 불러와도 같은 답 — 다시 불러오기는 붙이지 않는다
      var _rt=_ecRetry(d);
      showMsg('안내','예약 정보를 불러오지 못했어요', esc(_ecSrv(d,'B','잠시 뒤 다시 열어 주세요')), _rt?'':'문의가 필요하시면 '+_kakaoA()+'으로 연락 주세요.');   // [ERR_CODE_PAGES] · [CAN_KAKAO_WAY] 다시 해서 안 될 때만 카카오톡
      if(_rt) _ecAgain();
      return; }
    /* ★[CAN_EXIT 2026-09-11 점검] 이 줄은 원래 아래 expired 분기 «바로 앞»에 있었다.
       그래서 cancelled·none 분기는 이미 d.kakao 를 손에 쥐고도 못 썼고, 특히 none 은
       「카카오톡으로 연락 주세요」라고 «말만» 하고 링크를 안 줬다 — 말한 길을 안 열어 준 셈이다.
       한 줄 위로 올리면 두 분기가 같은 링크를 쓴다(d.kakao 가 없으면 종전대로 글자만 — 폴백 동일). */
    var kakao=_kakaoA(d.kakao);   // [CAN_KAKAO_WAY] 서버 주소가 없어도 채널 주소로 링크(종전엔 글자만)
    if(d.state==='cancelled'){ showMsg('Cancelled','이미 취소된 예약이에요','다시 예약을 원하시면 <a class="inq" href="/inquiry.html">새로 신청</a>해 주세요.','문의가 필요하시면 '+kakao+'으로 연락 주세요.'); return; }   // ★[CAN_REAPPLY_LINK 2026-10-09 D-18] «새로 신청»이라 말만 하고 길이 없었다 → 신청서로
    if(d.state==='none'){ showMsg('안내','취소할 확정 예약이 없어요','문의가 필요하시면 '+kakao+'으로 연락 주세요.'); return; }
    if(d.state==='expired'){
      showMsg('안내','온라인 취소 기한이 지났어요',
        '상담 <b>'+esc(d.deadlineLabel)+' 전</b>까지만 온라인 취소가 가능해요.<br><br>예약하신 일정: <b>'+esc(d.date)+'&nbsp;·&nbsp;'+esc(d.time)+'</b>',   // [CAN_DOT_GLUE 2026-10-09 D-18] 가운뎃점이 줄 끝에 홀로 남지 않게
        '부득이하게 취소가 필요하시면 '+kakao+'으로 문의해 주세요.'); return;
    }
    // state === 'ok' — 취소 확인 화면
    // [환불 예상] 서버(emailCancelInfo.refund)가 예약금-시착 공제(계약서 4조⑧)로 계산한 금액 박스 — 계좌 입력칸 위.
    //   refund 없으면(구 GAS 배포 갭) 박스 생략 — 아래 기존 안내문(벌수만큼 차감)이 그대로 커버.
    var rf=d.refund, rfBox='';
    if(rf){
      if(rf.needCount){
        rfBox='<div class="info" style="margin-bottom:4px">환불 예상 · <b>확인 후 안내</b><br><span style="font-size:12px;color:var(--sub)">시착 벌수 확인 후 정확한 금액을 안내드려요</span></div>';
      } else {
        var rfCap = (Number(rf.fitCount)>0)
          ? '(시착 '+esc(rf.fitCount)+'벌 공제 '+Number(rf.fitDeduct||0).toLocaleString()+'원)'
          : '(전액 환불)';
        rfBox='<div class="info" style="margin-bottom:4px">환불 예상 · <b>'+Number(rf.amount||0).toLocaleString()+'원</b><br><span style="font-size:12px;color:var(--sub)">'+rfCap+'</span></div>';
      }
    }
    // [DEPOSIT_CARD 2026-09-25] 예약금을 카드로 받았으면 계좌를 여쭙지 않는다 — 결제하신 카드로 취소한다(서버 emailCancelInfo.byCard)
    var byCard=!!d.byCard;
    card.innerHTML='<div class="eyebrow" aria-hidden="true">Cancel</div><h2 class="title">예약을 취소하시겠어요?</h2>'
      +'<div class="desc">'+esc(d.names)+' 님</div>'
      +'<div class="info"><b>'+esc(d.date)+'&nbsp;·&nbsp;'+esc(d.time)+'</b></div>'   // [CAN_DOT_GLUE] 320 에서 «(토) · / 14:50» → «(토) · 14:50» 한 덩어리
      +rfBox
      +(byCard
        ? '<div class="note" style="margin-top:8px;text-align:left">예약금은 결제하신 카드로 취소해 드려요. 카드사에 따라 반영까지 며칠 걸릴 수 있어요.</div>'
        : '<label for="acct">환불 계좌 <span style="color:var(--light)">(예약금 환불용)</span></label>'
          +'<input type="text" id="acct" placeholder="은행 · 계좌번호 · 예금주" autocomplete="off">'
          +'<div class="note" style="margin-top:8px;text-align:left">취소 후 이 계좌로 환불해 드려요<span style="white-space:nowrap">(영업일 기준 수일)</span>.<br>지금 비워 두셔도 취소는 진행돼요 · 계좌는 따로 여쭤봐요.</div>')   /* ★[CAN_ACCT_ONE 2026-10-09 고객 여정 A~Z 점검 2라운드 D2-11 ②] 계좌 안내가 칸 아래 · 단추 아래 두 곳이었다 → 칸 아래 한 곳(환불 시기 · 비워도 됨) */
      +'<button type="button" class="btn" id="go">예약 취소하기</button>'
      +'<button type="button" class="btn btn-ghost" id="keep">아니요, 유지할게요</button>'
      +'<div class="note" id="cErr" role="alert" style="display:none;color:var(--seal)"></div>'
      /* ★[CAN_NO_FIT_LINE 2026-10-09 고객 여정 점검 D-18] 상담 전 취소 화면에 «드레스 시착을 진행하신 경우 차감» 줄이 늘 떴다 — 시착은 상담 당일에 하니 아직 상담 전인 분께는 맞지 않는 말이다.
         시착 기록이 있으면 위 «환불 예상» 칸(서버 refund · 벌수 · 공제)이 이미 말한다. 그 칸이 없을 때(옛 서버)만 종전 줄로 덮는다 */
      +(byCard
        ? (rf ? '' : '<div class="note">드레스 시착을 진행하신 경우, 진행한 벌수만큼(1벌당 50,000원) 차감한 금액을 카드로 취소해 드려요.</div>')
        : (rf ? '' : '<div class="note">드레스 시착을 진행하신 경우, 진행한 벌수만큼(1벌당 50,000원) 차감 후 환불돼요.</div>'));   // [CAN_ACCT_ONE] 계좌 · 환불 시기 줄은 칸 아래로 옮겼다 — 여기는 시착 공제 줄만(옛 서버 · CAN_NO_FIT_LINE)
    document.getElementById('keep').addEventListener('click', function(){ location.href='/mypage.html'; });
    document.getElementById('go').addEventListener('click', function(){
      var _ae=document.getElementById('acct'), acct=_ae?(_ae.value||'').trim():'';   // [DEPOSIT_CARD] 카드면 계좌 칸이 없다
      var b=document.getElementById('go'); b.disabled=true; b.innerHTML='<span class="bdot"></span>처리 중';   /* [BUSY_ONE] textContent 면 태그가 글자로 찍힌다 */
      var done=function(){ showMsg('Done','예약이 취소되었어요',(byCard?'예약금은 결제하신 카드로 취소해 드릴게요.<br>카드사에 따라 반영까지 며칠 걸릴 수 있어요.':acct?'입력하신 계좌로 예약금을 환불해 드릴게요.<br>(영업일 기준 수일 소요)':'환불받으실 계좌를 따로 여쭤볼게요.')+'<br><br>다시 찾아주실 때 언제든 편하게 모실게요.'); };   // ★[CAN_ACCT_EMPTY 2026-10-09 D-10] 계좌를 비우고 취소해도 «입력하신 계좌로»라 했다 · 서버도 비었으면 계좌를 따로 여쭌다(REFUND_ACCT_REQ)
      var say=function(t){ var _e=document.getElementById('cErr'); if(_e){ _e.style.display=''; _e.innerHTML=_ecHtml(t); } };   // [CAN_ALERT] OS alert 대체 — 화면 안에서, 낭독기에도 들리게 · [ERR_CODE_GLUE] 코드는 한 덩어리(글자는 같다)
      var back=function(t){ b.disabled=false; b.textContent='예약 취소하기'; say(t); };
      /* ★★[ERR_CODE_PAGES · CANCEL_RECHECK 2026-10-07] 취소는 «쓰기»다. 답을 못 받은 것(5 기다리다 멈춤 · 7 서버 답이 깨짐)은 «실패»가 아니라 «결과 모름»이다.
         서버(emailCancel)는 캘린더 삭제 · 메일 셋 · 알림까지 하느라 12초를 자주 넘었고, 그동안 서버는 취소를 끝내는데 화면은 «취소에 실패했어요»라 말했다.
         다시 누르면 서버는 {ok:true, already:true}(이미 취소)로 답했다 — 실패라 들은 취소가 실은 된 것이었다.
         이제 취소 요청은 45초를 기다리고, 그래도 답이 없으면 예약 상태(emailCancelInfo)를 다시 물어 취소됐으면 완료 화면을 그대로 보인다(4초 간격 세 번) */
      var recheck=function(n, left){
        api({action:'emailCancelInfo', token:TOKEN, sig:SIG}).then(function(d){
          if(d&&d.ok&&d.state==='cancelled'){ done(); return; }
          if(left>1){ setTimeout(function(){ recheck(n, left-1); }, 4000); return; }
          back((d&&d.ok)?'아직 취소 전이에요 · 다시 눌러 주세요 (코드 B'+n+')':'결과를 못 받았어요 · 다시 눌러 주세요 (코드 B'+n+')');
        }).catch(function(){ if(left>1){ setTimeout(function(){ recheck(n, left-1); }, 4000); return; } back('결과를 못 받았어요 · 다시 눌러 주세요 (코드 B'+n+')'); });
      };
      api({action:'emailCancel', token:TOKEN, sig:SIG, acct:acct}, 45000).then(function(r){
        if(r&&r.ok){ done(); return; }
        if(_ecLink(r)){ _ecLinkMsg(); return; }
        if(_ecRetry(r)){ back(_ecSrv(r,'B','취소를 받지 못했어요 · 다시 눌러 주세요')); return; }   // [ERR_CODE_PAGES] 몰림 · 서버 오류 — 화면은 두고 다시 누르게
        b.disabled=false; b.textContent='예약 취소하기'; var _fh=esc(_ecSrv(r,'B','취소를 받지 못했어요 · 잠시 뒤 다시 열어 주세요'));
        showMsg('안내','취소를 완료하지 못했어요', _kakaoIn(_fh, d.kakao), /카카오톡/.test(_fh)?'':'문의가 필요하시면 '+kakao+'으로 연락 주세요.');   // [CAN_KAKAO_WAY] ③ 기한이 지나 거절 → 글 속 «카카오톡»이 링크 · 그 말이 없으면 한 줄
      }).catch(function(e){ var n=_ecN(e);
        if(n===6){ back(_ecNet(e,'B','다시 눌러 주세요')); return; }   // [ERR_CODE_PAGES] 연결이 끊긴 것은 요청이 서버에 닿지 않은 쪽이 대부분 — 다시 눌러도 서버가 이미 취소면 «이미 취소»로 답한다
        if(!n){ back(_ecNet(e,'B','')); return; }   // [ERR_N_HONEST] 화면 쪽 예외(0) — «서버가 잠깐 멈췄어요»가 아니다 · 새로 고치면 지금 상태(취소됨 · 확정)를 다시 보여 준다
        /* 무엇을 하는 중인지는 단추가(● 취소됐는지 확인 중) · 무슨 일인지는 줄이(코드는 결과를 말하는 마지막 줄에) — 360px 폰의 좁은 카드(258px)에서 한 줄씩 */
        b.innerHTML='<span class="bdot"></span>취소됐는지 확인 중'; say(n===5?'응답이 늦어요':'서버가 잠깐 멈췄어요'); recheck(n, 3);   // [ERR_RECHECK_NOCODE 2026-10-07] 저절로 다시 묻는 «중간» 줄엔 코드 없음 — 결과를 말하는 마지막 줄(아직 취소 전 · 결과를 못 받았어요)에만(P6)
      });
    });
  }).catch(function(e){ showMsg('안내','예약 정보를 불러오지 못했어요', esc(_ecNet(e,'B',''))); _ecAgain(); });   // [ERR_CODE_PAGES] 할 일은 «다시 불러오기» 단추가 말한다
}
</script>
</body>
</html>
