<!doctype html><html lang="ko"><head><meta charset="utf-8">

<title>문안 되돌리기</title>
<style>
:root{--ink:#2B2723;--sub:#6E6959;--line:#E3DED3;--bg:#FAF8F4;--card:#fff;--keep:#4C7A5A;--back:#A8603C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 130px}
header{padding:26px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
h1{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
.lead{color:var(--sub);font-size:14.5px;margin:0 0 6px}
.url{font-size:12.5px;margin:0 0 10px}
.url a{color:var(--sub)}
.bar{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin:0 -16px 16px}
.bar .in{max-width:720px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cnt{font-size:14px;font-weight:600;margin-right:auto}
.cnt b{font-size:18px}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px}
.mini{font-size:13.5px;padding:7px 11px;color:var(--sub)}
h2{font-size:15px;margin:26px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line);color:var(--sub);font-weight:600}
h2 span{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 15px 12px;margin:0 0 12px}
.card.done{opacity:.5}
.tag{font-size:12.5px;color:var(--sub);margin:0 0 9px}
.tag .n{font-variant-numeric:tabular-nums}
.row{margin:0 0 8px;padding:10px 12px;border-radius:9px;border:1px solid var(--line)}
.row .k{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.now{background:#F3F7F3;border-color:#CFE0D3}
.was{background:#FBF6F2;border-color:#EBDACB}
.why{font-size:13.5px;color:var(--sub);margin:9px 0 0;padding-left:11px;border-left:2px solid var(--line);max-height:5.25em;overflow:hidden;position:relative}
.why::after{content:'';position:absolute;left:0;right:0;bottom:0;height:1.75em;background:linear-gradient(rgba(255,255,255,0),#fff)}
.why.open{max-height:none}
.why.open::after{display:none}
.more{font-size:13px;color:var(--sub);background:none;border:none;padding:4px 0;text-decoration:underline;margin-top:2px}
.pick{display:flex;gap:8px;margin-top:11px}
.pick button{flex:1;padding:11px 8px;font-size:14.5px}
.pick button.on{color:#fff;border-color:transparent;font-weight:600}
.pick .keep.on{background:var(--keep)}
.pick .back.on{background:var(--back)}
.out{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
.out .in{max-width:720px;margin:0 auto;display:flex;gap:9px}
.out button{flex:1;padding:13px;font-weight:600;background:var(--ink);color:#fff;border-color:transparent}
.out button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);flex:0 0 auto}
textarea{width:100%;max-width:720px;margin:12px auto 0;display:block;height:180px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:9px;padding:11px}
.hid{display:none}
@media (max-width:420px){.pick{flex-direction:column}}
</style></head><body><div class="wrap">

<p class="lead">아래 <b>98곳</b>은 <b>이미 바뀌어 저장소에 들어가 있습니다.</b> 식순 순서대로 놓았습니다. 읽어 보시고 <b>예전 문장이 더 낫다 싶은 것만</b> 골라 주세요.</p>
<p class="lead">그대로 두실 것은 <b>누르지 않으셔도 됩니다.</b> 중간에 닫으셔도 누른 것은 남습니다.</p>

<script>
var D = [{"id":"05_entry-A#0","clip":"05_entry-A","now":"두 사람은 오늘까지 서로 다른 길을 걸어왔습니다.","was":"지금까지 두 사람은, 각자의 길을 걸어왔습니다.","why":"이 갈래는 세 문장이 전부 앞머리 쉼표절로 열립니다(「지금까지 두 사람은,」·「오늘,」·「모두,」). 실측으로 여섯 갈래 중 가장 나쁩니다. 낭독하면 세 번 다 같은 지점에서 숨을 쉬고 같은 박자로 다시 출발합니다. 쉼표를 풀어 한 호흡으로 갑니다.","must":false,"kind":"문안","label":"서사형","voice":"진행","live":true},{"id":"05_entry-A#1","clip":"05_entry-A","now":"그 두 길이 지금 여기서 하나가 됩니다.","was":"오늘, 그 두 길이 하나가 되어 이 자리에서 만납니다.","why":"같은 이유로 앞머리 쉼표를 풀었습니다. ★새 어조표의 A 담백 칸(「각자의 길을 걸어온 두 사람이, 오늘 여기서 만납니다」)과 글자가 같아지지 않게 썼습니다. 어조표는 «고객이 어조를 고른 칸»이고 이 문안은 «안 고른 칸»이라, 둘이 같아지면 담백을 고른 고객과 안 고른 고객이 같은 소리를 듣게 됩니다.","must":false,"kind":"문안","label":"서사형","voice":"진행","live":true},{"id":"05_entry-A#2","clip":"05_entry-A","now":"모두 따뜻한 박수로 맞아 주시기 바랍니다.","was":"모두, 따뜻한 박수로 두 사람을 맞아 주시기 바랍니다.","why":"세 번째 쉼표절을 풉니다. 「두 사람을」은 앞 두 문장이 이미 두 사람 이야기라 없어도 통합니다.","must":false,"kind":"문안","label":"서사형","voice":"진행","live":true},{"id":"10_entry-F#0","clip":"10_entry-F","now":"각자 써 내려온 이야기가 있습니다.","was":"지금부터, 두 사람의 이야기가 시작됩니다.","why":"이 갈래는 세 문장이 전부 앞머리 쉼표절로 열립니다. 쉼표를 풀어 한 호흡으로 갑니다. ★자리의 무게 — 1차안은 네 문장을 셋으로 줄였는데, 입장 선창은 예식의 문을 여는 자리라 길이가 곧 무게입니다. 네 문장을 지키고 쉼표절만 풉니다. ★회차 합산 점검 — 「두 사람이」로 여는 문장을 줄이려고 주어를 뺐습니다. 입장 선창 맥락이라 「각자」만으로 누구인지 통합니다.","must":false,"kind":"문안","label":"이야기의 시작","voice":"진행","live":true},{"id":"10_entry-F#1","clip":"10_entry-F","now":"그 두 권이 오늘 한 권으로 묶입니다.","was":"오랜 시간 각자 써 내려온 두 이야기가, 오늘 한 권으로 묶입니다.","why":"현행은 「이야기」를 두 문장에서 씁니다. 앞 줄에 한 번 두고 이쪽은 「두 권」으로 받으면 같은 낱말이 겹치지 않으면서 비유가 이어집니다. ★새 어조표 F 담백 칸(「두 사람의 이야기가 오늘 한 권으로 묶입니다」)과 글자가 같아지지 않는지 대조했습니다.","must":false,"kind":"문안","label":"이야기의 시작","voice":"진행","live":true},{"id":"10_entry-F#2","clip":"10_entry-F","now":"첫 장을 큰 박수로 함께 열어 주시기 바랍니다.","was":"그 첫 장을, 큰 박수로 함께 열어 주시기 바랍니다.","why":"쉼표만 풉니다. 문장 자체는 현행 그대로 살립니다 — 어조표 담백 칸과 가까운 자리라, 새로 지으면 오히려 그쪽과 같아질 위험이 있습니다.\n★[이어 읽기 둘째 판 · 검사 28] 「그」를 뺐습니다. 앞 문장이 「**그** 두 권이…」로 열어서 잇단 두 문장이 같은 말로 출발합니다. 네 문장짜리 클립에서 둘이면 귀에 걸립니다. 가리키는 일은 앞 문장의 「그」가 이미 했으므로 여기서는 없어도 무엇의 첫 장인지 분명합니다.","must":false,"kind":"문안","label":"이야기의 시작","voice":"진행","live":true},{"id":"52_narr-entry-out#0","clip":"52_narr-entry-out","now":"같은 자리에 두 사람이 있습니다.","was":"두 사람이 나란히 섰습니다.","why":"①「섰습니다」는 방금 일어난 동작을 완료형으로 중계합니다. 녹음은 재생 시점이 어긋나면 거짓이 되는데 「있습니다」는 상태라 언제 나가도 참입니다. 사장님이 79에 손수 적어 주신 「나란히 있습니다」가 정확히 이 교체입니다. ★회차 합산 점검 — 「두 사람이」로 여는 문장이 한 예식에 셋이 되어 어순을 뒤집었습니다. 「같은 자리에」가 먼저 오면 무엇이 달라졌는지가 첫 낱말에 옵니다.","must":false,"kind":"문안","label":"입장 닫는 말","voice":"진행","live":true},{"id":"82_narr-entry-out-E#0","clip":"82_narr-entry-out-E","now":"오늘 두 사람은 혼자가 아닙니다.","was":"두 사람이 나란히 섰습니다.","why":"①「섰습니다」를 상태로. ②선창 E를 「두 사람을 여기까지 키운 손이 여럿입니다」로 고쳤는데, 현행 여는 말도 「데려온 손들이」를 씁니다. 같은 갈래가 1분 안에 같은 비유를 두 번 쓰면 두 번째가 헛돕니다. 비유는 선창에 두고 여는 말은 그 결론만 말합니다.","must":false,"kind":"문안","label":"입장 닫는 말 · 감사·가족","voice":"진행","live":true},{"id":"83_narr-entry-out-F#0","clip":"83_narr-entry-out-F","now":"오늘부터는 한 사람의 이야기가 아닙니다.","was":"여기서부터는 같이 씁니다.","why":"목적어가 없어 서른여섯 조합 중 서른에서 뜻이 안 선다 · 선창 F 뒤에서만 「이야기」로 이어졌다","must":true,"kind":"문안","label":"입장 닫는 말 · 이야기의 시작","voice":"진행","live":true},{"id":"11_narr-welcome-in#0","clip":"11_narr-welcome-in","now":"이 자리 첫마디는 두 사람 몫입니다.","was":"두 사람이 준비한 첫 인사가 있습니다.","why":"바로 뒤 07w가 「먼저 이렇게 인사드리고」 — 「인사」·「먼저」 둘 다 피했다","must":true,"kind":"문안","label":"환영 시작","voice":"진행","live":true},{"id":"13_narr-vow-in#0","clip":"13_narr-vow-in","now":"두 사람이 서로에게 할 약속이 있습니다.","was":"지금 두 사람 사이에 오갈 말이 있습니다.","why":"지금 무엇이 시작되는지 이름을 안 불러 줍니다. 「오갈 말」은 대화처럼 들리고 「있습니다」는 존재만 알립니다. 「서약」이라는 낱말은 담백판 358문장에 0회인데, 뒤따르는 클립들은 이 순간을 또렷하게 「약속」이라 부릅니다(24·25·34·30·32). 여는 문장만 이름을 안 주니 하객이 한 박자 늦게 «아, 서약이구나» 합니다. 뒤 클립들과 같은 낱말로 통일해 성혼선언이 그대로 받게 했습니다.","must":false,"kind":"문안","label":"혼인 서약 시작","voice":"진행","live":true},{"id":"13_narr-vow-in#1","clip":"13_narr-vow-in","now":"두 분, 서로를 향해 한 걸음만 가까이 서시면 됩니다.","was":"두 분, 서로를 마주 보아 주세요.","why":"★1차안에서 이 줄을 **통째로 지웠는데 잘못이었습니다.** 1회차에서 도착 멘트 여섯이 전부 「서로를 바라봐 주세요」로 닫으니 중복이라고 본 것인데, 적대적 검증이 반증했습니다 — 지우면 **어조를 안 고른(담백) 예식에서 두 사람에게 «마주 서라»는 지시가 한 번도 안 나갑니다.** 어조 갈래 서정(「두 분, 마주 서 주세요」)·다정(「두 분, 서로를 마주 보세요」)에는 그 지시가 살아 있어서, 어조에 따라 «연출이 있는 예식»과 «없는 예식»으로 갈립니다. 게다가 도착 멘트 여섯은 게이트가 전수로 「서로를 바라봐 주세요」로 닫히는지 재고 있어 그쪽은 못 바꿉니다 — 풀 수 있는 곳은 여기뿐입니다.\n★그래서 삭제가 아니라 **교체**로 갑니다. 지시하는 대상을 «시선»에서 «거리·자세»로 옮기면 도착 멘트와 말이 겹치지 않으면서 두 사람을 마주 세우는 기능은 남습니다. 서정·다정과도 글자가 갈려 세 결이 구별됩니다. 「보아 주세요」가 담백판 358문장 중 이 한 줄뿐이라 문어체로 튀던 것도 함께 풀립니다.\n★어미를 「주십시오」에서 「~시면 됩니다」로 바꿨습니다. 새로 넣은 부탁 어미 섞임 검사가 「주십시오」가 한 예식 아홉 개 중 넷(44%)이라고 잡았습니다. 이 한 줄을 옮기니 세 갈래 전부 33%로 내려갑니다. 그리고 이 어미는 사장님이 직접 고르신 결이고(15번이 같은 어미), 긴장한 두 사람에게 내리는 지시로는 「주십시오」보다 부드럽습니다. 어조 갈래 서정(「마주 서 주세요」)·다정(「서로를 마주 보세요」)과도 어미가 갈려 세 결이 구별됩니다.\n★소리 검사가 한 번 더 물었습니다 — 「마주 서시면」이 ㅈ·ㅅ·ㅅ 세 음절 연달아라 마이크에서 샙니다. 「서로를 향해」로 열면 치찰음이 갈라지고, «마주»를 «향해»로 바꿔도 두 사람을 마주 세우는 기능은 그대로입니다. 오히려 «시선»이 아니라 «몸의 방향»이라 도착 멘트(「서로를 바라봐 주세요」)와 하는 일이 확실히 갈립니다.","must":true,"kind":"문안","label":"혼인 서약 시작","voice":"진행","live":true},{"id":"13_narr-vow-in#2","clip":"13_narr-vow-in","now":"오래 다듬어 온 말입니다.","was":"(없음 · 새로 넣습니다)","why":"사장님 원문 — 「조금 더 편안하게 자연스럽게 시작할 수 있게 운을 띄워 주는 멘트는 어떨까?」\n지금 대본에는 운을 띄우는 말이 없습니다. 이 한 줄은 두 사람에게는 «준비됐다»는 신호가 되고 하객에게는 «귀 기울이라»는 신호가 되어 한 줄이 두 몫을 합니다.\n★여기까지 오는 데 자가검사가 두 번 물었습니다. 1차안 「듣는 사람은 서로 한 사람입니다」는 앞줄과 「사람」·「서로」가 두 번씩 겹쳤고, 2차안 「목소리가 떨려도 괜찮습니다」는 더 위험했습니다 — 신랑이 신부에게 쓴 편지의 한복판이 「너는 「괜찮아」를 두 번 말해」라서, 나레이션이 「괜찮」을 먼저 쓰면 그 대목이 무뎌집니다.\n★「서두르지 않으셔도 됩니다」는 쓰지 않았습니다 — 어조 갈래 서정·다정이 이미 그 문장으로 엽니다.","must":true,"kind":"문안","label":"혼인 서약 시작","voice":"진행","live":true},{"id":"13_narr-vow-in#3","clip":"13_narr-vow-in","now":"신랑님 첫 줄부터 시작하십니다.","was":"천천히 시작하셔도 좋습니다.","why":"「~하셔도 좋습니다」는 운을 띄우는 말이 아니라 허가입니다. 시작할 책임을 여전히 두 사람에게 남기고, 녹음이라 현장에서 지목이 불가능한데 문안도 누가 먼저인지 안 정해 줍니다. 결과는 «지금인가? 누가 먼저?» 하고 서로 눈치를 보는 공백입니다.\n★**「신랑님이 먼저, 신부님이 이어서 하십니다」에서 고쳤습니다.** 화면 지문이 「두 분이 **한 줄씩 번갈아** 낭독 · 마지막 한 문장은 함께」인데, 그 문안은 «신랑이 자기 서약을 통째로 먼저 읽는다»로 들립니다. 하객 화면에 그 지문이 그대로 뜨므로 말과 화면이 어긋납니다. 「첫 줄부터」로 맞추면 번갈아 읽는 설계와 어긋나지 않으면서 «누가 먼저»도 정해집니다.\n★어미를 지시형(「하십시오」)이 아니라 예고형(「하십니다」)으로 둔 것은 일부러입니다 — 바로 앞줄이 이미 「주십시오」이고, 지목의 압박보다 «이렇게 흘러갑니다»라는 예고가 더 편안합니다.","must":true,"kind":"문안","label":"혼인 서약 시작","voice":"진행","live":true},{"id":"22_narr-bless-open#0","clip":"22_narr-bless-open","now":"오늘 예식의 문을, 두 사람을 가장 오래 지켜봐 오신 부모님의 말씀으로 열겠습니다.","was":"오늘 예식의 문은, 두 사람을 가장 오래 지켜봐 오신 부모님의 말씀으로 열겠습니다.","why":"★사장님 판정(2026-09-20): 「전에 꺼가 더 좋다」. 맞습니다. 제가 「가장 오래 지켜봐 오신」을 선취로 보고 뺐는데 그건 «예우»입니다. 선취는 예고가 본문의 감정·결론에 미리 이름을 붙이는 것이고(「말로 다 못 한 감사를」), 사람을 높이는 수식어는 그게 아닙니다. ★그리고 제 근거 자체가 낡았습니다 — 진단이 이 수식어를 선취라 한 것은 «옛» 아버님 본문이 「보일러 고친 토요일」로 지켜봄을 입증했기 때문입니다. 새 본문은 「사실 나는 이 결혼을 한 번 말렸다」로 열립니다. 선취할 대상이 없어졌는데 옛 판정을 그대로 집행했습니다. ★「열겠습니다」도 되살립니다. 「엽니다」는 사실 중계이고 「열겠습니다」는 진행자가 여는 책임을 지는 어미입니다. 바로 옆 23의 「청하겠습니다」와도 앞뒤가 맞습니다. 고친 것은 조사 하나뿐입니다 — 「문은」은 여는 주체가 될 수 없으므로 「문을」로 바로잡았습니다.","must":true,"kind":"문안","label":"부모님 덕담: 문 여는 버전","voice":"진행","live":true},{"id":"22_narr-bless-open#1","clip":"22_narr-bless-open","now":"마이크를 받으시면 편히 말씀해 주십시오.","was":"마이크가 전해지면, 편히 말씀해 주시면 됩니다.","why":"23과 글자까지 같던 줄이고, 「~주시면 됩니다」는 대본 전체 14회 중 7회가 이 열 클립에 몰려 있습니다. 사장님이 손수 주신 대안 어미(주십시오)로 갑니다. ★2차 점검 — 1차안 「마이크가 가면 편히 시작하십시오」는 제가 너무 깎았습니다. 부모님께 드리는 말인데 「말씀」이라는 높임말이 사라졌고, 「가면」은 툭 던지는 느낌입니다. 그리고 「마이크가 전해지면」은 마이크가 주어라 부모님이 받는 쪽이 되는데, 「마이크를 **받으시면**」은 부모님이 주어가 됩니다. 어른을 움직이는 주체로 두는 쪽이 맞습니다.","must":false,"kind":"문안","label":"부모님 덕담: 문 여는 버전","voice":"진행","live":true},{"id":"14_narr-vow-out#0","clip":"14_narr-vow-out","now":"약속은 말로 끝나지 않습니다.","was":"방금 두 사람이 지킬 것을 말했습니다.","why":"사장님 원문 — 「조금더 고급스러운멘트 자연스럽게」. 왜 급이 낮은지가 실측으로 나옵니다. ①대상을 「것」으로 뭉갭니다 — 진행 클립에서 대상을 「것」으로 받는 줄은 14와 16 둘뿐인데 하필 연속된 두 클립입니다. ②뒤 클립들이 같은 순간을 「약속」이라 부르는데 받는 문장만 「지킬 것」입니다. ③★결정적 근거 — 사장님은 같은 병을 24번에서 한 번 더 지적하셨습니다(「방금 그 말은, 오늘 이 순간에만 있었습니다」 → 「의미를 더욱 더 특별하게 해주셨습니다 뭐 이런식으로」). «방금 ~했습니다»라는 사실 요약을 «그 말이 무엇을 했는가»로 한 겹 올리라는 같은 주문이 두 번 나온 것이고, 14는 아직 그 적용을 못 받았습니다. 그래서 사실 요약을 통째로 버리고 한 겹 올렸습니다. ★사장님이 24번에 주신 예시 어법(「~의 의미를 더욱 더 특별하게」)을 복사하지 않은 것도 일부러입니다 — 같은 예식에서 두 클립이 같은 구문으로 닫히면 새 중복이 생깁니다.","must":true,"kind":"문안","label":"혼인 서약 마무리","voice":"진행","live":true},{"id":"14_narr-vow-out#1","clip":"14_narr-vow-out","now":"오늘부터 두 사람이 그 약속을 살아갑니다.","was":"(없음 · 새로 넣습니다)","why":"실측 — 신랑 서약 137음절 + 신부 서약 191음절, 합 328음절을 받는 마무리가 15음절 한 문장입니다. 같은 진행자의 다른 마무리(입장 44~60 · 케이크 31 · 가족 인사 20 · 축배 19)와 견주면 예식에서 가장 무거운 순간의 마무리가 전체에서 가장 짧습니다. 귀로는 «급히 넘긴다»로 들립니다.\n★1차안은 「이 약속을 두 사람이 나눠 갖습니다」였는데 **반지를 예고합니다.** 적대적 검증이 막았습니다 — **14는 반지가 없는 예식에서도 성립해야 합니다.** 다리를 놓겠다면 «다음 순서»를 지목하지 말고 자리를 비워 두는 문장으로 닫으라는 조건입니다. 같은 자리에서 「방금 한 말을 손에 남기는 순서입니다」류가 이미 한 번 빠졌습니다 — 서약이 꺼지는 조합(기록형 + 편지)에서 가리킬 서약이 없어 틀린 말이 되기 때문입니다.\n★그래서 다음 순서를 안 가리키고 «그 약속이 어떻게 되는가»로 닫았습니다. 반지가 있으면 15번이 자연스럽게 받고, 없으면 이 문장만으로 끝나도 말이 됩니다.\n★하객에게 부탁하지 않습니다 — 26_vow-both 가 이미 「가까이서 오래 지켜봐 주세요」로 부탁하므로 14가 또 하면 부탁이 연달아 두 번이 됩니다.","must":false,"kind":"문안","label":"혼인 서약 마무리","voice":"진행","live":true},{"id":"24_narr-bless-end#0","clip":"24_narr-bless-end","now":"방금 그 말씀을, 오늘 이 자리에 계신 분들만 들으셨습니다.","was":"방금 그 말은, 오늘 이 순간에만 있었습니다.","why":"사장님 지적: 「방금그말씀은 … 더욱 더 특별하게 해주셨습니다 뭐이런식으로 멘트개선」. 격이 낮다는 지적으로 읽고 「말→말씀」·「들었다→들으셨습니다」로 높였습니다. 다만 «특별하게 해 주셨다»고 나레이션이 말하지는 않았습니다. 그건 하객이 정할 몫이고, 진행자가 먼저 정하면 덜 느낀 사람에게는 압력이 됩니다. ★2차 점검 — 진단이 이미 지적한 조사 문제를 제가 1차에서 빠뜨렸습니다. 「말씀**은**」(주제격)과 「분들**만**」(주격)이 한 문장에 겹치면 주어가 둘로 읽혀 낭독할 때 반 박자 걸립니다. 「말씀**을**」로 바꿉니다.","must":false,"kind":"문안","label":"부모님 덕담 마무리","voice":"진행","live":true},{"id":"15_narr-ring-in#0","clip":"15_narr-ring-in","now":"반지는 날마다 눈에 띕니다.","was":"(없음 · 새로 넣습니다)","why":"사장님이 직접 짚지는 않으셨지만 같은 병을 가장 심하게 앓는 자리입니다. 실측 — 16음절로 모든 여는 말 중 최단입니다(환영 17 · 가족 인사 21 · 자유 30 · 서약 40 · 덕담 47·52 · 헌정 52 · 온라인 54). 그런데 이 클립 뒤에 오는 실제 공백(반지를 끼우는 시간)은 이 구간에서 가장 깁니다. 녹음이라 그 공백에 아무 말도 얹을 수 없습니다. 지시 한 단뿐이라 «왜 지금 반지인가»가 없어, 앞 클립(약속)과 이 클립 사이의 연결이 끊깁니다. 그래서 앞에 «왜 반지인가»를 한 줄 답니다 — 14의 「약속은 말로 끝나지 않습니다」와 대구가 되어 두 클립이 한 문장처럼 이어집니다.","must":false,"kind":"문안","label":"반지 교환 시작","voice":"진행","live":true},{"id":"15_narr-ring-in#2","clip":"15_narr-ring-in","now":"말없이 지나가는 순서이니, 그대로 보고 계셔도 좋습니다.","was":"(없음 · 새로 넣습니다)","why":"가장 긴 무음을 덮는 줄입니다. 지금은 안내가 끝나자마자 무음이라, 두 사람은 준비가 덜 된 채 시작하고 하객 서른 명은 지금 봐도 되는지 찍어도 되는지 모른 채 어정쩡하게 앉아 있습니다. «조용한 것이 정상»이라고 미리 말해 주면 그 침묵이 사고가 아니라 순서가 됩니다. ★두 가지를 피했습니다 — ①「앉으신 자리에서 편히 보시면 됩니다」는 사장님이 41·42에서 「굳이 이멘트는없어도될거같아」로 두 번 지우신 문장이라 되살리지 않았습니다. 지운 말을 다른 자리에서 되살리는 것은 삭제 지시를 무르는 것과 같습니다. ②「~주시면 됩니다」를 바로 앞줄에 이어 쓰지 않으려고 어미를 「~해도 좋습니다」로 바꿨습니다(13에서 뺀 어미라 새 중복이 아닙니다).","must":false,"kind":"문안","label":"반지 교환 시작","voice":"진행","live":true},{"id":"16_narr-ring-out#1","clip":"16_narr-ring-out","now":"축하의 박수를 청합니다.","was":"(없음 · 새로 넣습니다)","why":"사장님 원문 — 「박수유도는?」. 실측이 그 구멍을 그대로 보여 줍니다. 박수를 유도하는 진행 클립은 13개인데(입장 6종 전부 · 성혼선언 4종 전부 · 케이크 2종 · 효과음), 예식에서 박수가 터지는 세 자리 가운데 반지만 0개입니다. 서른 명짜리 예식은 누가 먼저 치지 않으면 박수가 아예 안 납니다. 사회자가 있으면 눈짓으로 열 수 있지만 녹음은 말로만 열 수 있고, 지금 그 말이 없어서 두 사람이 반지를 끼우고 나면 아무 일도 안 일어난 채 다음으로 넘어갑니다. ★수식어 없이 「박수」만 쓴 것은 일부러입니다 — 「큰 박수」는 성혼선언 네 갈래가 전부 쓰고 「따뜻한 박수」는 1회차에서 입장 여섯 갈래가 쓰므로, 여기서 먼저 써 버리면 몇 분 뒤 진짜 정점이 같은 말을 되풀이해 힘이 빠집니다. 어미도 명령이 아니라 권유로 뒀습니다. ★자가검사가 잡았습니다 — 1차안 「박수로 축하해 주시면 좋겠습니다」는 바로 앞 클립 15의 「끼워 주시면 됩니다」와 「~주시면」이 붙어 버립니다. 두 클립이 연달아 나가므로 귀에 그대로 걸립니다. 15의 어미는 사장님이 직접 고쳐 두신 것이라 움직일 수 없으니 이쪽을 바꿨습니다. 「청합니다」는 진행자가 자기 책임으로 말을 거는 어미입니다 — 하객에게 부탁을 떠넘기지 않으면서 박수를 여는 말이고, 성혼선언의 「큰 박수」와도 입장의 「따뜻한 박수」와도 겹치지 않습니다.","must":true,"kind":"문안","label":"반지 교환 마무리","voice":"진행","live":true},{"id":"40_toast-toast#1","clip":"40_toast-toast","now":"앞에 놓인 잔을 들어 주십시오.","was":"앞에 놓인 잔을 천천히 들어 주시기 바랍니다.","why":"★게이트가 지키는 것은 「축배를 들겠습니다. 앞에 놓인 잔을」까지이고, 그 뒤는 자유입니다(대조 확인). 자가검사가 두 가지를 잡아 뒤를 고쳤습니다. ①「천천히」는 이 대본이 예식 전체에서 여섯 번 쓰는 닳은 낱말인데, 38번 「천천히 걸음을 옮겨 주십시오」와 한 예식에서 두 번 겹칩니다. 잔을 드는 동작에는 «천천히»가 없어도 뜻이 안 상합니다. ②「주시기 바랍니다」가 한 예식 부탁 어미 열 개 중 넷(40%)이었습니다 — 이 한 줄을 옮기니 30%로 내려갑니다.","must":false,"kind":"문안","label":"축배","voice":"진행","live":true},{"id":"40_toast-toast#2","clip":"40_toast-toast","now":"제 말 끝에 위하여, 하면 다 함께 위하여, 하고 답해 주시면 됩니다.","was":"제가 위하여, 하면 다 함께 위하여, 하고 답해 주세요.","why":"★사장님이 이 클립에 「어조 다시녹음」을 누르신 진짜 원인입니다. 예고는 「제가 위하여, 하면」인데 실제 선창은 「두 사람의 새로운 시작을 위하여!」입니다. 하객이 기다리는 신호와 실제로 오는 말이 다릅니다 — 「위하여」가 문장 첫머리에 올 줄 알고 기다리는데 문장 끝에 옵니다. 그래서 반 박자씩 어긋나고, 몇 명은 아예 놓칩니다. ★34번 하객 서약에서 사장님이 「유도가 약하고 따라 해야 하나 싶다」 하신 것과 **같은 병**입니다. 거기서 세운 기준을 그대로 씁니다 — «무엇을»·«언제»·«다 같이» 셋이 다 있어야 방이 한목소리로 답합니다. 여기는 «언제»가 틀려 있었습니다. 「제 말 끝에」로 고치면 예고와 실제가 맞습니다. ★어미도 함께 통일했습니다. 한 클립 안에서 「주시기 바랍니다」(합쇼체)와 「답해 주세요」(해요체)가 섞여 있었습니다. 코드 주석이 이 시연 문장을 이미 「하고 답해 주시면 됩니다」로 인용하고 있어, 그쪽으로 맞추면 주석·어조표·실황이 한 문장이 됩니다.","must":true,"kind":"문안","label":"축배","voice":"진행","live":true},{"id":"27_letter-parent#0","clip":"27_letter-parent","now":"두 사람이 부모님께 읽어 드릴 편지를 써 왔습니다.","was":"앞자리에 부모님이 계십니다.","why":"녹음은 그날의 좌석을 볼 수 없습니다. 부모님이 앞자리에 안 계신 예식, 한 분만 계신 예식에서 「앞자리에 부모님이 계십니다」는 그대로 거짓이 됩니다. ★2차 점검 — 1차안 「편지가 있습니다」는 존재만 말해서 밋밋했습니다. 「**써 왔습니다**」로 바꾸면 준비한 흔적이 드러납니다. 편지가 저절로 있는 게 아니라 두 사람이 앉아서 썼다는 사실이 들어가야, 뒤에 나올 본문이 무게를 받습니다.","must":true,"kind":"문안","label":"부모님께","voice":"진행","live":true},{"id":"27_letter-parent#1","clip":"27_letter-parent","now":"두 분, 직접 그 편지를 읽어 주시면 됩니다.","was":"두 사람이 쓴 편지를, 지금 직접 읽어 주시면 됩니다.","why":"사장님 지적: 「직접 그 특별한 편지를 읽어주시면됩니다 이런식으로 멘트개선」. 지시 대상이 두 사람이므로 「두 분,」으로 부르고 해요체로 갑니다. ★「특별한」은 뺐습니다. 편지가 특별하다고 진행자가 먼저 정하면 하객이 직접 느낄 자리가 없어집니다. ★2차 점검 — 「지금 직접」에서 「지금」을 뺐습니다. 「직접」이 핵심이고(당일엔 두 사람이 직접 읽는다) 「지금」은 군더더기입니다. 어순도 사장님이 쓰신 대로 「직접 그 편지를」로 돌렸습니다.","must":false,"kind":"문안","label":"부모님께","voice":"진행","live":true},{"id":"26_narr-close#1","clip":"26_narr-close","now":"다 같이 남기는 순서입니다.","was":"이제 다 같이 남기는 순서입니다.","why":"「이제」가 18·20·21 연달아 셋","must":true,"kind":"문안","label":"폐식·단체촬영 전환","voice":"진행","live":true},{"id":"38_tribute-in#0","clip":"38_tribute-in","now":"두 사람을 키워 주신 분들이 앞에 계십니다.","was":"두 사람을 키워 주신 분들 앞으로, 천천히 걸음을 옮겨 주십시오.","why":"★★[코드 회신 반영 2026-09-20] **제 제안을 물리고 저장소 판을 받습니다.** 게이트가 잡았고 읽어 보니 코드 쪽이 맞습니다.\n★제 안은 「…께 **인사를 드립니다**. 천천히 걸음을 옮겨 주십시오. 그동안 하객 여러분께서는…」이었는데, **순서가 어긋납니다** — «인사를 드립니다»(완료)라고 선언해 놓고 «걸음을 옮겨 주십시오»(이동)라고 합니다. 인사를 먼저 끝내 놓고 걸어가라는 꼴입니다.\n★저장소 판은 «상황(앞에 계십니다) → 이동(걸음을 옮기십시오) → 진행(인사를 드리는 동안)»으로 이어집니다. 그리고 이 문장들은 2026-09-20에 N2 위반(한 문장 안 3인칭+2인칭 혼용)을 풀며 둘로 가른 결과이고, 제가 26·64에서 받아들인 바로 그 해법입니다. 게이트가 지키고 있습니다(`[REJECT_38]`).\n★제가 «한 클립에 「인사를 드리」 두 번»을 이어 읽기로 잡은 것은 맞았고, **고칠 자리를 잘못 골랐습니다** — 저는 #2를 고쳤고 저장소는 #0을 고쳤습니다. 결과는 같은데 저장소 쪽이 순서까지 맞습니다.","must":true,"kind":"문안","label":"헌정 시작","voice":"진행","live":true},{"id":"38_tribute-in#1","clip":"38_tribute-in","now":"천천히 걸음을 옮겨 주십시오.","was":"(같은 문장에서 갈라 나왔습니다)","why":"3인칭 서술과 2인칭 지시를 두 문장으로 갈랐습니다. 사장님이 「주십시오」로 고치라 하신 어미는 그대로입니다.","must":false,"kind":"문안","label":"헌정 시작","voice":"진행","live":true},{"id":"38_tribute-in#2","clip":"38_tribute-in","now":"인사를 드리는 동안, 하객 여러분께서는 자리에 계셔 주시기 바랍니다.","was":"두 사람이 천천히 다가가는 동안, 그대로 지켜봐 주시면 됩니다.","why":"★위와 같은 자리 — 저장소 판을 그대로 받습니다.","must":true,"kind":"문안","label":"헌정 시작","voice":"진행","live":true},{"id":"44_end-0-photo#0","clip":"44_end-0-photo","now":"여기서부터는 사진입니다.","was":"여기서부터는 작가님이 안내해 드립니다.","why":"60이 같은 말을 한다 · 안내 목소리가 한 문장만 끼어든다 ★코워크 안 「사진 순서입니다」는 바로 앞 26 「남기는 순서입니다」와 겹쳐 게이트가 잡았다 · 「남기다」는 26·63이 쓰고 「찍다」는 이 대본이 하객에게 안 쓰므로 동사를 뺐다","must":true,"kind":"문안","label":"단체촬영 개시 신호","voice":"진행","live":true},{"id":"21_narr-declare-family-intro#0","clip":"21_narr-declare-family-intro","now":"두 사람의 성혼을, 오늘은 가족께서 선언하십니다.","was":"두 사람의 성혼을, 가족의 목소리로 선언하겠습니다.","why":"선언의 주어가 내레이터로 되어 있습니다. 「선언하겠습니다」는 말하는 사람이 자기가 선언한다는 뜻이라, 바로 뒤에 가족이 마이크를 잡으면 «누가 선언한 것인가»가 한 문장 안에서 갈리지 않습니다. 실제로 가족이 부담스러워하시면 폴백으로 32번이 나가는데 32번도 성우가 우성이라, 「가족의 목소리로」를 약속해 놓고 같은 내레이터 목소리가 이어지는 모순이 생깁니다. 주어를 가족으로 넘기면 두 경로 모두에서 말이 맞습니다. ★「직접」은 군더더기가 아니라 예우입니다 — 예고가 본문의 감정이나 결론에 미리 이름을 붙이면 선취지만, 사람을 높이는 수식은 그것과 다릅니다. 이 구분이 흐려져 22번에서 한 번 잘못 뺀 적이 있습니다. ★2차 수정 — 1차안 「가족께서 직접 선언하십니다」는 자가검사의 소리 항목이 잡았습니다. 「서·직·접·선」으로 치찰음이 네 음절 연달아 붙어 마이크에서 샙니다. 예우를 「직접」이라는 낱말 대신 「오늘은」이라는 자리 표시로 옮기니 소리도 풀리고, «오늘 이 예식에서는 가족이 하신다»는 뜻이 오히려 또렷해집니다.","must":false,"kind":"문안","label":"성혼 선언(가족) 도입","voice":"진행","live":true},{"id":"21_narr-declare-family-intro#1","clip":"21_narr-declare-family-intro","now":"준비되시면 그대로 읽어 주십시오.","was":"(없음 · 새로 넣습니다)","why":"말씀하실 분에게 시작 신호가 없습니다. 성격이 같은 22·23번은 둘 다 마이크가 전해지는 시점을 신호로 주는데 21번에는 그게 없어서, 가족은 마이크를 든 채 언제 시작할지 모릅니다 — 녹음 진행이라 아무도 대신 신호를 못 줍니다. 1문장 21음절은 예식에서 가장 무거운 순서로 넘어가는 다리치고 얇기도 합니다. ★「마이크가 전해지면, 편히 말씀해 주시면 됩니다」를 그대로 가져오지 않았습니다. 그 문장은 이미 22·23번에 두 번 있고(제가 0회차에서 22번을 「마이크를 받으시면 편히 말씀해 주십시오」로 확정했습니다), 여기에 또 쓰면 한 예식에서 같은 안내를 세 번 하게 됩니다. ★「그대로 읽어」로 쓴 것은 실제 운영과 맞물립니다 — 준비 안내가 「선언문은 큰 글씨로 인쇄해 당일 손에 들려 드려요」라서, 가족께서 손에 든 것을 그대로 읽으시면 된다는 말이 가장 부담을 덜어 드립니다.","must":false,"kind":"문안","label":"성혼 선언(가족) 도입","voice":"진행","live":true},{"id":"60_narr-photo-split#0","clip":"60_narr-photo-split","now":"나눠서 담겠습니다.","was":"이제 나눠서 담겠습니다.","why":"위와 같음","must":true,"kind":"문안","label":"나눠 담기 · 대기 안내","voice":"진행","live":true},{"id":"61_narr-round-open#0","clip":"61_narr-round-open","now":"두 사람이 여러분 곁으로 찾아뵙겠습니다.","was":"두 사람이 이제 여러분 곁으로 찾아뵙겠습니다.","why":"위와 같음 · 문중이라 문두검사에 안 걸렸다","must":true,"kind":"문안","label":"하객과 함께 시작","voice":"진행","live":true},{"id":"63_narr-final-warn#0","clip":"63_narr-final-warn","now":"마지막으로 다 함께 한 장을 남기겠습니다.","was":"잠시 뒤, 마지막으로 다 함께 한 장을 남기겠습니다.","why":"★「잠시 뒤」를 뺍니다. 설계는 이 클립이 «예고»이고 64번이 5분쯤 뒤의 «호출»인데, 실제 엔진에서는 63번에 대기 시간이 없어 64번이 **2초 뒤에 자동으로 붙습니다.** 그래서 하객은 「잠시 뒤, … 남기겠습니다. 이제 마지막 한 장입니다.」를 한 호흡에 듣습니다 — 「잠시 뒤」라 해 놓고 곧바로 「이제」가 오는 모순입니다. 문안만 고쳐서는 이 모순이 안 풀리므로, 두 클립을 «이어진 한 덩어리»로 보고 다시 짰습니다. ★진짜 5분 간격이 필요하면 63번에 대기 시간을 주어야 하는데 그건 엔진 변경이라 사장님 확인 없이 하지 않습니다.","must":false,"kind":"문안","label":"마지막 사진 예고","voice":"진행","live":true},{"id":"64_narr-final-call#0","clip":"64_narr-final-call","now":"가까이 모여 주시면 됩니다.","was":"두 사람 곁으로 모이시면 됩니다.","why":"26의 「두 사람 곁에」와 겹친다 · 어디로인지는 63이 말했다","must":true,"kind":"문안","label":"모이는 신호","voice":"진행","live":true},{"id":"45_end-1a-farewell#1","clip":"45_end-1a-farewell","now":"편히 움직이셔도 좋습니다.","was":"편히 일어나셔서 움직이세요.","why":"바로 앞 단체사진이라 하객이 이미 서 있다","must":true,"kind":"문안","label":"촬영 종료 → 배웅 전환","voice":"안내","live":true},{"id":"45_end-1a-farewell#2","clip":"45_end-1a-farewell","now":"두고 가시는 물건이 없는지만 한 번 살펴 주시기 바랍니다.","was":"두고 오신 물건이 없는지만 한 번 살펴 주세요.","why":"「두고 오신」은 «여기 올 때 두고 온 것»으로 읽힙니다. 지금 확인해야 하는 것은 «여기에 두고 가는 것»입니다. 한 낱말 차이인데 방향이 반대입니다. ★어미는 「주세요」에서 「주시기 바랍니다」로 옮겼습니다 — 부탁 어미 섞임 검사가 「주세요」를 한 예식 열일곱 개 중 여덟(47%)으로 잡았습니다. 바로 앞줄(45#1)이 이미 「~세요」로 체인을 끊어 주므로 이 줄까지 「세요」일 필요가 없고, 하객 전체에게 하는 당부라 합쇼체가 더 맞습니다.","must":false,"kind":"문안","label":"촬영 종료 → 배웅 전환","voice":"안내","live":true},{"id":"47_end-2-goodbye#0","clip":"47_end-2-goodbye","now":"끝까지 자리를 지켜 주신 여러분께 감사드립니다.","was":"끝까지 함께해 주셔서 감사합니다.","why":"「함께해 주셔서」가 하객맞이 첫 클립에도 있어, 한 예식에서 「함께해 주」가 네 번 들립니다. 예식의 첫 소리와 마지막 소리가 같은 말이면 그 사이가 지워집니다. ★1차안 「오늘 끝까지 자리를 지켜 주셔서 감사합니다」는 소리 검사가 잡았습니다 — 「주셔서」가 ㅈ·ㅅ·ㅅ 세 음절 연달아라 마이크에서 샙니다. 게다가 「오늘」로 여는 문장이 이 구간에 이미 셋입니다. 받는 사람을 「여러분께」로 세우고 「감사드립니다」로 닫으니 둘 다 풀립니다.","must":false,"kind":"문안","label":"배웅 마무리 · 귀가 인사","voice":"안내","live":true},{"id":"47_end-2-goodbye#1","clip":"47_end-2-goodbye","now":"여러분이 계셔서 두 사람의 처음이 외롭지 않았습니다.","was":"오늘 여러분과 함께한 이 자리가, 두 사람의 시작입니다.","why":"★새 문장을 짓지 않고 **2026-09-12에 이미 정해져 있던 문장을 되살립니다.** 그때 이 자리를 이 문장으로 정한 작업의 명시 목적이 「배웅 · 「이 자리」·「채우다」 중복 + 군말 제거」였고, 「무생물 주어 0.0」이라는 수치가 그 결과로 남아 있습니다. 그런데 오늘 다른 작업이 「이 자리」와 무생물 주어를 둘 다 되돌려 놓았고, 「처음」을 「시작」으로 바꿔 놓았습니다 — 「시작」은 한 예식에 여섯 번에서 여덟 번 나오는 낱말입니다. 옛 문장은 주어가 사람이고, 「이 자리」도 「시작」도 없습니다. 지금 것보다 낫습니다.","must":false,"kind":"문안","label":"배웅 마무리 · 귀가 인사","voice":"안내","live":true},{"id":"08_entry-D#0","clip":"08_entry-D","now":"여러 해가 걸려 두 사람이 서로에게 닿았습니다.","was":"오랜 계절을 지나, 두 사람이 서로에게 닿았습니다.","why":"①앞머리 쉼표절을 풉니다. ②이 갈래는 「계절」을 두 문장에서 씁니다. ③「오랜 계절을 지나」는 관념이고 「여러 해」는 세어 보이는 말입니다. ★회차 합산 점검 — 「두 사람이」로 여는 문장을 줄이려고 어순을 바꿨습니다. 걸린 시간이 앞에 오면 이 갈래(감성·시적)의 결에도 맞습니다.","must":false,"kind":"문안","label":"감성·시적","voice":"진행","live":true},{"id":"08_entry-D#1","clip":"08_entry-D","now":"오늘 그 문이 열립니다.","was":"오늘 이 문이 열리면, 두 사람의 새로운 계절이 시작됩니다.","why":"「계절」 두 번째를 없앱니다. 그리고 이 갈래의 힘은 긴 설명이 아니라 짧은 한 줄에 있습니다 — 「문이 열립니다」는 어느 예식에서나 참이면서 눈앞에서 벌어지는 일이라, 녹음인데도 그 자리의 말이 됩니다.","must":false,"kind":"문안","label":"감성·시적","voice":"진행","live":true},{"id":"08_entry-D#2","clip":"08_entry-D","now":"따뜻한 박수로 그 처음을 맞아 주시기 바랍니다.","was":"따뜻한 박수로, 그 처음을 함께 맞아 주시기 바랍니다.","why":"세 번째 쉼표절을 풉니다. 「함께」는 박수라는 말에 이미 들어 있습니다.","must":false,"kind":"문안","label":"감성·시적","voice":"진행","live":true},{"id":"12_narr-welcome-out#0","clip":"12_narr-welcome-out","now":"지금 들으신 것이 두 사람의 첫 인사였습니다.","was":"두 사람이 오늘 처음 건넨 말이었습니다.","why":"★「오늘 처음 건넨 말」은 녹음이 확인할 수 없는 단정입니다. 두 사람은 아침부터 하객을 맞으며 이미 여러 말을 건넸을 수 있습니다. 같은 병을 24번 진단이 이미 규칙으로 세워 뒀습니다 — «녹음은 현장 내용을 평가하거나 단정할 수 없다». 그 규칙이 미진단 클립에는 적용되지 않아 규칙 자체가 반쪽이었습니다.\n★앞머리도 함께 바꿨습니다. 1차안 「두 사람의 첫 인사였습니다」는 11·58·59번이 전부 「두 사람이/두 사람의」로 열어 한 예식에서 네 문장이 같은 박자로 출발합니다. 「지금 들으신 것이」로 열면 박자가 갈리고, 받는 말이 «방금 지나간 것»을 가리킨다는 것도 분명해집니다.","must":true,"kind":"문안","label":"환영 마무리","voice":"진행","live":false},{"id":"23_narr-bless-mid#0","clip":"23_narr-bless-mid","now":"이제 두 사람을 가장 오래 지켜봐 오신 부모님께 한 말씀 청하겠습니다.","was":"이제, 두 사람을 가장 오래 지켜봐 오신 부모님께 한 말씀 청하겠습니다.","why":"★2026-09-20 코드 실측으로 정정. 22 와 23 은 삼항 분기라 «한 예식에 하나만» 나갑니다. 「가장 오래 지켜봐 오신」이 두 번 들릴 일이 없으므로 23 에서 「가장」을 뺄 이유가 없었습니다. 그리고 사장님이 이미 판정하셨듯 「가장 오래 지켜봐 오신」은 군더더기가 아니라 «예우»입니다. 배타를 모르고 중복으로 본 탓에 예우를 깎았던 것이라 되돌립니다. 앞머리 쉼표(「이제,」)만 그대로 풉니다.","must":true,"kind":"문안","label":"부모님 덕담: 중간 버전","voice":"진행","live":true},{"id":"23_narr-bless-mid#1","clip":"23_narr-bless-mid","now":"마이크가 가면, 서두르지 마시고 시작하십시오.","was":"마이크가 전해지면, 편히 말씀해 주시면 됩니다.","why":"★2026-09-20 코드 6절 지적 반영. 1차안 「서두르지 마시고 편한 때에 시작하십시오」는 마이크 그림이 통째로 빠져 있었습니다. 22 와 글자가 같아지는 것을 피하려고 뺐던 것인데, 두 클립이 배타라 같아져도 한 예식에서 두 번 들릴 일이 없습니다 — 피할 이유가 없는 것을 피하다가 필요한 정보를 잃었습니다. 게다가 23 은 «편지 뒤 자리»라 마이크가 아직 부모님께 안 가 있을 수 있어, 이 그림이 22 보다 오히려 더 필요합니다. 22 의 「마이크를 받으시면」과는 말을 달리해 두었습니다.","must":false,"kind":"문안","label":"부모님 덕담: 중간 버전","voice":"진행","live":true},{"id":"25_narr-bless-end-long#0","clip":"25_narr-bless-end-long","now":"하고 싶은 말씀을 다 하신 분은 아마 안 계실 겁니다.","was":"오래 지켜봐 오신 마음은 한 번에 다 말해지지 않습니다.","why":"①주어가 「마음」이라 눈에 안 보이는 것을 단정하게 됩니다. 사람을 주어로 내리면 같은 뜻이 관찰이 됩니다. ②「말해지지 않습니다」는 피동이라 누가 말하는지가 사라집니다. ③「마음」은 이 구간에 아홉 번 나와 세 순서가 한 덩어리로 뭉개지는 주범입니다. ★2차 점검 — 1차안 「없을 겁니다」는 주체 높임이 빠졌습니다. 주어가 「분」이니 높여야 하는데, 「없으실」은 존재를 부정하는 자리라 어색합니다. 「안 계실 겁니다」가 맞습니다.","must":false,"kind":"문안","label":"부모님 덕담 마무리: 길었을 때","voice":"진행","live":false},{"id":"25_narr-bless-end-long#1","clip":"25_narr-bless-end-long","now":"못 하신 말씀은 두 사람이 살면서 듣게 됩니다.","was":"나머지는 두 사람이 살면서 듣습니다.","why":"사장님 수정 문면은 「듣겠습니다」였습니다. 그대로 쓰면 주어(두 사람)와 어미(화자의 의지)가 어긋나 귀에 걸립니다. 단정을 눅이시려던 뜻으로 읽고 「듣게 됩니다」로 받았습니다. ★2차 — 새 [13] 본문이 「나머지 얘기는 이따 저쪽 자리에서 하자」로 끝나서, 제 원안 「나머지는…」이 바로 뒤에서 같은 낱말을 되풀이했습니다. ★3차 자가검사 — 2차안의 「오늘 못 하신」에서 「오늘」을 뺐습니다. 「오늘」로 여는 문장이 한 예식에 셋이 되는데(22·25·39), 22는 덕담을 여는 신호라 필요하고 39는 「오늘 가족이 되었다」가 문장의 전부라 못 뺍니다. 여기 「오늘」이 셋 중 가장 덜 일합니다. 앞 줄이 이미 오늘 이야기라 빼도 뜻이 그대로입니다.","must":false,"kind":"문안","label":"부모님 덕담 마무리: 길었을 때","voice":"진행","live":false},{"id":"28_letter-each#0","clip":"28_letter-each","now":"서로에게 쓴 편지를 읽겠습니다.","was":"두 사람이 서로에게 쓴 편지가 있습니다.","why":"★3차 자가검사 — 1차·2차안 「두 사람이 서로에게 쓴 편지를 읽습니다」는 27#0과 앞 여섯 자가 같습니다(「두 사람이 」). 27·28·29는 한 예식에서 하나만 나가지만 고객은 미리듣기로 셋을 연달아 듣습니다. 같은 자리에서 같은 말로 출발하면 셋이 한 덩어리로 들립니다. 27은 「두 사람이 … 써 왔습니다」로 준비를 말하고, 28은 진행자가 「읽겠습니다」로 순서를 여는 모양으로 갈랐습니다.","must":false,"kind":"문안","label":"서로에게","voice":"진행","live":true},{"id":"28_letter-each#1","clip":"28_letter-each","now":"두 분, 마주 보고 읽어 주시면 됩니다.","was":"지금 직접 읽어 주시면 됩니다.","why":"「마주 보고」는 어느 예식에서나 참이면서 그 자리의 그림을 만듭니다. 관념 대신 눈앞에서 벌어지는 것을 넣으면 녹음인데도 그 자리의 말이 됩니다.","must":true,"kind":"문안","label":"서로에게","voice":"진행","live":true},{"id":"29_letter-both#0","clip":"29_letter-both","now":"편지가 두 번 이어집니다.","was":"두 사람이 편지를 두 통 썼습니다.","why":"「두 통」이 틀릴 수 있습니다 — 각자 쓰면 네 통이고 한 사람만 쓰는 예식도 있습니다. 세는 대상을 «통»이 아니라 «읽는 횟수»로 옮기면 어느 경우에나 참입니다. ★3차 자가검사 — 2차안 「오늘은 편지를 두 번 읽습니다」는 「오늘」로 여는 문장이 이 회차에 세 개가 되게 만듭니다(22·29·39). 같은 박자로 출발하는 문장이 늘면 그게 「다다다」로 들립니다. 주어를 「편지」로 두고 자동사로 받으면 「오늘」이 필요 없어지고, 다음 줄 「부모님께 먼저, 그리고 서로에게」가 그 둘을 그대로 설명합니다.","must":false,"kind":"문안","label":"부모님께, 그리고 서로에게","voice":"진행","live":true},{"id":"29_letter-both#1","clip":"29_letter-both","now":"부모님께 먼저, 그리고 서로에게.","was":"부모님께 한 통, 서로에게 한 통입니다.","why":"사장님 지적: 「3인칭 화법도 괜찮을거같아」. 체언으로 끊어 리듬을 바꿉니다. 이 구간 26문장 중 체언으로 끝나는 문장이 하나도 없어서, 여기 하나만 넣어도 같은 박자로 떨어지던 흐름이 풀립니다.","must":true,"kind":"문안","label":"부모님께, 그리고 서로에게","voice":"진행","live":true},{"id":"29_letter-both#2","clip":"29_letter-both","now":"두 분, 차례로 읽어 주시면 됩니다.","was":"차례로 읽어 주시면 됩니다.","why":"앞 두 줄은 하객에게 하는 3인칭 서술로 두고, 마지막 지시만 두 사람에게 돌립니다. 사장님이 원하신 3인칭 화법과 지시가 한 클립 안에서 갈립니다.","must":true,"kind":"문안","label":"부모님께, 그리고 서로에게","voice":"진행","live":true},{"id":"32_declare-family#3","clip":"32_declare-family","now":"한 분도 빠짐없이, 큰 박수를 보내 주시기 바랍니다.","was":"가족 여러분과 함께, 두 사람에게 큰 박수를 보내 주시기 바랍니다.","why":"이 구간에서 고칠 값이 있는 유일한 줄입니다. 말하는 사람이 가족인데 듣는 사람까지 가족으로 한정해서, 서른 명 가운데 가족이 아닌 분들은 자기가 들은 말인지 아닌지 알 수 없습니다. 부르는 말을 지우고 자리 전체를 담게 바꿨습니다. ★새 어조표의 같은 자리 문장(「모두 함께, 큰 박수를 보내 주시기 바랍니다」)을 그대로 옮기지 않았습니다 — 어조표는 «고객이 어조를 고른 칸»이라, 현행에 그대로 앉히면 고른 예식과 안 고른 예식이 같은 글을 다른 녹음으로 트는 상태가 됩니다.","must":true,"kind":"문안","label":"가족 낭독 · 당일 대체용 폴백","voice":"진행","live":false},{"id":"33_declare-ask-a#1","clip":"33_declare-ask-a","now":"「네, 그러겠습니다」 한마디면 됩니다.","was":"짧은 한마디면 됩니다.","why":"무엇을 답할지는 끝내 알려 주지 않아서, 예고가 준비를 시키지 못하고 긴장만 만듭니다. 「짧은 한마디」는 분량만 말할 뿐 내용이 없습니다. 답할 말을 여기서 알려 주면 예고가 제 몫을 하고, 열두 클립 뒤 실제 순서에서 하객이 처음 듣는 말이 아니게 됩니다. ★34번을 「가르치고 → 묻고 → 비운다」로 재배열하자는 제안은 채택하지 않았습니다(34번 항목에 이유를 적었습니다). 그래서 «가르치는» 몫을 33번이 맡습니다 — 원래 예고의 역할이기도 합니다.","must":false,"kind":"문안","label":"개식 직후 예고","voice":"진행","live":false},{"id":"34_declare-ask-b#1","clip":"34_declare-ask-b","now":"그 약속에는 증인이 필요합니다.","was":"이제 그 약속에 여러분의 이름이 함께 남습니다.","why":"이 구간에서 문안을 고칠 수 있는 유일한 줄입니다. 「여러분의 이름이 함께 남습니다」는 어디에 어떻게 남는지 근거가 없습니다. 집 규칙 「근거 없는 포괄 보증 금지 — 안심 문구엔 누가·무엇으로를 붙인다」에 그대로 걸리고, 같은 라운드에서 「마음이 … 함께합니다」류 추상 주어를 걷어낸 것과 같은 종류입니다. 서른 명이 전부 아는 사이인 자리에서 지키지도 못할 약속을 하객에게 지우는 무게도 과합니다. 대신 지금 일어난 사실만 말하고 바로 다음 질문의 발판을 놓았습니다 — 「증인이 필요합니다」 다음에 「기억해 주시겠습니까?」가 오면, 질문이 부탁이 아니라 «맡기는 말»이 됩니다.","must":false,"kind":"문안","label":"차례 넘기기 + 답 지정 + 질문","voice":"진행","live":false},{"id":"34_declare-ask-b#4","clip":"34_declare-ask-b","now":"제가 여쭙고 나면, 다 같이 답해 주십시오.","was":"(없음 · 새로 넣습니다)","why":"사장님이 「유도가 약하다 · 따라 해야 하나 싶을 것 같다」 하신 자리를 메우는 한 줄입니다.\n★사람 사회자가 방에서 한목소리를 끌어낼 때 쓰는 것은 셋입니다 — «무엇을 말할지»·«언제 말할지»·«다 같이». 지금 대본에는 «무엇을»만 있었습니다(시범 「네, 그러겠습니다」). «언제»는 통째로 없고, 「다 같이」는 가르치는 줄에 붙어 있어 질문에서 세 문장이나 떨어져 있었습니다. 그래서 하객 귀에는 「다 같이 따라 읽어라」로도 들립니다 — 사장님이 들으신 이질감의 정체가 이것입니다.\n★이 한 줄이 «언제»(제가 여쭙고 나면)와 «다 같이»를 함께 싣고, 질문 바로 앞에 섭니다. 하객이 마지막으로 들은 지시가 「답해 주십시오」이고 그 다음이 곧바로 질문이라, 답할 자리가 어긋나지 않습니다.\n★1차안은 「그럼 여쭙겠습니다」였습니다. «이제부터 진짜 질문»이라는 금은 그어 주지만 «언제 답하라»는 여전히 안 알려 줍니다. 사장님 지적의 핵심이 «언제»였으므로 그쪽을 실었습니다.\n★어미를 「주십시오」로 둔 것은 이 순간만큼은 권유가 아니라 지시여야 하기 때문입니다. 「~하시면 됩니다」로 내리면 «해도 되고 안 해도 되고»로 들려 서른 명이 서로 눈치를 봅니다.","must":true,"kind":"문안","label":"차례 넘기기 + 답 지정 + 질문","voice":"진행","live":false},{"id":"35_declare-ask-c#0","clip":"35_declare-ask-c","now":"이 약속은 두 사람만의 것이 아닙니다.","was":"(없음 · 새로 넣습니다)","why":"하객이 방금 소리 내어 답했는데 대본이 그 답을 받지 않고 바로 선언으로 넘어갑니다. 서약형 갈래를 따로 만든 이유가 마지막 두 문장에서 증발합니다.\n★「여러분의 대답을 들었습니다」류로 메우지 않았습니다 — 녹음은 현장 반응을 확인할 수 없고 서른 명 규모에서 아무도 소리 내지 않을 수 있어, 같은 자리에 「방금 그 대답까지가, 오늘의 약속입니다」를 넣었다가 규칙 검사에 걸려 뺀 기록이 이미 있습니다. 이 문장은 하객이 답했든 안 했든 참입니다.\n★30번의 「이 약속은 오늘부터 두 사람의 것입니다」와 뜻이 반대로 보이지만, 30(기본 선언)과 35(하객 서약형)는 배타라 한 예식에 같이 나가지 않습니다. 다만 «배타를 문안으로 드러내자»를 설계 목표로 삼지는 않았습니다 — 한쪽만 읽는 사람이 모순으로 오해해 고치려 들 수 있습니다.\n★35_declare-ask-c.mp3 재녹음이 따라오고, 원천 두 곳(ritual-data.js DECLWHO.ask.end · ritual-cue.js EXTRA)을 «같이» 고쳐야 합니다 — 갈라지면 거울 검사가 붉습니다.","must":true,"kind":"문안","label":"마무리 + 받아 넘기기","voice":"진행","live":false},{"id":"41_toast-cake#0","clip":"41_toast-cake","now":"케이크 앞에 두 사람이 섰습니다.","was":"두 사람이 케이크 앞에 섰습니다.","why":"어순만 바꿨습니다. 「두 사람이 …」로 열면 짝인 77번 「두 사람이 함께 해낸 첫 번째 일이었습니다」와 앞머리 여섯 자가 같습니다. 두 클립은 케이크를 자르는 시간만 사이에 두고 이어지는 입구와 출구라 그 반복이 그대로 들립니다. 77번은 사장님이 「다시」를 안 누르신 줄이라 이쪽을 옮겼습니다.\n★「케이크 앞에 나란히 섭니다」는 게이트가 막고 있습니다 — 2026-09-09에 사장님이 「내립니다, 나란히 섭니다, 너무 형식적이고 딱딱한 것 같아」 하셔서 걷어낸 말입니다. 이 문장은 그것과 다르고, 과거형이라 녹음이 현장을 단정하지도 않습니다.","must":false,"kind":"문안","label":"케이크 커팅","voice":"진행","live":true},{"id":"41_toast-cake#1","clip":"41_toast-cake","now":"두 분, 나이프를 함께 잡아 주세요.","was":"앉으신 자리에서 편히 보시면 됩니다.","why":"★이 구간에서 가장 큰 구멍을 메우는 줄입니다. 지금 이 클립은 세 문장 중 둘이 하객 지시이고, **정작 칼을 잡는 두 사람에게 주는 말이 한 줄도 없습니다.** 사회자가 없는 녹음 예식이라 디렉터가 말로 끼어들 수 없는데, 동작을 하는 사람이 큐를 못 받습니다. 게다가 짝이 되는 77번이 「나이프는 그대로 두셔도 좋습니다」로 **해제**를 하는데 여기에는 잡으라는 말이 없어 입구와 출구가 어긋나 있었습니다.\n★「앉으신 자리에서 편히 보시면 됩니다」는 사장님이 41·42 두 곳에서 「굳이 이 멘트는 없어도 될 거 같아」로 두 번 지우라 하신 문장입니다. 그 자리를 두 사람에게 주는 말로 바꿨습니다.\n★「두 분, 나이프를 함께 잡아 주세요」는 사장님이 실청에서 듣고 「다시」를 안 누르신 문장입니다.\n★일부러 안 쓴 것 넷 — ①카운트(「하나, 둘, 셋」)는 2026-08-17에 폐지됐습니다(사장님: 「이런 사진 관련 하나둘셋 이런 건 사진작가가 하는 게 맞는 것 같아」). ②「이제 두 사람이 천천히, 함께 내립니다」는 2026-09-09 지적으로 걷어낸 말입니다. ③동작을 「잡아 주세요 → 셋을 세면 → 내려 주세요」로 쪼개지 않았습니다 — 사장님이 「행동을 너무 쪼개서 강요」라 하신 그 구조입니다. ④「가장 달콤한 순간」 계열은 게이트가 상투어로 막고 있습니다.\n★코드 몫 — 이 삭제는 게이트를 건드립니다. 2026-09-12 워크플로가 42번에 이 문장이 없다며 «일부러 넣은» 것이라 지금 게이트가 정확히 2줄을 «강제»하고 있습니다. 같은 커밋에서 그 검사를 걷어내고, 2026-09-12 결정을 사장님 지시로 뒤집는다는 근거를 영문 대문자 이름으로 남겨야 합니다(예: SEAT_LINE_RETIRED).","must":true,"kind":"문안","label":"케이크 커팅","voice":"진행","live":true},{"id":"42_toast-both#0","clip":"42_toast-both","now":"케이크 앞에 두 사람이 섰습니다.","was":"두 사람이 케이크 앞에 섰습니다.","why":"어순만 바꿨습니다. 「두 사람이 …」로 열면 짝인 77번 「두 사람이 함께 해낸 첫 번째 일이었습니다」와 앞머리 여섯 자가 같습니다. 두 클립은 케이크를 자르는 시간만 사이에 두고 이어지는 입구와 출구라 그 반복이 그대로 들립니다. 77번은 사장님이 「다시」를 안 누르신 줄이라 이쪽을 옮겼습니다.\n★「케이크 앞에 나란히 섭니다」는 게이트가 막고 있습니다 — 2026-09-09에 사장님이 「내립니다, 나란히 섭니다, 너무 형식적이고 딱딱한 것 같아」 하셔서 걷어낸 말입니다. 이 문장은 그것과 다르고, 과거형이라 녹음이 현장을 단정하지도 않습니다.","must":false,"kind":"문안","label":"둘 다","voice":"진행","live":true},{"id":"42_toast-both#1","clip":"42_toast-both","now":"두 분, 나이프를 함께 잡아 주세요.","was":"앉으신 자리에서 편히 보시면 됩니다.","why":"폐지 전까지는 41번과 같이 갑니다. 폐지되면 이 줄은 사라집니다.","must":false,"kind":"문안","label":"둘 다","voice":"진행","live":true},{"id":"48_online-3-welcome#0","clip":"48_online-3-welcome","now":"화면으로 보고 계신 분들, 반갑습니다.","was":"화면으로 함께해 주시는 분들, 반갑습니다.","why":"「함께해 주」가 한 예식에 네 번 나오고, 그중 이 클립과 62번(온라인 인사)이 같은 사람에게 하는 말입니다. 둘 중 하나는 다른 말이어야 합니다. 62번은 「멀리서 함께해 주신 분들께」로 두고 이쪽을 옮겼습니다 — 이 클립은 화면을 보고 있는 그 순간에 직접 말을 거는 자리라 「보고 계신」이 더 정확합니다.","must":false,"kind":"문안","label":"온라인 참석자 환영","voice":"안내","live":true},{"id":"48_online-3-welcome#1","clip":"48_online-3-welcome","now":"멀리 계셔도 오늘을 같이 보시라고 연 자리입니다.","was":"멀리 계신 분도 오늘을 같이 보시라고 연 자리입니다.","why":"한 클립에서 2인칭(#0 보고 계신 분들)에서 3인칭으로 흔들린다 [VOICE_2ND] 온라인판","must":true,"kind":"문안","label":"온라인 참석자 환영","voice":"안내","live":true},{"id":"48_online-3-welcome#2","clip":"48_online-3-welcome","now":"같은 시간에 계신 것으로 충분합니다.","was":"같은 시간에 함께 계신 것으로 충분합니다.","why":"「함께」만 뺐습니다. 「같은 시간에 계신 것」이 이미 함께라는 뜻이고, 이 구간에서 「함께」가 겹칩니다. ★이 문장 자체는 좋습니다 — 못 온 것을 미안해할 필요가 없다고 말해 주는 유일한 줄이라 그대로 지킵니다.","must":false,"kind":"문안","label":"온라인 참석자 환영","voice":"안내","live":true},{"id":"58_narr-free-in#0","clip":"58_narr-free-in","now":"이어서 두 사람이 따로 준비한 순서가 있습니다.","was":"이제, 두 사람이 따로 준비한 시간이 있습니다.","why":"「시간」을 「순서」로 바꿨습니다. 무엇이 나올지 모르는 자리라 «순서»라고 불러야 하객이 «지금부터 뭔가 진행된다»를 받습니다. 「시간」은 비어 있는 자리처럼 들립니다.\n★앞머리 쉼표(「이제,」)를 풀고 「이어서」로 바꿨습니다. 쉼표를 그냥 지우면 「두 사람이」로 열게 되는데, 11번이 이미 「두 사람이 준비한 첫 인사가 있습니다」로 열어 같은 박자가 됩니다. 「이어서」는 앞 순서에서 넘어온다는 것까지 알려 주므로 한 낱말이 두 몫을 합니다.","must":false,"kind":"문안","label":"자유 한 칸 여는 말","voice":"진행","live":true},{"id":"58_narr-free-in#1","clip":"58_narr-free-in","now":"함께 봐 주시기 바랍니다.","was":"잠시 함께 봐 주시기 바랍니다.","why":"「잠시」를 뺐습니다. 두 사람이 무엇을 준비했는지 녹음은 모릅니다 — 3분일 수도 있고 10분일 수도 있는데 「잠시」라고 해 두면 길어질 때 하객이 «언제 끝나나» 하게 됩니다. 그리고 1회차에서 확정한 입장 도착 멘트 여섯이 전부 「잠시, 서로를 바라봐 주세요」로 닫아서 한 예식에 「잠시」가 두 번 나가기도 합니다.","must":false,"kind":"문안","label":"자유 한 칸 여는 말","voice":"진행","live":true},{"id":"62_narr-online-in#0","clip":"62_narr-online-in","now":"멀리서 함께해 주신 분들께, 두 사람이 인사를 드리겠습니다.","was":"두 사람이 잠시, 멀리서 함께해 주신 분들께 인사를 전하겠습니다.","why":"「전하겠습니다」를 「드리겠습니다」로 바꿨습니다. 인사는 «전하는» 것보다 «드리는» 것이 이 대본의 결에 맞습니다. ★「전합니다」류 평서로 되돌리지 않았습니다 — 오늘 사장님 지시로 「겠」이 들어간 낱말이라 평서로 내리면 그 결정을 하루 만에 무르게 됩니다. ★자가검사가 앞머리를 잡아 어순도 바꿨습니다 — 26·61번이 이미 「두 사람이」로 열어 한 예식에서 세 문장이 같은 박자로 출발합니다. 61번 앞머리는 뒤쪽이 게이트라 자유도가 적고 26번은 이미 한 번 옮겼으므로, 여기서 받는 사람을 앞으로 보냈습니다. 「멀리서 함께해 주신 분들께」를 먼저 부르면 누구에게 하는 인사인지가 첫마디에서 정해집니다.","must":false,"kind":"문안","label":"온라인 인사로 부르기","voice":"진행","live":true},{"id":"62_narr-online-in#1","clip":"62_narr-online-in","now":"두 분, 카메라 쪽으로 몸을 돌려 주세요.","was":"화면 너머에도 오늘이 닿도록, 카메라 쪽으로 몸을 돌려 주시면 됩니다.","why":"두 가지를 고쳤습니다. ①호칭이 없습니다. 집 규칙이 「동작 문장의 호칭은 「두 분」(2인칭) · 감정 문장은 「두 사람」(3인칭)」으로 정해져 있고, 이유도 적혀 있습니다 — 「오디오가이드는 3인칭으로 열면 몇 초 만에 놓친다」. 이 구간 동작 문장 가운데 호칭이 없는 것은 이 한 줄뿐이었습니다. 새 어조표의 「주세요」 일곱 문장도 7/7 이 「두 분,」으로 엽니다. ②「화면 너머에도 오늘이 닿도록」은 지시 앞에 붙은 수식인데, 지시를 받는 사람은 두 사람이고 그 두 사람에게는 필요 없는 말입니다. 몸을 어디로 돌리라는 것만 남기면 됩니다. 31음절이 16음절로 줄어 동작 큐가 또렷해집니다.","must":true,"kind":"문안","label":"온라인 인사로 부르기","voice":"진행","live":true},{"id":"69_fx-vshape#0","clip":"69_fx-vshape","now":"어깨만 살짝, 두 사람 쪽으로 돌려 주세요.","was":"어깨만 살짝, 두 분 쪽으로 돌려 주세요.","why":"★집 규칙 위반입니다 — 「두 분」은 **두 사람에게 직접 지시할 때**만 쓰고, 3인칭으로 가리킬 때는 「두 사람」입니다. 이 문장은 하객에게 하는 말인데 신랑신부를 「두 분」이라 부릅니다. 그러면 하객은 «나한테 하는 말인가?» 하고 한 박자 멈춥니다. 16번 진단이 세운 규칙인데 효과음 클립에는 적용된 적이 없습니다. 실측 「두 분」 열다섯 번 가운데 진행 역할이 일곱인데 그중 네 곳(26·69·71·75)이 미검토였습니다.","must":true,"kind":"문안","label":"V자로 어깨만 안쪽으로","voice":"진행","live":true},{"id":"73_fx-lean#0","clip":"73_fx-lean","now":"다 같이 조금씩 가까이 붙어 주세요.","was":"조금씩 가까이 붙어 주세요.","why":"수신자가 없습니다. 단체사진 중에 나가는 큐인데 두 사람에게 하는 말인지 하객에게 하는 말인지 문장만으로는 알 수 없어서, 현장에서 서로 눈치를 봅니다. 「다 같이」 세 글자로 정해집니다 — 사회자가 없는 녹음이라 손짓으로 가리킬 수 없습니다.","must":true,"kind":"문안","label":"다 같이 모여 기대기","voice":"진행","live":true},{"id":"75_fx-selfie#0","clip":"75_fx-selfie","now":"두 분, 휴대폰을 들어 주세요.","was":"두 분, 폰을 들어 주세요.","why":"「폰」은 이 대본에서 이 한 줄뿐입니다. 하객맞이 안내가 「휴대폰은 소리만 잠시 줄여 주시면」으로 쓰고 있어, 같은 물건을 두 이름으로 부릅니다. 그리고 줄임말은 낭독하면 툭 끊어져 들립니다.","must":false,"kind":"문안","label":"다 함께 셀카","voice":"진행","live":true},{"id":"76_toast-both-b#0","clip":"76_toast-both-b","now":"다음은 축배입니다.","was":"(없음 · 새로 넣습니다)","why":"이 클립에는 이음말이 없어서 앞 순서가 끝나자마자 긴 지시문이 바로 떨어집니다. 짧은 이음말 하나면 하객이 «다음 순서로 넘어갔다»를 받습니다.\n★1차안 「축배가 이어집니다」는 이어 읽기에서 걸렸습니다 — 자유 순서 여는 말이 「**이어서** 두 사람이 따로 준비한 순서가 있습니다」라, 한 예식에서 이음말이 두 번 다 「이어」입니다. 이음말끼리 같은 말을 쓰면 «또 넘어가나»로 들립니다.\n★새 어조표의 같은 자리 문장(「이어서 축배입니다」)을 그대로 옮기지 않은 것도 그대로입니다.","must":false,"kind":"문안","label":"둘 다 · 잔을 들고 선창","voice":"진행","live":true},{"id":"76_toast-both-b#1","clip":"76_toast-both-b","now":"먼저 두 분께 잔을 전해 드리는 동안, 하객 여러분께서도 잔을 들어 주시기 바랍니다.","was":"두 분께 잔을 전해 드리는 동안, 하객 여러분께서도 앞에 놓인 잔을 들어 주시기 바랍니다.","why":"한 문장이 «잔 전달 상황»과 «하객 동작 지시»를 같이 싣고 있고, 클립 68음절의 대부분을 이 한 문장이 차지합니다. ★「앞에 놓인」을 뺐습니다 — 그날 잔이 어디에 놓여 있는지 녹음은 볼 수 없습니다. 테이블에 미리 놓는 예식도 있고 나눠 드리는 예식도 있습니다. 40번에서는 게이트가 이 글자를 지키고 있어 못 빼지만 여기는 그 검사가 안 걸립니다(대조 확인). ★「두 분께 잔을 전해 드리는 동안」 여덟 글자는 게이트가 지키고 있어 살렸습니다. ★2차 수정 — 문두 검사가 잡았습니다. 「둘 다」 갈래에서는 이 줄과 선창(「두 사람의 새로운 시작을 위하여!」), 그리고 케이크 닫는 말(「두 사람이 함께 해낸…」)이 모두 「두」로 열어 세 문장이 같은 박자로 출발합니다. 뒤 둘은 각각 선창과 사장님이 통과시키신 줄이라 못 움직입니다. 게이트가 지키는 여덟 글자(「두 분께 잔을 전해 드리는 동안」)는 문장 첫머리에 있을 필요가 없어서, 앞에 「먼저」를 놓아 순서까지 함께 알렸습니다.","must":true,"kind":"문안","label":"둘 다 · 잔을 들고 선창","voice":"진행","live":true},{"id":"76_toast-both-b#2","clip":"76_toast-both-b","now":"제 말 끝에 위하여, 하면 다 함께 위하여, 하고 답해 주시면 됩니다.","was":"제가 위하여, 하면 다 함께 위하여, 하고 답해 주세요.","why":"40번과 같은 이유입니다. 두 클립은 배타라 한 예식에 하나만 나가므로 글자가 같아도 두 번 들리지 않습니다.","must":true,"kind":"문안","label":"둘 다 · 잔을 들고 선창","voice":"진행","live":true},{"id":"80_narr-entry-out-C#0","clip":"80_narr-entry-out-C","now":"지금부터는 두 사람의 시간입니다.","was":"이제 두 사람 차례입니다.","why":"「차례」가 식순의 순서와 헷갈린다 · 이미 걸어 들어와 선 뒤라 「이제 차례」가 「아직 시작 안 했나」로 들린다","must":true,"kind":"문안","label":"입장 닫는 말 · 격식과 따뜻함","voice":"진행","live":true},{"id":"81_narr-entry-out-D#0","clip":"81_narr-entry-out-D","now":"짧은 몇 걸음이었습니다.","was":"문이 닫히고, 두 사람만 남았습니다.","why":"★삭제 후 교체. ①기록형 코스는 문을 열지도 닫지도 않습니다 — 그런데 이 갈래는 기록형에서도 나갈 수 있습니다. 있을 수도 없을 수도 있는 설비를 녹음이 단정합니다. ②그 방에 하객이 계신데 「두 사람만 남았습니다」는 사실이 아닙니다. ③선창 D가 「여러 해가 걸렸습니다」로 긴 시간을 말했으니, 여는 말은 그 대비로 짧은 걸음을 말합니다.","must":true,"kind":"문안","label":"입장 닫는 말 · 감성·시적","voice":"진행","live":true},{"id":"85_narr-photo-send#0","clip":"85_narr-photo-send","now":"담아 두신 오늘은 두 사람에게 바로 갑니다.","was":"오늘 찍으신 사진은, 받으신 안내 페이지로 보내 주시면 두 사람에게 그대로 전해집니다.","why":"58음절 한 문장이 «무엇을»과 «어떻게»와 «그 결과»를 다 싣고 있습니다. 배웅하며 나가는 사람이 한 번에 못 받습니다. 결과를 먼저 말하고 방법을 뒤로 뺐습니다. ★「바로 갑니다」는 실제 배선과 맞는 말입니다 — 2026-08-16 사장님 결정이 「우리를 안 거치고 부부한테 바로 가는 걸 원해」였습니다. ★1차안 「오늘 찍으신 사진은…」은 자가검사가 두 가지로 잡았습니다 — 84번이 「오늘 찍으신 사진은 나중에…」로 열어 앞머리 여섯 자가 같고(84는 게이트가 지켜 못 고칩니다), 「사진」도 한 예식 다섯 번째가 됩니다. 84번이 이미 «사진 이야기»를 꺼내 놓았으므로 여기서는 그 낱말을 안 써도 뜻이 섭니다.","must":false,"kind":"문안","label":"사진 보내기 안내 (배웅)","voice":"안내","live":true},{"id":"85_narr-photo-send#1","clip":"85_narr-photo-send","now":"받으신 안내 페이지에서 올려 주세요.","was":"두 사람이 미처 보지 못한 오늘까지, 함께 간직하겠습니다.","why":"★원래 문장은 지웁니다. 「간직하겠습니다」의 주어는 안내 음성, 곧 우리입니다. **받지도 않는 사진을 보관하겠다는 약속**이라, 근거 없는 보증일 뿐 아니라 「우리를 안 거치고 부부한테 바로 간다」는 사장님 결정과 정면으로 어긋납니다.\n★그 자리에 «어떻게 보내는가»를 넣었습니다. 앞 문장에서 뺀 방법입니다. ★앱이나 버튼 이름을 낫표로 인용하지 않았습니다 — 타입캐스트가 괄호·낫표를 소리로 읽어 버립니다. 행동만 적었습니다.\n★그리고 「~세요」로 닫은 것이 이번 회차에서 가장 중요한 한 수입니다. 이 클립 뒤에 47번이 **2초 뒤 자동으로** 붙어서, 지금은 「전해집니다 / 간직하겠습니다 / 감사합니다 / 시작입니다 / 바랍니다」 다섯 문장이 전부 「다」로 끝납니다. 이 구간 최장 연속이고, 하필 **하객이 듣는 마지막 소리**입니다. 사장님이 「멘트 전체가 다다다로 끝나니깐 너무 어색하다」 하신 그 병이 예식의 마지막 인상에 그대로 남아 있었습니다.","must":true,"kind":"문안","label":"사진 보내기 안내 (배웅)","voice":"안내","live":true},{"id":"declare·1·warm","clip":"declare","now":"오늘 두 사람이 어떤 약속을 했는지, 여기서 다 보셨습니다. 이 자리에 계신 모든 분이 그 증인입니다. 이제 두 사람은 부부입니다. 두 사람의 이름을 부르듯, 따뜻한 박수를 부탁드립니다.","was":"이 약속이 어떤 약속인지, 두 사람이 오늘 여기서 보여 드렸습니다. 이 자리의 모든 분이 그 증인입니다. 이제 두 사람은 부부입니다. 두 사람의 이름을 부르듯, 따뜻한 박수를 부탁드립니다.","why":"","must":true,"kind":"선택지","label":"","voice":"","live":false},{"id":"declare·2·warm","clip":"declare","now":"방금 두 사람이 나눈 약속을, 이 자리의 모두가 들었습니다. 무를 수 없습니다. 이제 두 사람은 부부입니다. 아끼지 말고, 큰 박수로 축하해 주시기 바랍니다.","was":"방금 두 사람이 나눈 약속을, 이 방의 모두가 들었습니다. 이제 무를 수 없습니다. 이제 두 사람은 부부입니다. 아끼지 말고, 큰 박수로 축하해 주시기 바랍니다.","why":"","must":true,"kind":"선택지","label":"","voice":"","live":false},{"id":"declare·family·plain","clip":"declare","now":"오늘 우리가 지켜보는 앞에서, 두 사람은 서로의 평생이 되었습니다. 이제 두 사람은 부부입니다. 한 분도 빠짐없이, 큰 박수를 보내 주시기 바랍니다.","was":"오늘 우리 모두가 지켜보는 앞에서, 두 사람은 서로의 평생이 되었습니다. 이제 두 사람은 부부입니다. 모두 함께, 큰 박수를 보내 주시기 바랍니다.","why":"","must":true,"kind":"선택지","label":"","voice":"","live":false},{"id":"declare·family·warm","clip":"declare","now":"두 사람이 만나, 오늘 우리는 한 가족이 되었습니다. 방금 그 약속이 이 자리에서 이루어졌습니다. 이제 두 사람은 부부입니다. 다 같이 축하해 주시기 바랍니다.","was":"두 사람이 만나, 오늘 우리는 한 가족이 되었습니다. 그 약속이 오늘 이 자리에서 이루어졌습니다. 이제 두 사람은 부부입니다. 다 같이 축하해 주시기 바랍니다.","why":"","must":true,"kind":"선택지","label":"","vo       '<p class="tag"><span class="n">' + (n + 1) + '.</span> ' + meta.join(' · ') + '</p>' +
      '<div class="row now"><span class="k">지금 (바뀐 문장)</span>' + esc(x.now) + '</div>' +
      '<div class="row was"><span class="k">예전 문장</span>' + esc(x.was) + '</div>' + why +
      '<div class="pick"><button class="keep' + (v === 'keep' ? ' on' : '') + '">지금 그대로 좋다</button>' +
      '<button class="back' + (v === 'back' ? ' on' : '') + '">예전 게 낫다</button></div>';
    var bs = c.querySelectorAll('.pick button');
    bs[0].onclick = function(){ st[k] = st[k] === 'keep' ? null : 'keep'; save(); draw(); };
    bs[1].onclick = function(){ st[k] = st[k] === 'back' ? null : 'back'; save(); draw(); };
    var mb = c.querySelector('.more');
    if (mb) mb.onclick = function(){ var p = c.querySelector('.why'); p.classList.toggle('open');
      mb.textContent = p.classList.contains('open') ? '접기' : '이유 더 보기'; };
    L.appendChild(c);
  });
  var nb = 0, ns = 0;
  D.forEach(function(x){ var v = st[x.id]; if (v) ns++; if (v === 'back') nb++; });
  document.getElementById('nback').textContent = nb;
  document.getElementById('nseen').textContent = ns;
  document.getElementById('ntot').textContent = D.length;
}
document.getElementById('rst').onclick = function(){
  if (confirm('누르신 것을 전부 지웁니다. 계속할까요?')) { st = {}; save(); draw(); } };
document.getElementById('fin').onclick = function(){
  var back = D.filter(function(x){ return st[x.id] === 'back'; });
  var t = '# 되돌릴 문장 ' + back.length + '건 (5333c35f)\n';
  back.forEach(function(x){ t += '\n' + x.id + '\t' + x.was; });
  if (!back.length) t += '\n(없음 — 전부 지금 그대로 둡니다)';
  var r = document.getElementById('res'); r.classList.remove('hid'); r.value = t;
  r.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
document.getElementById('cpy').onclick = function(){
  var r = document.getElementById('res'), b = this;
  if (r.classList.contains('hid')) document.getElementById('fin').click();
  r.select(); try { document.execCommand('copy'); b.textContent = '복사됨'; } catch(e){}
  setTimeout(function(){ b.textContent = '복사'; }, 1600); };
draw();
</script></body></html>
