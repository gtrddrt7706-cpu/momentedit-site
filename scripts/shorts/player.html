<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>모먼트에딧 숏폼</title>
<style>
/* 「모두의 창업」 2차 Q5 제출용 숏폼 [SHORT_PLAYER]
   ★브랜드 팔레트는 index.html 과 같은 값을 쓴다(따로 고르지 않는다). */
:root{--bg:#fafaf8;--bg2:#f5f3ef;--text:#1c1b19;--sub:#5a554c;--gold:#b89a75;
      --gold-text:#7a5f37;--accent:#3a2d22;--seal:#6b2a24;--border:#ddd8d1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--accent)}
body{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR","Noto Sans KR",sans-serif;
     color:var(--text);-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;background:var(--bg)}
.cut{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;
     align-items:center;justify-content:flex-start;background:var(--bg)}
.cut.on{opacity:1}
/* 화면 그림 — 위쪽을 크게, 아래는 자막 자리 */
.shot{position:absolute;top:150px;left:60px;right:60px;bottom:430px;
      display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
.shot img{max-width:100%;max-height:100%;object-fit:contain;object-position:top center;
          border:1px solid var(--border);border-radius:14px;
          box-shadow:0 24px 70px rgba(28,27,25,.16);background:#fff}
.shot.tall img{object-position:top center}
/* 눈썹 · 자막 */
.brow{position:absolute;top:74px;left:0;right:0;text-align:center;
      font-size:26px;letter-spacing:.26em;color:var(--gold-text);font-weight:600}
.cap{position:absolute;left:70px;right:70px;bottom:170px;text-align:center}
.cap b{display:block;font-size:60px;line-height:1.34;font-weight:700;color:var(--accent);
       word-break:keep-all;letter-spacing:-.01em}
.cap i{display:block;margin-top:24px;font-size:34px;line-height:1.6;font-style:normal;
       color:var(--sub);word-break:keep-all}
.cap em{font-style:normal;color:var(--seal);font-weight:800}
/* 표지·마무리 */
.title{position:absolute;inset:0;display:flex;flex-direction:column;
       align-items:center;justify-content:center;background:var(--accent);color:#f3efe7}
.title h1{font-family:Georgia,"Times New Roman",serif;font-size:96px;letter-spacing:.1em;font-weight:400}
.title p{margin-top:30px;font-size:38px;color:#cfc6b5;letter-spacing:.04em}
.title small{margin-top:70px;font-size:30px;color:#a1968a;letter-spacing:.18em}
/* 아래 진행 막대 */
.bar{position:absolute;left:0;bottom:0;height:8px;background:var(--gold);width:0}
.foot{position:absolute;left:0;right:0;bottom:70px;text-align:center;
      font-size:26px;color:var(--sub);letter-spacing:.16em}
</style></head><body>
<div class="stage" id="stage"></div>
<div class="bar" id="bar"></div>
<script>
/* cuts.js 가 window.CUTS 를 채운다 — {kind:'title'|'shot', img, brow, cap, sub, sec} */
function build(){
  var st=document.getElementById('stage'), total=0;
  window.CUTS.forEach(function(c,i){
    var d=document.createElement('div'); d.className='cut'; d.id='cut'+i;
    if(c.kind==='title'){
      d.innerHTML='<div class="title"><h1>'+c.cap+'</h1><p>'+(c.sub||'')+'</p>'
                 +(c.foot?'<small>'+c.foot+'</small>':'')+'</div>';
    }else{
      d.innerHTML='<div class="brow">'+(c.brow||'')+'</div>'
        +'<div class="shot'+(c.tall?' tall':'')+'"><img src="'+c.img+'"></div>'
        +'<div class="cap"><b>'+c.cap+'</b>'+(c.sub?'<i>'+c.sub+'</i>':'')+'</div>'
        +'<div class="foot">momentedit.kr</div>';
    }
    st.appendChild(d); total+=c.sec;
  });
  window.TOTAL=total;
}
function play(){
  var t=0, bar=document.getElementById('bar');
  window.CUTS.forEach(function(c,i){
    setTimeout(function(){
      var prev=document.querySelector('.cut.on'); if(prev)prev.classList.remove('on');
      document.getElementById('cut'+i).classList.add('on');
    }, t*1000);
    t+=c.sec;
  });
  var t0=Date.now();
  (function tick(){ var p=Math.min(1,(Date.now()-t0)/(window.TOTAL*1000));
    bar.style.width=(p*100)+'%'; if(p<1) requestAnimationFrame(tick); })();
}
window.START=function(){ play(); };
build();
</script>
<script src="cuts.js"></script>
</body></html>
