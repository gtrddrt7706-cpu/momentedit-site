<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Moment Edit · 관리자</title>
<!-- 홈 화면 아이콘(본 로고) — 희준 PC: 본인 admin_icon_base64.txt 내용으로 교체 가능 -->
<link rel="apple-touch-icon" href="/shared/admin-icon.png">
<link rel="icon" type="image/png" href="/shared/admin-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moment Edit · 관리자">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 스크롤바 전역 숨김(스크롤 기능은 유지) — 브랜드 규칙: 바는 보이지 않게 */
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0;height:0;display:none}

::selection{background:rgba(107,42,36,0.18);color:var(--accent)}::-moz-selection{background:rgba(107,42,36,0.18);color:var(--accent)}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#FAFAF8;--paper2:#F5F3EF;--paper3:#EDEBE6;--card:#FFFFFF;
  --ink:#1C1B19;--sub:#5A554C;--light:#75705F;--accent:#3A2D22;
  --gold:#B89A75;--gold-deep:#9A7B4F;--gold-deeper:#7A5F37;--gold-line:#E6E1D8;
  --seal:#6B2A24;--border:#DDD8D1;--divider:#EDEAE4;--label-soft:#75705F; /* [ADM_A11Y] 라벨 대비 4.5:1 미달(#7C766A)이라 한 단계 진하게 · 로그인 라벨 axe serious */
  --blue:#3F6F7A;--red:#9A4A45;--redbg:#F2EDED;--yellow:#8A6A2B;--yellowbg:#FBF3E4;
  --serif:'Cormorant Garamond',Georgia,serif;--serif-ko:'Noto Serif KR',serif;
  --sans:'Noto Sans KR',-apple-system,sans-serif;--mono:'Roboto Mono',monospace;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;min-height:100vh}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* 헤더 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,250,248,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--gold-line);padding:12px 16px;display:flex;align-items:center;gap:8px}
.topbar .wm{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.22em;color:var(--accent);cursor:pointer;transition:color .2s;white-space:nowrap;flex:none}
.topbar .wm:hover{color:var(--seal)}
.topbar .wm:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}
.topbar .who{margin-left:auto;font-family:var(--serif-ko);font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .tb-group{display:flex;align-items:center;gap:8px;flex:none}
.topbar .tb{background:none;border:1px solid var(--border);border-radius:7px;min-width:34px;height:34px;cursor:pointer;color:var(--gold-deeper);font-size:13px;flex:none;padding:0 9px}
.topbar .tb:active{background:var(--paper2)}
/* [ADM_HEAD2] 좁은 화면 헤더 2단 — 한 줄에 브랜드·이름·버튼 5개를 몰아넣어
   'MOMENT EDIT'가 두 줄로 쪼개지고 '로그아웃'이 화면 밖으로 잘려 나가고 있었다.
   윗줄은 누구인지(브랜드·이름), 아랫줄은 무엇을 하는지(도구 5개)로 나눈다. */
@media (max-width:600px){
  .topbar{flex-wrap:wrap;row-gap:9px;padding:10px 14px 11px}
  .topbar .tb-group{width:100%;gap:6px}
  .topbar .tb{flex:1 1 0;min-width:0;height:34px;font-size:12px;padding:0 4px;white-space:nowrap}
}
@media (max-width:340px){ /* [ADM_HEAD2] 최소폭에서 '새로고침'·'로그아웃'이 테두리에 닿지 않게 */
  .topbar .tb-group{gap:5px}
  .topbar .tb{font-size:11.5px;padding:0 2px}
}
main{max-width:580px;margin:0 auto;padding:14px 14px 64px}

/* 검색 */
.search{display:flex;gap:8px;margin-bottom:16px}
.search input{flex:1;border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-family:var(--sans);font-size:16px;color:var(--accent);background:#fff;outline:none}
.search input:focus{border-color:var(--gold)}
/* 자동완성(브라우저 저장값) 파란 배경 제거 — 흰 배경 유지 */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active{-webkit-box-shadow:0 0 0 1000px #fff inset;box-shadow:0 0 0 1000px #fff inset;-webkit-text-fill-color:var(--accent);caret-color:var(--accent);transition:background-color 9999s ease 0s}
.search button{flex:none;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 16px;font-family:var(--serif-ko);font-size:13px;cursor:pointer}

/* 섹션 제목 */
.sect-h{display:flex;align-items:center;gap:8px;margin:22px 2px 11px}
.sect-h .ic{font-size:15px}
.sect-h .tt{font-family:var(--serif-ko);font-size:15px;font-weight:600;color:var(--accent)}
.sect-h .ct{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--light)}
.sect-h .ct b{color:var(--seal)}
/* [ADM_AA1] 급함 배지 — 제목 옆 승격(H1 토큰 12px · 여백 2/8) */
.sect-h .urg-badge{font-family:var(--serif-ko);font-size:12px;font-weight:600;color:var(--seal);background:rgba(154,74,69,.08);border:1px solid rgba(154,74,69,.28);border-radius:999px;padding:2px 8px;line-height:1.5;white-space:nowrap}

/* 처리할 일 묶음 */
.qhead{font-family:var(--serif-ko);font-size:12px;font-weight:500;color:var(--label-soft);margin:14px 2px 7px;letter-spacing:.02em}
.qhead.red{color:var(--seal)}
.qrow{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .2s}
.qrow:active{border-color:var(--gold)}
.qrow.red{position:relative;border-color:rgba(154,74,69,.32);background:rgba(154,74,69,.06);padding-left:16px}
/* [ADM_AA1] 긴급 큐 시각 세기 — 배경 .025→.06 · 좌측 3px 색 바(테두리 알파는 .4→.32로 낮춰 과하지 않게) */
.qrow.red::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:10px 0 0 10px;background:var(--seal)}
.qrow .ql{flex:1;min-width:0}
.qrow .qn{font-family:var(--serif-ko);font-size:14.5px;font-weight:500;color:var(--accent);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qrow .qk{font-family:var(--serif-ko);font-size:11px;color:var(--gold-deeper);border:1px solid var(--gold-line);border-radius:9px;padding:1px 7px;flex:none}
.qrow .qs{font-family:var(--serif-ko);font-size:12px;color:var(--light);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.qbadge{font-family:var(--serif-ko);font-size:10.5px;font-weight:500;border-radius:9px;padding:1px 8px;flex:none}
.qbadge.red{background:var(--redbg);color:var(--red)}
.qk.qk-warn{background:var(--redbg);color:var(--red);border-color:transparent}
.qbadge.yellow{background:var(--yellowbg);color:var(--yellow)}
.qbtn{flex:none;background:var(--seal);color:#fff;border:none;border-radius:8px;padding:9px 13px;font-family:var(--serif-ko);font-size:12.5px;font-weight:500;cursor:pointer;min-height:38px}
.qfit{display:flex;align-items:center;gap:6px}
.qfit-in{width:54px;text-align:center;padding:9px 4px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;color:var(--accent);background:#fff;outline:none}
.qfit-in:focus{border-color:var(--gold)}
.qbtn.go{background:#fff;border:1px solid var(--gold-deep);color:var(--gold-deeper)}
.qbtn:active{opacity:.85}
/* 결과물 관리 — 진행 스텝 스트립(원본›선택›보정›전달) */
.rstep{display:flex;align-items:center;flex-wrap:wrap;margin-top:5px}
.rstep .rs{font-family:var(--serif-ko);font-size:10.5px;color:var(--label-soft)}
.rstep .rs.done{color:var(--gold-deeper)}
.rstep .rs.cur{color:var(--seal);font-weight:600}
.rstep .rsep{color:var(--divider);margin:0 5px;font-size:10px}

/* 진행 중 현황 */
.ptabs{display:flex;gap:6px;margin:0 0 12px}
.ptab{flex:1;text-align:center;border:1px solid var(--border);border-radius:8px;padding:8px 4px;font-family:var(--serif-ko);font-size:12.5px;color:var(--sub);background:#fff;cursor:pointer}
.ptab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ptab .pc{font-family:var(--mono);font-size:10.5px;opacity:.75;margin-left:3px}
.psub{font-family:var(--serif);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);margin:14px 2px 7px}
.pgroup{margin-bottom:7px}
.pghead{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;cursor:pointer}
.pghead.dim{opacity:.5;cursor:default}
.pgname{font-family:var(--serif-ko);font-size:13px;font-weight:500;border-radius:9px;padding:2px 10px}
.pgn{font-family:var(--mono);font-size:11.5px;color:var(--light)}
.pgdot{color:var(--seal);font-size:10px}
.pgcar{margin-left:auto;color:var(--label-soft);font-size:12px;transition:transform .2s}
.pgroup.open .pgcar{transform:rotate(90deg)}
.pgbody{display:none;padding:5px 4px 4px}
.pgroup.open .pgbody{display:block}
.pcust{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--divider);cursor:pointer}
.pcust:last-child{border-bottom:none}
.pcust .cn{font-family:var(--serif-ko);font-size:13.5px;color:var(--accent);flex:none}
.pcust .cs{font-family:var(--serif-ko);font-size:11.5px;color:var(--light);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcust .cd{font-family:var(--mono);font-size:10.5px;color:var(--blue);flex:none}
.pcust .bolt{color:var(--seal);flex:none;font-size:12px}

.empty{font-family:var(--serif-ko);font-size:13px;color:var(--label-soft);text-align:center;padding:26px 0}
.hint{font-family:var(--serif-ko);font-size:12px;color:var(--gold-deeper);text-align:center;padding:6px 0}

/* 상세 */
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--serif-ko);font-size:13px;color:var(--sub);background:none;border:none;cursor:pointer;margin-bottom:10px;padding:4px 0}
.dsticky{position:sticky;top:46px;z-index:9;background:rgba(250,250,248,.96);backdrop-filter:blur(8px);margin:0 -14px 12px;padding:8px 14px;border-bottom:1px solid var(--gold-line);display:flex;align-items:center;gap:8px}
.dsticky .nm{font-family:var(--serif-ko);font-size:15px;font-weight:600;color:var(--accent)}
.dsticky .stage{font-family:var(--serif-ko);font-size:11px;border-radius:10px;padding:2px 10px}
.dhead{margin-bottom:12px}
.dhead .pin{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--serif-ko);font-size:12px;color:var(--sub)}
.dhead .pin .pchip{background:var(--paper2);border-radius:8px;padding:3px 9px}
.dhead .code{font-family:var(--mono);font-size:10.5px;color:var(--label-soft)}
.contact{display:flex;gap:8px;margin:10px 0 16px}
.contact a,.contact button{flex:1;text-align:center;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:var(--serif-ko);font-size:13px;color:var(--accent);text-decoration:none;background:#fff;cursor:pointer}
.contact a:active,.contact button:active{background:var(--paper2)}

.fields-toggle{font-family:var(--serif-ko);font-size:12.5px;color:var(--gold-deeper);background:var(--paper2);border:1px solid var(--gold-line);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%;text-align:left;margin-bottom:12px}
.fields{display:none;background:#fff;border:1px solid var(--border);border-radius:9px;padding:6px 14px;margin-bottom:12px}
.fields.open{display:block}
.grp-l{font-family:var(--serif);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);margin:10px 0 4px}
.fld{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--divider);font-size:12.5px}
.fld:last-child{border-bottom:none}
.fld .k{flex:none;width:84px;font-family:var(--serif-ko);color:var(--label-soft)}
.fld .v{flex:1;font-family:var(--serif-ko);color:var(--ink);line-height:1.6;white-space:pre-wrap}
.fld .v a{color:var(--blue)}

/* 카드 */
.card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:15px;margin-bottom:11px}
.card.cur{border-left:3px solid var(--seal)}
.card.dim{opacity:.6}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.card-h .ct{font-family:var(--serif-ko);font-size:13.5px;font-weight:600;color:var(--accent)}
.card-h .cflag{margin-left:auto;font-family:var(--serif-ko);font-size:10.5px;border-radius:9px;padding:2px 9px}
.raw{font-family:var(--serif-ko);font-size:12.5px;color:var(--sub);background:var(--paper2);border-radius:7px;padding:8px 11px;line-height:1.7;word-break:break-all}
.raw-sub{font-family:var(--serif-ko);font-size:12.5px;color:var(--sub);background:var(--paper2);border-radius:7px;padding:8px 11px;margin-top:6px;line-height:1.65;word-break:break-all;border-left:2px solid var(--gold-soft,rgba(184,154,117,.28))}
.raw-sub-h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep,#9A7B4F);font-weight:600;margin-bottom:3px}
.card.focus{outline:2px solid var(--gold);outline-offset:2px;transition:outline-color .3s}
.raw b{color:var(--accent);font-weight:500}
.mt{font-family:var(--serif-ko);font-size:11.5px;color:var(--gold-deeper);background:none;border:none;cursor:pointer;padding:7px 0 2px}
.mbody{display:none;margin-top:6px;border-top:1px dashed var(--gold-line);padding-top:8px}
.mbody.open{display:block}
.kv{display:flex;gap:10px;padding:5px 0;font-size:12px}
.kv .k{flex:none;width:92px;font-family:var(--serif-ko);color:var(--label-soft)}
.kv .v{flex:1;font-family:var(--serif-ko);color:var(--ink);word-break:break-all}
.cnote{font-family:var(--serif-ko);font-size:11.5px;color:var(--light);margin-top:7px}
.link-chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--serif-ko);font-size:12px;color:var(--blue);margin-right:8px}
.res-sel{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line,#E5E0D8)}
.res-sel-list{margin-top:4px;font-size:12px;color:var(--ink,#3A332B);background:#fff;border:1px solid var(--line,#E5E0D8);border-radius:6px;padding:7px 9px;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.res-ex{margin-top:6px;font-size:12.5px;color:var(--sub)}

/* 설문 대시보드 */
.sv-pillars{display:flex;gap:8px;margin:2px 2px 10px}
.sv-pill{flex:1;text-align:center;background:#fff;border:1px solid var(--line,#E5E0D8);border-radius:9px;padding:12px 6px}
.sv-pill-pct{font-family:var(--serif,Georgia);font-size:24px;font-weight:500;color:var(--gold-deeper,#9A7B3F);line-height:1}
.sv-pill-lb{font-size:11px;color:var(--sub);margin-top:5px;letter-spacing:.01em}
.sv-sum{font-size:12.5px;color:var(--sub);text-align:center;margin:0 0 12px}
.sv-sum b{color:var(--accent,#2C2722)}
.sv-qs{display:flex;flex-direction:column;gap:11px}
.sv-qrow{}
.sv-qt{font-size:12px;font-weight:600;color:var(--accent,#2C2722);margin-bottom:4px}
.sv-bar{display:flex;height:18px;border-radius:5px;overflow:hidden;background:#EEE9E1}
.sv-seg{display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#fff;font-weight:500;min-width:0;overflow:hidden;white-space:nowrap}
.sv-seg-0{background:#9A7B3F}.sv-seg-1{background:#C2A86A}.sv-seg-2{background:#CFC3A6}.sv-seg-3{background:#B9B0A0}
.sv-leg{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
.sv-lg{font-size:10.5px;color:var(--sub);display:inline-flex;align-items:center;gap:4px}
.sv-dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.sv-rev-h{font-size:12px;font-weight:600;color:var(--accent,#2C2722);margin:16px 2px 8px}
.sv-rev{background:#fff;border:1px solid var(--line,#E5E0D8);border-radius:8px;padding:9px 11px;margin-bottom:7px;font-size:12.5px;color:var(--ink,#3A332B);line-height:1.5}
.sv-rev.pub{border-left:3px solid var(--gold-deeper,#9A7B3F)}
.sv-rev-m{font-size:10.5px;color:var(--label-soft);margin-bottom:3px}
.sv-rev-m span{color:var(--sub)}
.sv-rev-m b{color:var(--gold-deeper,#9A7B3F)}.sv-rev-m i{color:var(--label-soft);font-style:normal}
/* [SV_DIGEST] 설문 결과 요약화(2026-08-01) — 응답 1건인데도 14개 문항 막대가 전부 '100%'로
   깔려 화면이 정신없다는 지적. 막대는 '분포'를 보라고 만든 물건인데 n이 작을 땐 분포가 없다.
   → 평소엔 '봐야 할 것'만 남기고(부정 응답·유입·평균), 막대와 후기 전문은 접어 둔다. */
.sv-note{font-size:12px;color:var(--sub);line-height:1.6;margin:0 2px 12px}
.sv-note b{color:var(--accent,#2C2722);font-weight:600}
.sv-watch{background:#fff;border:1px solid var(--line,#E5E0D8);border-radius:8px;padding:10px 12px;margin:0 2px 10px}
.sv-watch-h{font-size:11px;font-weight:600;color:var(--gold-deeper,#9A7B3F);letter-spacing:.02em;margin-bottom:6px}
.sv-watch ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.sv-watch li{font-size:12px;color:var(--ink,#3A332B);line-height:1.5}
.sv-watch li b{font-weight:600}
.sv-ok{font-size:12px;color:var(--sub);margin:0 2px 10px;line-height:1.5}
.sv-fold{border:1px solid var(--line,#E5E0D8);border-radius:8px;background:#fff;margin:0 2px 8px;overflow:hidden}
.sv-fold>summary{list-style:none;cursor:pointer;padding:11px 12px;font-size:12px;font-weight:600;
  color:var(--accent,#2C2722);display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:44px;box-sizing:border-box}
.sv-fold>summary::-webkit-details-marker{display:none}
.sv-fold>summary::after{content:"›";color:var(--gold-deeper,#9A7B3F);font-size:17px;line-height:1;
  transition:transform .3s cubic-bezier(0.16,1,0.3,1);flex:0 0 auto}
.sv-fold[open]>summary::after{transform:rotate(90deg)}
.sv-fold>summary .n{font-weight:400;color:var(--label-soft)}
.sv-fold-in{padding:2px 12px 13px;border-top:1px solid var(--line,#E5E0D8)}
.sv-fold-in .sv-qs{margin-top:11px}
.sv-fold-in .sv-rev:last-child{margin-bottom:0}
@media (prefers-reduced-motion: reduce){ .sv-fold>summary::after{transition:none} }

/* 메모·이력 */
.memo-area{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px;font-family:var(--sans);font-size:14px;color:var(--accent);background:#fff;resize:vertical;min-height:62px;outline:none;line-height:1.6}
.memo-area:focus{border-color:var(--gold)}
.hist{font-family:var(--mono);font-size:11px;color:var(--sub);line-height:1.8;max-height:160px;overflow-y:auto;background:var(--paper2);border-radius:7px;padding:9px 11px}
.hist .hl{border-bottom:1px solid var(--divider);padding:2px 0}
.hist .hl:last-child{border-bottom:none}

/* 버튼 */
.actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{display:block;width:100%;text-align:center;padding:13px 0;border:none;border-radius:8px;font-family:var(--serif-ko);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;min-height:46px}
.btn-seal{background:var(--seal);color:#fff}
.btn-seal:active{background:#5A231E}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--sub)}
.btn-ghost:active{background:var(--paper2)}
.btn-line{background:#fff;border:1px solid var(--gold-deep);color:var(--gold-deeper)}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn-sm{padding:9px 0;font-size:12.5px;min-height:40px}
.gate{font-family:var(--serif-ko);font-size:11.5px;color:var(--label-soft);text-align:center;padding:8px 0}

/* 고급 */
.adv{margin-top:18px}
.adv-t{font-family:var(--serif-ko);font-size:12.5px;color:var(--label-soft);background:none;border:none;cursor:pointer;padding:8px 0;width:100%;text-align:left}
.adv-body{display:none;background:#fff;border:1px solid var(--red);border-radius:10px;padding:14px;margin-top:6px}
.adv-body.open{display:block}
.adv-warn{font-family:var(--serif-ko);font-size:11.5px;color:var(--red);background:var(--redbg);border-radius:7px;padding:8px 11px;margin-bottom:11px;line-height:1.6}
.adv-body label{display:block;font-family:var(--serif-ko);font-size:11px;color:var(--label-soft);margin:8px 0 4px}
/* [ADM_AC3] 강제 변경 미리보기·동의 게이트 */
.adv-prev{font-family:var(--serif-ko);font-size:12px;line-height:1.7;color:var(--accent);background:#faf7f0;border:1px solid #ece3d0;border-radius:8px;padding:8px 12px;margin-top:8px}
.adv-prev-h{display:block;font-weight:600;margin-bottom:4px}
.adv-prev-x{color:var(--red)}
.adv-prev-k{color:var(--gold-deeper,#9a7b3f)}
.adv-gate{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--accent);cursor:pointer}
.adv-gate input{width:20px;min-height:20px;margin:0;-webkit-appearance:auto;appearance:auto;flex:0 0 auto}
.adv-hint{font-family:var(--serif-ko);font-size:11px;color:var(--red);margin-top:4px}
.btn[disabled]{opacity:.45;pointer-events:none}
.adv-body select,.adv-body input{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:7px;padding:11px;font-family:var(--sans);font-size:16px;color:var(--accent);background:#fff;outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
/* [ADM_GATE_CB] 체크박스는 위 공통 입력 규칙에서 제외 — 같은 특이도(.adv-gate input vs .adv-body input)라 뒤에 온 공통 규칙이 이겨서
   체크박스가 전폭 46px 빈 상자로 그려지고 appearance:none 때문에 체크 표시도 안 보였다(강제 변경 버튼이 영영 안 열림).
   특이도를 올려(.adv-body .adv-gate input) 확실히 이기게 하고 네이티브 렌더를 되돌린다. ★공통 규칙 뒤에 두어야 함 — 위로 옮기지 말 것. */
.adv-body .adv-gate input[type=checkbox]{width:20px;min-width:20px;height:20px;min-height:20px;flex:0 0 auto;margin:0;padding:0;border-radius:4px;-webkit-appearance:auto;appearance:auto;accent-color:var(--red,#b3261e)}

/* 아카이브 */
.achips{display:flex;gap:6px;margin-bottom:14px}
.achip{flex:1;text-align:center;border:1px solid var(--border);border-radius:8px;padding:8px 4px;font-family:var(--serif-ko);font-size:12px;color:var(--sub);background:#fff;cursor:pointer}
.achip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.arow{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:9px;cursor:pointer}
.arow .an{font-family:var(--serif-ko);font-size:13.5px;color:var(--accent);flex:1;min-width:0}
.arow .ad{font-family:var(--mono);font-size:10px;color:var(--light);flex:none}
.endchip{font-family:var(--serif-ko);font-size:10.5px;border-radius:9px;padding:2px 9px;flex:none}
.endchip.done{background:#E3EFE6;color:#1F6B3A}
.endchip.stopped{background:var(--redbg);color:var(--red)}

/* 로딩·스켈레톤·토스트 */
#loading{text-align:center;padding:54px 0;color:var(--light);font-family:var(--serif-ko);font-size:13px}
/* [BUSY_ONE] '일하는 중' 표시를 한 언어로 (2026-08-03 사용자 "진사 점 깜빡이는 거랑 2개가 있는 것 같은데 확인해서 통일시키자").
   실측 — 같은 화면 안에 ①진사 점이 숨쉬는 표시(불러오는 중)와 ②금색 링이 도는 스피너(저장 중)가 함께 있었다.
   브랜드 언어는 조용한 쪽이다(회전하는 기계식 스피너는 이 지면의 말이 아니다) — 진사 점 하나로 맞춘다.
   문구는 하는 일에 따라 '불러오는 중…' / '저장 중…'. */
.spinner{width:9px;height:9px;background:var(--seal);border-radius:50%;margin:6px auto 14px;animation:meBreath 1.7s ease-in-out infinite}
@keyframes meBreath{0%,100%{opacity:0.25;transform:scale(0.82)}50%{opacity:0.9;transform:scale(1)}}
.skel{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:9px;height:54px;margin-bottom:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;font-family:var(--serif-ko);font-size:13px;padding:11px 20px;border-radius:24px;opacity:0;transition:all .3s var(--ease);z-index:60;pointer-events:none;max-width:90%;text-align:center}
/* 상단 진행 바 — 모든 서버 호출(api) 중 표시: 처리 중임을 즉시 알림 */
#topBusy{position:fixed;top:0;left:0;height:3px;width:100%;z-index:120;background:transparent;opacity:0;transition:opacity .2s ease;pointer-events:none}
#topBusy.on{opacity:1}
#topBusy::before{content:'';position:absolute;top:0;left:0;height:100%;width:40%;border-radius:0 3px 3px 0;background:linear-gradient(90deg,transparent,var(--seal),var(--gold));animation:topBusySlide 1.1s cubic-bezier(0.4,0,0.2,1) infinite}
@keyframes topBusySlide{0%{left:-40%}100%{left:100%}}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 모달 */
.modal-ov{position:fixed;inset:0;background:rgba(28,27,25,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;overflow-y:auto}
.modal-ov.show{display:flex}

.modal input,.modal select,.modal textarea{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:7px;padding:12px 13px;font-family:var(--sans);font-size:16px;color:var(--accent);background:#fff;outline:none;-webkit-appearance:none;appearance:none;min-height:48px}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--gold)}
/* [ADM_AA5] 링크 입력 + 붙여넣기 버튼 한 줄 */
.modal .paste-row{display:flex;gap:6px;align-items:stretch}
.modal .paste-row input{flex:1;min-width:0}
.modal .paste-btn{flex:0 0 auto;padding:0 12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--sub);font-family:var(--serif-ko);font-size:12px;cursor:pointer;white-space:nowrap}
.modal .paste-btn:active{background:var(--bg2)}
.modal .paste-hint{font-family:var(--serif-ko);font-size:11px;color:var(--seal);margin-top:4px;text-align:left;min-height:0}
/* [ADM_AA6] 최근 본 고객 칩 — 폰 재방문 시 재검색 제거(이름·코드만 저장) */
.recent{display:flex;flex-wrap:wrap;gap:6px;margin:8px 2px 0}
.recent .rc-l{font-family:var(--serif-ko);font-size:11px;color:var(--label-soft);align-self:center;margin-right:2px}
.recent button{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 12px;font-family:var(--serif-ko);font-size:12px;color:var(--sub);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent button:active{border-color:var(--gold);background:var(--bg2)}
.modal .mbtns{display:flex;gap:8px;margin-top:6px}
.modal .mbtns .btn{flex:1}
.modal .merr{font-family:var(--serif-ko);font-size:12px;color:var(--seal);text-align:center;min-height:15px;margin-bottom:5px}

/* [ADM_MODAL 2026-08-03] 브라우저 기본 팝업(alert·confirm·prompt) 대체 판.
   스킨은 위 .modal-ov/.modal 을 그대로 입는다 — 예약 처리 판(openModal)과 같은 판·같은 글꼴. 여기서 새로 정하는 건 겹침 순서와 본문 흐름뿐.
   겹침 순서는 이 파일 최댓값(99999 · 인쇄 오버레이)보다 위 — 인쇄·문서 뷰어를 띄운 채로 뜨는 알림이 있다. */
#admDlgOv{z-index:100010}
#admDlgOv .admdlg-b{font-family:var(--serif-ko);font-size:13px;color:var(--sub);text-align:center;line-height:1.7;margin-bottom:14px;white-space:pre-line;word-break:break-word}
#admDlgOv .admdlg-pre{font-family:var(--mono);font-size:11.5px;color:var(--sub);text-align:left;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:42vh;overflow:auto;background:var(--paper2);border:1px solid var(--gold-line);border-radius:8px;padding:10px 12px;margin-bottom:14px;-webkit-user-select:text;user-select:text}
#admDlgOv .modal.danger{border-top:2px solid var(--seal)}   /* 진사는 되돌릴 수 없는 동작의 얇은 키라인·확인 버튼에만 */

.login-wrap .btn{margin-top:4px}
</style>
</head>

<!-- ★DECL_ADMIN_MIRROR — 식순 문안·선택지 원천. 선언 주체 라벨을 하드코딩하지 않고 여기서 읽는다.
     async/defer 금지(파일 헤더 4행) · 인라인 스크립트보다 먼저 로드돼야 DECLWHO를 참조할 수 있다. -->
<script src="/assets/ritual-data.js"></script>
<script>
// ★DECL_ADMIN_MIRROR — 선언 주체 라벨은 DECLWHO에서 읽는다(주체가 늘어도 admin이 자동으로 따라온다).
//   과거 사고(2026-07-26): #318이 'ask'를 네 번째 주체로 추가했는데 여기 하드코딩 맵이 안 따라와,
//   응답형을 고른 고객(감동 코스 기본값)의 상세에서 row()가 falsy를 받아 '성혼 선언' 행이 통째로 사라졌다.
//   원천을 못 읽는 상황(스크립트 로드 실패)에서도 행이 사라지지 않도록 키를 그대로 보여주는 폴백을 둔다.
function _declWhoLabel(k){
  if(!k) return '';
  try{ if(typeof DECLWHO!=='undefined' && DECLWHO[k] && DECLWHO[k].d) return DECLWHO[k].d; }catch(e){}
  return k;
}
/* [ADM_AA2] 액션 라벨 동사 사전 — 같은 행위에 두 이름을 두지 않는다(큐 버튼·상세 버튼·모달 확인 버튼 모두 같은 동사).
     "…확인"   들어온 것을 맞다고 승인    : 입금 확인 · 중도금 확인 · 잔금 확인 · 변경 확인 · 추가 보정 입금 확인
     "…처리"   상태를 다음으로 넘기는 확정 : 상담완료 처리 · 결과물 전달 처리 · 환불 완료 처리 · 노쇼 처리 · 미계약 처리
     "…착수"   작업을 시작함              : 보정 착수
     "…등록/발송/보내기/발급/회수"  물건·문서를 만들어 내보내거나 거둠

var _admDlg={ ov:null, box:null, t:null, b:null, pre:null, field:null, label:null, input:null, no:null, yes:null,

function _admDlgInit(){
  if(_admDlg.ov) return;

  _admDlg.pre=$('admDlgPre'); _admDlg.field=$('admDlgField'); _admDlg.label=$('admDlgLb');
  _admDlg.input=$('admDlgIn'); _admDlg.no=$('admDlgNo'); _admDlg.yes=$('admDlgYes');
  _admDlg.no.addEventListener('click', function(){ _admDlgEnd(false); });
  _admDlg.yes.addEventListener('click', function(){ _admDlgEnd(true); });
  _admDlg.ov.addEventListener('click', function(e){ if(e.target===_admDlg.ov) _admDlgEnd(false); });   // 배경 클릭 = 취소
  _admDlg.input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); _admDlgEnd(true); } });
  document.addEventListener('keydown', _admDlgKey, true);   // capture — Esc는 맨 위 판만 닫아야 해서 아래 #confirmModal 핸들러보다 먼저 잡는다
}
function _admDlgOpen(){ return !!(_admDlg.ov && _admDlg.ov.classList.contains('show')); }
function _admDlgTabbables(){
  var sel='button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
  return Array.prototype.filter.call(_admDlg.box.querySelectorAll(sel), function(el){ return el.offsetWidth>0 || el.offsetHeight>0; });
}
function _admDlgKey(e){
  if(!_admDlgOpen()) return;
  if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); _admDlgEnd(false); return; }   // Esc = 취소
  if(e.key!=='Tab') return;
  var f=_admDlgTabbables(); if(!f.length) return;
  var first=f[0], last=f[f.length-1], a=document.activeElement, inside=_admDlg.box.contains(a);
  // 포커스 트랩 — 양 끝에서 되돌려 Tab이 판 밖으로 새지 않게
  if(e.shiftKey){ if(!inside || a===first){ e.preventDefault(); last.focus(); } }
  else { if(!inside || a===last){ e.preventDefault(); first.focus(); } }
}
function _admDlgEnd(ok){
  var fn=_admDlg.onEnd; if(!fn) return;   // 이미 닫힌 판 — 두 번 결론내지 않는다
  _admDlg.onEnd=null;
  _admDlg.ov.classList.remove('show');

  _admDlg.prevFocus=null;

function _admDlgShow(o){

    _admDlgInit();
    var kind=o.kind||'alert';
    _admDlg.t.textContent=o.title||'확인';
    _admDlg.b.textContent=o.body||'';
    _admDlg.b.style.display=o.body?'block':'none';
    _admDlg.pre.textContent=o.pre||'';
    _admDlg.pre.style.display=o.pre?'block':'none';
    _admDlg.box.className='modal'+(o.danger?' danger':'');
    _admDlg.no.style.display=(kind==='alert')?'none':'block';
    _admDlg.no.textContent=o.no||'취소';
    _admDlg.yes.textContent=o.yes||'확인';
    _admDlg.yes.className='btn '+(o.danger?'btn-seal':'btn-line');   // 진사 버튼은 되돌릴 수 없는 동작에만
    if(kind==='prompt'){
      _admDlg.field.style.display='block';
      _admDlg.label.textContent=o.label||'';
      _admDlg.label.style.display=o.label?'block':'none';
      _admDlg.input.value=(o.value==null?'':String(o.value));
      _admDlg.input.placeholder=o.placeholder||'';
    } else { _admDlg.field.style.display='none'; _admDlg.input.value=''; }
    _admDlg.prevFocus=document.activeElement;
    _admDlg.prevOverflow=document.body.style.overflow;
    document.body.style.overflow='hidden';
    _admDlg.onEnd=function(ok){
      if(kind==='prompt') resolve(ok?_admDlg.input.value:null);
      else if(kind==='confirm') resolve(!!ok);
      else resolve();
    };
    _admDlg.ov.classList.add('show');
    // 첫 포커스 — 확인 판은 '취소'에 둔다(Enter가 실행으로 새지 않게). 입력 판은 입력칸에 두고 전체선택.
    setTimeout(function(){
      try{
        if(kind==='prompt'){ _admDlg.input.focus(); _admDlg.input.select(); }
        else if(kind==='confirm') _admDlg.no.focus();
        else _admDlg.yes.focus();
      }catch(e){}
    },0);
  });
}
function _admDlgQueue(o){
  var p=_admDlg.queue.then(function(){ return _admDlgShow(o); });
  _admDlg.queue=p.then(function(){}, function(){});
  return p;
}
function admAlert(o){ o=o||{}; o.kind='alert'; return _admDlgQueue(o); }

function admPrompt(o){ o=o||{}; o.kind='prompt'; return _admDlgQueue(o); }

}

/* ─────────── 하객 인쇄물 (식순지 · 가족 낭독 카드) ───────────
   ★PRINT_FROM_SOURCE — 문안을 여기에 복붙하지 말 것. 선언 문안은 DECLWHO(assets/ritual-data.js)에서 읽는다.
     손으로 적으면 원천이 하나 더 생기고, 그 사본은 어떤 가드도 안 본다(인쇄물 기획안 §1).
     식순 목록·선언 주체는 전부 빌더 저장분(rd.summary·rd.S)에서 읽어 화면과 어긋날 수 없게 한다. */

// 인쇄물 전용 날짜(하객용 정식 표기). ★fmtDate()는 '7/26(일)' 운영자 축약형이라 여기 쓰면 안 되고, 고치지도 말 것(좌석표·목록이 쓴다).
function _printDateKo(ymd){ var m=String(ymd||'').match(/(\d{4})-(\d{1,2})-(\d{1,2})/); return m?(+m[1]+'년 '+(+m[2])+'월 '+(+m[3])+'일'):''; }

// customerNames()가 (g && b) ? g+' · '+b : (g||b||'고객') 로 만든 값이라 정확히 역변환된다. 한쪽이 비면 이름 삽입을 끈다.
function _printNames(d){
  var raw=String((d&&d.names)||'').trim(), p=raw.split(' · ');
  var g=(p[0]||'').trim(), b=(p[1]||'').trim();
  return { raw:raw, groom:g, bride:b, ok:!!(g&&b) };
}

// 인쇄 오버레이(좌석표와 같은 방식 · iframe srcdoc + contentWindow.print)

  var x=document.createElement('button'); x.type='button'; x.textContent='닫기'; x.style.cssText='border:1px solid #e6e0d8;background:#fff;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer';
  var fr=document.createElement('iframe'); fr.style.cssText='flex:1 1 auto;width:100%;border:none;background:#fff';
  var rg=document.createElement('div'); rg.appendChild(pbtn); rg.appendChild(x);
  bar.appendChild(ttl); bar.appendChild(rg); ov.appendChild(bar); ov.appendChild(fr); document.body.appendChild(ov);
  var _ld=false; fr.onload=function(){ _ld=true; };   // srcdoc 로드 전 인쇄 클릭 → 빈 페이지 방지
  fr.srcdoc=doc;
  pbtn.addEventListener('click',function(){ if(!_ld){ setTimeout(function(){ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){} },250); return; } try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){} });
  x.addEventListener('click',function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); });
}

// 가족 낭독 카드 · A5 가로 1장. ★이름이 실제로 들어가는 유일한 인쇄물(D안 본체 · TTS에는 이름을 넣지 않는다).
// ★_DECL_CARD_WHO — 낭독 카드를 뽑을 선언 주체. 합송(chorus)은 '보류'지 폐기가 아니다(2026-07-26). 승급하면 여기에 'chorus'를 넣고 아래 chorus 블록만 채운다.
var _DECL_CARD_WHO=['family'];
// 문장 단위 줄바꿈(낭독자가 어디서 숨 쉴지 알게). 뒤돌아보기 정규식 없이 처리 — 구형 사파리 호환.
function _splitSent(t){ return String(t||'').split(/\.\s+/).filter(function(x){return x.trim();}).map(function(x,i,a){ return esc(x.trim()+(/[.!?]$/.test(x.trim())?'':'.')); }); }
function _declareCardDoc(d){
  var rd=(d&&d.mirror&&d.mirror.production&&d.mirror.production.ritualDraft)||{};
  var who=(rd.S||{}).declareWho||'', nm=_printNames(d);
  var src=''; try{ if(typeof DECLWHO!=='undefined'&&DECLWHO[who]&&DECLWHO[who].nar) src=DECLWHO[who].nar; }catch(e){}   // ★원천에서 읽는다 · 복붙 금지
  var lines;
  if(who==='family'){
    // 조사가 이름에 한 번도 붙지 않는 문장 설계 — 이름 뒤는 전부 쉼표 아니면 공백이라 받침 판정 코드가 필요 없다.
    // 두음(류/유)은 정규화하지 않는다. 고객이 적어 준 한글 표기가 유일한 진실원이다.
    lines = nm.ok
      ? ['오늘, 신랑 '+esc(nm.groom)+', 신부 '+esc(nm.bride)+' 두 사람은','이 자리에 함께한 우리 모두를 증인으로','서로의 평생이 되었습니다.','','이 약속은 오늘부터 두 사람의 것입니다.','',
         '@신랑 '+esc(nm.groom)+', 신부 '+esc(nm.bride)+',','@이제 두 사람은 부부입니다.','',
         '가족 여러분과 함께,','두 사람에게 큰 박수를 보내 주시기 바랍니다.']
      // 한 칸만 채워진 레코드에서 '신랑 홍길동, 신부 ,'가 인쇄되는 것보다 무이름이 낫다 → 원천 문안 그대로 떨어뜨린다.
      : _splitSent(src);
  }
  else if(who==='chorus'){
    // ★합송 좌석 카드 — 승급 전이라 문안·규격 미정(인쇄물 기획안 §3). 분기 자리만 열어 둔 것이고, 채우기 전에는 버튼도 안 뜬다(_DECL_CARD_WHO).
    lines = _splitSent(src);
  }
  else lines = _splitSent(src);
  var body=lines.map(function(s){
    if(!s) return '<div class="sp"></div>';
    if(s.charAt(0)==='@') return '<div class="hi">'+s.slice(1)+'</div>';   // 선언 본문 줄(굵게·크게)
    return '<div class="ln">'+s+'</div>';
  }).join('');
  var css='*{box-sizing:border-box}body{font-family:"Noto Serif KR","Nanum Myeongjo",serif;color:#2a2018;margin:0;padding:4mm 6mm;display:flex;flex-direction:column;justify-content:center;min-height:100vh}'
    +'.cnote{text-align:center;font-size:11px;color:#8a8072;margin-bottom:7mm}'
    +'.ln{text-align:center;font-size:20px;line-height:1.75}'
    +'.hi{text-align:center;font-size:28px;line-height:1.6;font-weight:700;color:#6B2A24}'
    +'.sp{height:7mm}'
    +'@page{size:A5 landscape;margin:12mm}@media print{body{min-height:0}}';
  return '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>낭독 카드 '+esc((d&&d.code)||'')+'</title><style>'+css+'</style></head><body>'
    +'<div class="cnote">천천히 읽으셔도 됩니다.</div>'+body+'</body></html>';
}

function fmtDT(s){ var m=String(s||'').match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/); if(!m) return esc(s||''); var yr=(+m[1]!==new Date().getFullYear())?(m[1]+'/'):''; return yr+(+m[2])+'/'+(+m[3])+' '+m[4]+':'+m[5]; }

function ddayLabel(n,isSnap){ if(n==null) return ''; var w=isSnap?'촬영':'예식'; if(n>0) return w+' D-'+n; if(n<0) return w+' D+'+(-n); return w+' D-day'; }

  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(function(){ legacyCopy(text); done(); }); }
  else { legacyCopy(text); done(); }
}

// [ADM_AA10] 대기 일수 — 큐 항목의 _wait('YYYY-MM-DD')에서 오늘까지. 값이 없거나 형식이 다르면 -1(=분리 안 함).
var STALE_DAYS = 7;
function _waitDays(w){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(w||''))) return -1;
  var t=new Date(w+'T00:00:00').getTime(); if(isNaN(t)) return -1;
  var now=new Date(); now.setHours(0,0,0,0);
  return Math.floor((now.getTime()-t)/86400000);
}
function renderQueue(d){

  // [ADM_AA1] 급함 개수를 헤더 구석 11.5px 꼬리 → 제목 옆 배지로 승격. 0건이면 배지 자체를 안 그린다(0 표시 금지).
  html+='<div class="sect-h"><span class="tt">처리할 일</span>'+(ctUrgent?'<span class="urg-badge">🔴 '+ctUrgent+' 급함</span>':'')+'<span class="ct">'+ctTotal+'</span></div>';
  if(!ctTotal){
    html+='<div class="empty">✓ 처리할 일이 없어요 · 다 됐어요</div>';
  } else {
    if(u.length){ html+='<div class="qhead red">🔴 급한 것 ('+u.length+')</div>'+u.map(queueRow).join(''); }
    // [ADM_AA10] '그 외'는 단계순이라 오래 기다린 건이 아래로 묻힌다 → 7일 이상 대기만 위로 떼어 별도 묶음.
    //   서버 정렬(단계순 → 대기순)을 그대로 두고 걸러내기만 하므로 묶음 안 순서는 종전과 같다. _wait 없는 구 응답이면 전부 '그 외'로 남아 무회귀.
    var stale=[], rest=[];
    n.forEach(function(it){ (_waitDays(it&&it._wait)>=STALE_DAYS ? stale : rest).push(it); });
    if(stale.length){ html+='<div class="qhead">오래 기다린 것 ('+stale.length+')</div>'+stale.map(queueRow).join(''); }
    if(rest.length){ html+='<div class="qhead">그 외 ('+rest.length+')</div>'+rest.map(queueRow).join(''); }
  }

  $('queueWrap').querySelectorAll('.qbtn[data-go]').forEach(function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); var row=b.closest('.qrow'); openDetail(b.getAttribute('data-go'),'home',row&&row.getAttribute('data-kind')); }); });

  $('queueWrap').querySelectorAll('.qfit').forEach(function(w){

    b.addEventListener('click', function(e){

              ⑥ [접힘] 문항별 분포 전체  ⑦ [접힘] 후기 전문
   ★막대와 후기를 '지우지' 않았다 — details 안에 그대로 있다. 판단 근거는 언제든 펴서 봐야 한다. */
function _svTop(q){   // 한 문항에서 가장 많이 나온 값 → {v, c}
  var best=null,v;
  for(v in q){ if(q.hasOwnProperty(v) && q[v]>0 && (!best || q[v]>best.c)) best={v:v,c:q[v]}; }
  return best;
}
function _svLabel(k,val){ var m=SURVEY_Q[k]; return (m && m.o[val]) || val; }
function renderSurvey(d){
  var wrap=$('surveyWrap'); if(!wrap) return;
  var sv=d.survey||{n:0,q:{},recent:[]};
  var html='<div class="sect-h"><span class="tt">설문 결과</span><span class="ct">'+(sv.n||0)+'</span></div>';
  if(!sv.n){ wrap.innerHTML=html+'<div class="empty">아직 제출된 설문이 없어요. 전달 완료 고객이 후기를 남기면 여기에 집계돼요</div>'; return; }

  // ── ① 개선 신호 — '놓친 부분 있었음'은 항상 맨 위에 (안전망)
  var _gq=sv.q.gap||{}; var _gapN=(Number(_gq.minor)||0)+(Number(_gq.some)||0);

  // ── ② 브랜드 약속 3축 이행률
  html+='<div class="sv-pillars">';
  SURVEY_PILLARS.forEach(function(p){ var r=_svPct(sv.q[p.k],p.good); html+='<div class="sv-pill"><div class="sv-pill-pct">'+(r?r.pct+'%':'-')+'</div><div class="sv-pill-lb">'+esc(p.label)+'</div></div>'; });
  html+='</div>';

  // ── ③ 추천 의향 + 종합
  var rec=_svPct(sv.q.recommend,['definitely','maybe']), ov=_svPct(sv.q.overall,['very','satisfied']);
  html+='<div class="sv-sum">추천 의향 <b>'+(rec?rec.pct+'%':'-')+'</b> · 종합 만족 <b>'+(ov?ov.pct+'%':'-')+'</b></div>';

  // ── ④ 눈여겨볼 응답만 추려서 (없으면 한 줄로 '없음')
  var watch=[];
  SURVEY_ORDER.forEach(function(k){
    var meta=SURVEY_Q[k], q=sv.q[k]; if(!meta || !meta.neg || !q) return;
    meta.neg.forEach(function(val){ var c=Number(q[val])||0; if(c) watch.push({t:meta.t,l:meta.o[val],c:c}); });
  });
  if(watch.length){
    html+='<div class="sv-watch"><div class="sv-watch-h">눈여겨볼 응답 '+watch.length+'건</div><ul>';
    watch.forEach(function(w){ html+='<li>'+esc(w.t)+' — <b>'+esc(w.l)+'</b> '+w.c+'명</li>'; });
    html+='</ul></div>';
  } else {
    html+='<div class="sv-ok">아쉬움으로 답한 문항 없음 · 전 문항 긍정</div>';
  }

  // ── ⑤ 유입·결정은 품질이 아니라 마케팅 데이터 — 최다 응답만 한 줄로
  var st=_svTop(sv.q.source||{}), rt=_svTop(sv.q.reason||{}), bits=[];
  if(st) bits.push('유입 <b>'+esc(_svLabel('source',st.v))+'</b> '+st.c);
  if(rt) bits.push('결정 이유 <b>'+esc(_svLabel('reason',rt.v))+'</b> '+rt.c);
  if(bits.length) html+='<div class="sv-note">'+bits.join(' · ')+'</div>';

  // ── ⑥ [접힘] 문항별 분포 전체
  var qCount=0; SURVEY_ORDER.forEach(function(k){ if(sv.q[k]) qCount++; });
  if(qCount){

    SURVEY_ORDER.forEach(function(k){ var q=sv.q[k]; if(!q) return; var meta=SURVEY_Q[k]; var tot=0,v; for(v in q){ if(q.hasOwnProperty(v)) tot+=q[v]; } if(!tot) return;
      qs+='<div class="sv-qrow"><div class="sv-qt">'+esc(meta?meta.t:k)+'</div><div class="sv-bar">';
      var order=meta?Object.keys(meta.o):Object.keys(q);
      order.forEach(function(val,i){ var c=q[val]||0; if(!c) return; var pc=Math.round(c/tot*100); qs+='<span class="sv-seg sv-seg-'+(i)+'" style="width:'+pc+'%" title="'+esc((meta&&meta.o[val])||val)+' '+c+'명">'+(pc>=14?(pc+'%'):'')+'</span>'; });
      qs+='</div><div class="sv-leg">'; order.forEach(function(val,i){ var c=q[val]||0; if(!c) return; qs+='<span class="sv-lg"><i class="sv-dot sv-seg-'+i+'"></i>'+esc((meta&&meta.o[val])||val)+' '+c+'</span>'; }); qs+='</div></div>';
    });
    qs+='</div>';
    html+='<details class="sv-fold"><summary>문항별 분포 <span class="n">'+qCount+'문항</span></summary><div class="sv-fold-in">'+qs+'</div></details>';
  }

  // ── ⑦ [접힘] 후기 전문
  var revs=(sv.recent||[]).filter(function(x){ return x.review; });
  if(revs.length){
    var pub=revs.filter(function(x){ return x.reviewPublic==='Y'; }).length;
    var rv=revs.slice(0,12).map(function(x){ return '<div class="sv-rev'+(x.reviewPublic==='Y'?' pub':'')+'"><div class="sv-rev-m">'+esc(x.names||x.code)+' <span>'+esc(prodLabel(x.product))+'</span>'+(x.reviewPublic==='Y'?' <b>공개동의</b>':' <i>비공개</i>')+(x.gap&&x.gap!=='none'?' <b style="color:#8a5a1a">개선의견</b>':'')+'</div>“'+esc(x.review)+'”</div>'; }).join('');
    html+='<details class="sv-fold"><summary>후기 <span class="n">'+revs.length+'건'+(pub?(' · 공개동의 '+pub):'')+'</span></summary><div class="sv-fold-in">'+rv+'</div></details>';
  }

  wrap.innerHTML=html;
}

/* [ADM_AA6] 최근 본 고객 — openDetail 진입 시 {code,names} 최근 5명만 localStorage에 기록(중복은 앞으로).
     ★이름·코드만 저장한다. 금액·연락처 등 민감정보는 절대 넣지 않는다(공용 폰 분실 대비).
     localStorage 접근 실패(사파리 프라이빗 등)면 칩 영역 자체를 숨기고 조용히 넘어간다. */
var RECENT_KEY='me_admin_recent', RECENT_MAX=5;

function _recentPush(code,names){

}

function openDetail(code, origin, focusKind){

  show('loading'); $('loading').innerHTML='<div class="skel" style="height:40px"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';

    if(!d||!d.ok){ toast(d&&d.error||'불러오기 실패'); loadHome(); return; }
    curDetail=d; _recentPush(d.code||code, d.names); renderDetail(d); show('detail');   // [ADM_AA6] 조회 성공한 고객만 기록
    setTimeout(function(){
      // ★CARD_STAGE_ORDER 2026-07-25: 지금 단계 카드가 최상단으로 재배치되므로, 일반 열람은 헤더(이름·단계·연락)부터 위에서 보이게 하고,
      // 큐 일감(focusKind)으로 들어온 경우에만 해당 카드로 스크롤·강조한다.
      var target = (focusKind && KIND2CARD[focusKind]) ? document.querySelector('.card[data-k="'+KIND2CARD[focusKind]+'"]') : null;   // 큐에서 온 일감의 카드로 바로
      if(target){ var y=target.getBoundingClientRect().top+window.pageYOffset-72; window.scrollTo({top:y<0?0:y,behavior:'smooth'});
        target.classList.add('focus'); setTimeout(function(){ target.classList.remove('focus'); },2200); }
      else window.scrollTo(0,0);

  }).catch(function(e){ toast('오류'); loadHome(); });
}

function shortHist(l){ // [YYYY-MM-DD HH:mm] who: action → [M/D HH:mm] who: action
  return String(l||'').replace(/^\[(\d{4})-(\d{1,2})-(\d{1,2}) (\d{1,2}:\d{2})\]/, function(_,y,mo,da,hm){ var yr=(+y!==new Date().getFullYear())?(y+'/'):''; return '['+yr+(+mo)+'/'+(+da)+' '+hm+']'; });
}
function fieldGroups(fields){
  var G=[['예식 정보',['예식일자','요일','시간대','하객','디지털참석','의상']],['분위기·요청',['분위기·스냅','중요하게여김','망설이는점','준비상황']],['경로·메모·일정',['경로','참고링크','자유메모','그외가능시간대','기타희망시간']]];
  var map={}; fields.forEach(function(f){ map[f.label]=f; });
  var html='';
  G.forEach(function(grp){
    var rows=grp[1].map(function(lb){ var f=map[lb]; if(!f) return ''; var v=f.isLink?('<a href="'+esc(f.value)+'" target="_blank" rel="noopener">'+esc(f.value)+'</a>'):esc(f.value); return '<div class="fld"><span class="k">'+esc(lb)+'</span><span class="v">'+v+'</span></div>'; }).join('');

/* ── 카드 렌더 (raw + 거울 토글 + 버튼) ── */
function cardMeta(k,isSnap){ return {
  consult:{t:isSnap?'촬영 상담':'상담'}, fitting:{t:'시착'}, contract:{t:'계약'}, payment:{t:'입금'}, production:{t:'제작 · 청첩장'}, result:{t:'결과물'}
}[k]; }
function mirrorToggle(k,mirror){ if(!mirror) return ''; return '<button class="mt" data-mt="'+k+'">고객 화면 미리보기 ▾</button><div class="mbody" id="mb_'+k+'">'+kvDump(mirror)+'</div>'; }
function kvDump(o){ var h=''; for(var key in o){ if(!o.hasOwnProperty(key)||key.charAt(0)==='_') continue; var v=o[key]; if(v==null||v==='') continue; if(typeof v==='object') continue; h+='<div class="kv"><span class="k">'+esc(key)+'</span><span class="v">'+esc(String(v))+'</span></div>'; } return h||'<div class="cnote">표시할 내용 없음</div>'; }
/* ★CARD_STAGE_ORDER 2026-07-25 — 고객 상세: 지금 단계에 해당하는 카드를 최상단으로 (상황별 우선 노출)
   단계별 '지금 볼 카드'(첫 원소가 최우선). 여기 없는 단계는 서버 기본 순서 유지. */
function stageCards(stage){
  return {
    '신청접수':['consult'],'상담확정':['consult'],'촬영확정':['consult'],
    '시착':['consult','fitting'],'상담완료':['consult'],
    '계약완료':['contract'],'입금완료':['payment'],'제작중':['production'],
    '예식완료':['result'],'촬영완료':['result'],'결과물전달':['result'],'후기':['result'],   // STAGE_REVIEW
    '취소':['consult'],'미계약':['consult'],'노쇼':['consult']
  }[stage]||[];
}
function orderCards(cards, stage){   // 지금 단계 카드를 맨 위로 · 나머지는 원래(여정) 순서 유지
  var cur=stageCards(stage);
  if(!cur.length) return (cards||[]).slice();
  var top=[], rest=[];
  (cards||[]).forEach(function(k){ (cur.indexOf(k)!==-1?top:rest).push(k); });
  top.sort(function(a,b){ return cur.indexOf(a)-cur.indexOf(b); });
  return top.concat(rest);
}
function isCur(stage, k, isSnap){ return stageCards(stage).indexOf(k)!==-1; }   // '.cur' 하이라이트 = 최상단 카드와 동일 기준
function renderCard(k,d,isSnap){
  var m=cardMeta(k,isSnap); if(!m) return '';
  var inner='', mirror=d.mirror?d.mirror[k]:null;
  if(k==='consult') inner=cardConsult(d,isSnap);
  else if(k==='fitting') inner=cardFitting(d);
  else if(k==='contract') inner=cardContract(d,isSnap);
  else if(k==='payment') inner=cardPayment(d);
  else if(k==='production') inner=cardProduction(d);
  else if(k==='result') inner=cardResult(d,isSnap);
  if(k==='production') mirror=d.mirror?d.mirror.invitation:null;
  var cls='card'+(isCur(d.stage,k,isSnap)?' cur':'');
  return '<div class="'+cls+'" data-k="'+esc(k)+'"><div class="card-h"><span class="ct">'+esc(m.t)+'</span></div>'+inner+mirrorToggle(k,mirror)+'</div>';
}

function cardContract(d,isSnap){

  } else if(con==='발송'){ b+=ab('viewContract','계약서 보기','btn-line')+ab('sendContract','재발송','btn-line'); }

  if(con==='서명완료' && d.changeReq && d.changeReq.to){
    var _cq=d.changeReq, _cf=_cq.from||{}, _ct=_cq.to||{};

       +'<br>'+(_cfee>0?('수수료 '+_cfee.toLocaleString()+'원'+(_cq.payer?(' · 입금자 '+esc(_cq.payer)+' (통장 확인 후 적용)'):'')):'무상 변경')+(_cq.at?(' · 요청 '+fmtDT(_cq.at)):'')

  } else if(st==='결과물전달'||st==='후기'){   // STAGE_REVIEW — 후기 넘기기·쿠폰 버튼이 후기 단계에서도 보이게
    var svS=r['설문상태']||'대기';
    b+='<div class="gate">✓ 전달 완료'+(svS==='완료'?' · 후기 완료':(svS==='건너뜀'?' · 후기 넘김':' · 후기 작성 대기'))+'</div>';
    if(exPay) b+=ab('confirmExtra','추가 보정 입금 확인');
    if(svS!=='완료'&&svS!=='건너뜀') b+=ab('skipSurvey','후기 넘기기 (설문 생략)','btn-line');
    // 커피쿠폰 — 후기 완주 고객에게 바코드 발급(마이페이지 표시). 발급됨이면 회수 가능.
    var cpS=r['쿠폰상태']||'';
    if(cpS==='발급') b+='<div class="gate">커피쿠폰 발급됨 · 고객 마이페이지에 표시 중</div>'+ab('revokeCoupon','커피쿠폰 회수','btn-line');
    else if(svS==='완료') b+=ab('issueCoupon','커피쿠폰 발급 (바코드)','btn-line');
  }
  return '<div class="raw">'+raw+'</div>'+btnsWrap(b);
}

    '<div class="actions"><button class="btn btn-danger" id="fGo" disabled>강제 변경</button></div></div></div>';

/* [ADM_AC3] 단계를 고르면 서버 미리보기를 불러 '비워짐 / 유지됨 / 상담 예약 초기화'를 목록으로 보여준다.
     실행과 같은 _clearForwardData(report 모드)라 미리보기와 실제 결과가 어긋나지 않는다.
     유지됨(ROLLBACK_KEEP_PAID)을 같이 보여주는 이유 — 입금 기록은 강제변경으로 안 지워진다는 걸 알아야
     입금 오처리를 여기서 우회하지 않고 '입금 확인 취소'로 가게 된다. */
function _forceGate(){
  var go=$('fGo'); if(!go) return;
  var st=$('fStage'), ag=$('fAgree');
  go.disabled = !(st && st.value && ag && ag.checked);
}
function _forcePreview(code){
  var box=$('fPrev'), st=$('fStage'); if(!box||!st) return;
  var ag=$('fAgree'); if(ag) ag.checked=false; _forceGate();
  if(!st.value){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block'; box.innerHTML='<span class="adv-prev-h">확인 중</span>';
  gas('adminForceStagePreview', code, st.value).then(function(p){
    if(!(p&&p.ok)){ box.innerHTML='<span class="adv-prev-h">미리보기를 불러오지 못했어요</span><div>'+esc((p&&p.error)||'')+'</div>'; return; }
    var h='<span class="adv-prev-h">'+esc(p.from||'')+' → '+esc(p.to||'')+'</span>';
    if(p.noop) h+='<div>바뀌는 것이 없어요</div>';
    if((p.cleared||[]).length) h+='<div class="adv-prev-x">비워짐 · '+p.cleared.map(esc).join(' · ')+'</div>';
    if((p.consent||[]).length) h+='<div class="adv-prev-x">동의기록에서 지워짐 · '+p.consent.map(esc).join(' · ')+'</div>';
    if(p.bookingReset) h+='<div class="adv-prev-x">상담 예약이 신청접수로 · 캘린더 슬롯 해제</div>';
    if(p.holdRelease) h+='<div class="adv-prev-x">예식일 임시고정(가예약) 해제 · 캘린더 이벤트 삭제</div>';   /* [ADM_AC3FIX] 실행할 때만 실제로 지워져요 */
    if((p.kept||[]).length) h+='<div class="adv-prev-k">유지됨 · '+p.kept.map(esc).join(' · ')+' <span style="color:var(--label-soft)">(확인된 수납은 강제 변경으로 지워지지 않아요 · 되돌리려면 입금 확인 취소)</span></div>';
    if(!(p.cleared||[]).length && !(p.consent||[]).length && !p.bookingReset && !p.noop) h+='<div>비워지는 데이터는 없어요</div>';
    box.innerHTML=h;
  }).catch(function(){ box.innerHTML='<span class="adv-prev-h">미리보기를 불러오지 못했어요</span>'; });
}

function onDetailAct(act,d){
  var code=d.code, names=d.names, isSnap=snap(d.product);

  if(act.indexOf('undoReceipt:')===0){ doUndoReceipt(code,names,act.slice(12)); return; }
  if(act.indexOf('undoPay:')===0){ doUndoPay(code,names,act.slice(8),d); return; }   /* [ADM_AC1] */
  if(act==='approve') doApprove(code,names);
  else if(act==='accept') doAccept(code,names);
  else if(act==='cancel') doCancel(code,names);
  else if(act==='grantHold') doGrantHold(code,names,d);
  else if(act==='declineHold') doDeclineHold(code,names,d);
  else if(act==='propose') openPropose(code,names);
  else if(act==='consultDone') doConsultDone(code,names);
  else if(act==='noshow') doNoshow(code,names);
  else if(act==='openFitting') doOpenFitting(code,names);
  else if(act==='closeFitting') doCloseFitting(code,names);
  else if(act==='sendContract') openSendContract(code,names,d);
  else if(act==='viewContract') openContractViewer(d);
  else if(act==='uncontracted') doUncontracted(code,names);
  else if(act==='confirmPay') doConfirmPay(code,names,d);
  else if(act==='confirmBalance') doConfirmBalance(code,names,d);
  else if(act==='confirmMid') doConfirmMid(code,names,d);
  else if(act==='confirmMidBal') doConfirmMidBal(code,names,d);
  else if(act==='setResult') openSetResult(code,names,isSnap,d);
  else if(act==='eventDone') doEventDone(code,names,isSnap);
  else if(act==='delivered') doDelivered(code,names,d);
  else if(act==='confirmExtra') doConfirmExtra(code,names,d);
  else if(act==='markRefunded') doMarkRefunded(code,names,d);
  else if(act==='undoRefunded') doUndoRefunded(code,names,d);   /* [ADM_AC2] */
  else if(act==='startRetouch') doStartRetouch(code,names);
  else if(act==='skipSurvey') doSkipSurvey(code,names);
  else if(act==='issueCoupon') doIssueCoupon(code,names);
  else if(act==='revokeCoupon') doRevokeCoupon(code,names);
  else if(act==='confirmChange') doConfirmChange(code,names,d);
  else if(act==='declineChange') doDeclineChange(code,names,d);
}

/* ════════ 액션 모달 (큐·상세 공용) ════════ */
var _modalYes=null;
function openModal(opt){
  $('cm_title').textContent=opt.title;
  $('cm_text').innerHTML=opt.text||'';
  $('cm_extra').innerHTML=opt.extra||'';
  $('cm_err').textContent='';
  $('cm_yes').disabled=false;
  $('cm_yes').textContent=opt.yes||'확인';
  $('cm_yes').className='btn '+(opt.danger?'btn-danger':'btn-seal');
  $('modalBox').className='modal'+(opt.danger?' danger':'');
  _modalYes=opt.onYes;
  $('confirmModal').classList.add('show');
  if(opt.init) opt.init();
}
function closeModal(){ $('confirmModal').classList.remove('show'); _modalYes=null; }
$('cm_no').addEventListener('click', closeModal);
$('cm_yes').addEventListener('click', function(){ if(_modalYes) _modalYes(); });
$('confirmModal').addEventListener('click', function(e){ if(e.target===$('confirmModal')) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'&&$('confirmModal').classList.contains('show')) closeModal(); });
function mErr(m){ $('cm_err').textContent=m||''; }
function mBusy(b,lbl){ $('cm_yes').disabled=b; $('cm_yes').textContent=b?'처리 중…':(lbl||'확인'); }
function b(s){ return '<b>'+esc(s)+'</b>'; }
function li(s){ return '<span class="li">· '+esc(s)+'</span>'; }

function runAct(fnArgs, code, lbl){
  mBusy(true); mErr('');
  gas.apply(null, fnArgs).then(function(r){ if(r&&r.ok){ afterAction(code,r,fnArgs[0]); } else { mBusy(false,lbl); mErr(r&&r.error||'실패'); } })
    .catch(function(e){ mBusy(false,lbl); mErr('오류: '+(e&&e.message||e)); });
}
function afterAction(code,res,act){
  closeModal();
  if(res&&res.archived){ toast('처리됨 · 아카이브로 이동'); if(_view==='archive') loadArchive(); else loadHome(); return; }
  /* [ADM_AB3] 알림 사실대로 — 서버가 알아서 보내는 액션에 '잊지 마세요'라고 하면 관리자가 같은 안내를 한 번 더 보내게 된다.
       라벨(NH)과 자동 발송 여부(NH_AUTO)를 나란히 둬서, 새 이벤트가 생기면 두 줄만 더하면 토스트가 따라온다.
       ★NH_AUTO=false는 '지금 알림이 없는 상태'를 그대로 적을 뿐, 발송 재개(95_notify의 off 설정)는 여기서 건드리지 않는다. */
  var NH={adminSendContract:'계약서 도착',adminOpenFittingConsent:'드레스 시착 동의 요청',adminConfirmPayment:'계약금 입금 확인',adminConfirmMid:'중도금 입금 확인',adminConfirmBalance:'잔금 입금 확인',adminConfirmMidBalance:'중도금·잔금 입금 확인',adminSetResultLinks:'결과물 등록',adminMarkDelivered:'결과물 전달',adminMarkConsultDone:'상담 완료 · 마이페이지에서 계약 진행 안내',adminConfirmWeddingChange:'예식일 변경 적용',adminDeclineWeddingChange:'예식일 변경 거절(재조율)'};
  var NH_AUTO={adminSendContract:true,adminOpenFittingConsent:true,adminConfirmPayment:true,adminSetResultLinks:true,adminMarkDelivered:true,adminMarkConsultDone:true,adminConfirmWeddingChange:true,adminDeclineWeddingChange:true,
    adminConfirmMid:false,adminConfirmBalance:false,adminConfirmMidBalance:false};   // 입금 확인 3종은 cust.paymentConfirmed가 꺼져 있어 고객에게 아무것도 안 나감
  toast(!NH[act] ? '✓ 처리됨'
    : NH_AUTO[act] ? ('✓ 처리됨 · 고객에게 「'+NH[act]+'」 카톡이 자동으로 나가요')
    : '✓ 처리됨 · 이 확인은 고객 알림이 따로 가지 않아요');
  if(_view==='detail') openDetail(code);
  else if(_view==='archive') loadArchive();
  else loadHome();
  /* ★LINK_VERIFY_WARN 2026-07-25 — 서버 검증 경고(결과물 링크 등)가 있으면 저장 성공과 구분되는 경고 모달로 표시(저장은 이미 완료) */
  if(res&&res.warnings&&res.warnings.length){
    var wb='<div style="background:#fdf3e0;border:1px solid #ecd9b0;border-radius:8px;padding:10px 12px;text-align:left">'+
      res.warnings.map(function(w){ return '<div style="font-size:13px;color:#8a5a2b;line-height:1.55;margin:3px 0">· '+esc(w)+'</div>'; }).join('')+
      '</div>';
    openModal({ title:'저장은 됐어요 · 링크 확인이 필요해요', text:'<span class="li">저장은 완료됐지만, 아래 링크는 고객이 열지 못할 수 있어요.</span>', extra:wb, yes:'확인', onYes:closeModal });
  }
}

function doApprove(code,names){ openModal({ title:'이 상담을 승인할까요?', text:b(names)+li('고객에게 확정 메일이 가요')+li('캘린더에 일정이 생겨요'), yes:'승인', onYes:function(){ runAct(['adminApprove',code],code,'승인'); } }); }
/* [ADM_AB1] 금전 확인 모달의 근거 — 라벨/값 분리(현금영수증 발행 모달과 같은 형태).
     값이 없으면 그 줄을 아예 그리지 않는다(빈칸·'-'·0원 표시 금지). 버튼 라벨엔 금액을 넣지 않는다. */
/* [ADM_MONEYNUM 2026-07-26 점검] 시트 금액이 문자로 들어오는 경우 방어 — '3,500,000'·'₩2,800,000원'처럼
     콤마·통화기호가 붙은 값이 그대로 오면 Number()가 NaN이 되어 화면에 '총액 NaN원'이 찍힌다.
     서버는 이미 같은 이유로 _wonNum(70_journey)을 쓴다. 프론트도 같은 기준(숫자만 추출)으로 통일. */
function _moneyNum(v){ var t=String(v==null?'':v).replace(/[^0-9]/g,''); return t?Number(t):0; }
function _amtKo(n){ n=_moneyNum(n); return (n>0) ? n.toLocaleString()+'원' : ''; }
function _payFacts(rows){
  var ro='background:#faf7f0;border:1px solid #ece3d0;border-radius:6px;padding:7px 9px;font-size:13px;color:#5c4a2c', out='';
  (rows||[]).forEach(function(r){
    var v=(r&&r.v!=null)?String(r.v).trim():'';
    if(!v) return;
    out+='<div class="field"><label>'+esc(r.k)+'</label><div style="'+ro+'">'+esc(v)+'</div></div>';
  });
  return out;
}
/* [ADM_AC5] 자동 발송이 없는 3종(중도금·잔금·묶음) — 알림을 코드로 켜지 않고, 필요할 때 직접 보내도록 문구만 복사해 준다.
     문구는 서버(95_notify 템플릿)에서 그대로 받아온다. 관리자용 문구를 여기서 따로 쓰면 두 곳이 갈라진다. */
var _AC5_NOTE = '이 확인은 고객 알림이 자동으로 가지 않아요 · 필요하면 아래 문구를 복사해 보내 주세요';
var _AC5_KIND = '';
function _copyNotifyBtn(code,kind){

  return '<div class="field"><label>고객 안내 문구</label><button type="button" class="btn-line" id="cpNf" data-code="'+esc(code)+'" style="width:100%;padding:10px;font-size:12px">카톡 문구 복사</button><div class="paste-hint" id="cpNfHint"></div></div>';
}
function _bindCopyNotify(){
  var btn=$('cpNf'); if(!btn) return;
  btn.addEventListener('click', function(){
    var hint=$('cpNfHint'); btn.disabled=true; btn.textContent='문구 불러오는 중';
    gas('adminNotifyText', btn.getAttribute('data-code'), 'cust.paymentConfirmed', _AC5_KIND).then(function(r){
      btn.disabled=false; btn.textContent='카톡 문구 복사';
      if(!(r&&r.ok&&r.text)){ if(hint) hint.textContent=(r&&r.error)||'문구를 불러오지 못했어요'; return; }
      copyText(r.text, btn);
      if(hint) hint.textContent='복사했어요 · 카카오톡에 붙여넣어 보내 주세요';
    }).catch(function(){ btn.disabled=false; btn.textContent='카톡 문구 복사'; if(hint) hint.textContent='문구를 불러오지 못했어요'; });
  });
}
// 큐에서 열면 서버가 만든 요약 문장(sub)을 통째로 한 줄에 — 앞단에서 쪼개 해석하지 않는다. 상세에서 열면 기록된 값에서 조립.
function _payRows(d,kind){
  if(!d) return [];
  if(d.sub!=null && !d.raw) return [{k:'입금 내용', v:d.sub}];
  var r=d.raw||{}, bal=(d.mirror&&d.mirror.balance)||{};
  // [ADM_AB1B] 금액은 서버가 계산해 보낸 d.milestoneAmounts만 쓴다(프론트 산식 복제 금지).
  //   구 GAS(재배포 전)면 값이 없어 금액 줄이 빠질 뿐, 화면은 그대로 뜬다.
  var ma=d.milestoneAmounts||{};

// 파일 → 캔버스 축소 → JPEG. 목표 글자수 이내가 될 때까지 해상도·품질을 낮춰 재시도.
function _cpnCompress(file, budget){
  return new Promise(function(resolve){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        function tryOut(maxW,q){
          var scale=Math.min(1, maxW/w); var cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
          var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
          var ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch); ctx.drawImage(img,0,0,cw,ch);
          return cv.toDataURL('image/jpeg', q);
        }
        var widths=[900,760,640,520,420], qs=[0.82,0.72,0.62,0.5];
        var out='';
        for(var i=0;i<widths.length;i++){ for(var j=0;j<qs.length;j++){ var d=tryOut(widths[i],qs[j]); if(d.length<budget){ out=d; break; } } if(out) break; }
        if(!out){ out=tryOut(360,0.42); if(out.length>=budget) out=''; }   // 그래도 크면 실패 처리
        resolve(out||'');
      };
      img.onerror=function(){ resolve(''); };
      img.src=fr.result;
    };
    fr.onerror=function(){ resolve(''); };
    fr.readAsDataURL(file);
  });
}

  }
  if(v==='v1.1') return '/contract/archive/v1-1.html';
  if(v==='v1.2') return '/contract/archive/v1-2.html';
  return '/contract/v1-1.html';   // 현행(v1.3) · 서명 시점 docVersion 문서를 열람(관리자=고객 동일 뷰)
}
function contractFullUrl(product){ return 'https://momentedit.kr'+contractPath(product); }
// [계약] 관리자 계약서 미리보기 — 고객이 보는 '채워진' 계약서(상품별)를 같은 방식(iframe+postMessage)으로. 서명 이미지는 관리자 클라 미보유 → '서명 완료'로 표시.
function openContractViewer(d, ov2){
  d=d||curDetail||{}; var r=d.raw||{}; var nm=String(d.names||'').split(' · '); var ci=d.contractReq||{}; ov2=ov2||{};
  var fillData={
    groom:(nm[0]||'').trim(), bride:(nm[1]||'').trim(),
    groomBirth:ci.groomBirth||'', brideBirth:ci.brideBirth||'',
    groomAddr:ci.groomAddr||'', brideAddr:ci.brideAddr||'',
    groomPhone:ci.groomPhone||d.phone||'', groomEmail:ci.groomEmail||d.email||'', bridePhone:ci.bridePhone||'', brideEmail:ci.brideEmail||'',
    weddingDate:ov2.weddingDate||(d.pin&&d.pin.예식일)||ci.weddingDate||'',
    weddingTime:ov2.weddingTime||ci.weddingTime||'',                         // 예식 시간 — 계약서 '예식 일시'에 본예식 기준으로 표기(템플릿이 슬롯→본예식 변환)
    weddingTimeLabel:ci.weddingTimeLabel||'',
    total:(ov2.total!=null)?ov2.total:Math.round(Number(r.계약총액)||0),
    signed:ov2.preview?false:((r.계약상태==='서명완료')|| !!r.계약서명일시),
    signDate:r.계약서명일시?String(r.계약서명일시).slice(0,10):'',
    docTitle:[(d.product||'계약서'),((nm[0]||'')+(nm[1]?('·'+nm[1]):'')),((d.pin&&d.pin.예식일)||ci.weddingDate||'')].filter(Boolean).join('_'),
    product:d.product||''
  };
  var ov=document.createElement('div'); ov.id='adm_ctViewer';
  ov.style.cssText='position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column;opacity:0;transition:opacity .2s';
  var bar=document.createElement('div'); bar.style.cssText='flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #e6e0d8;background:#fff';
  bar.innerHTML='<span style="font-size:14px;color:#3a2f25">'+(ov2.preview?'발송 전 미리보기':('계약서 미리보기'+(fillData.signed?' · 서명 완료':'')))+' <span style="color:#9a8f80;font-size:12px">'+esc(d.names||'')+'</span></span>';
  var x=document.createElement('button'); x.type='button'; x.textContent='닫기'; x.style.cssText='border:1px solid #e6e0d8;background:#fff;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer';
  var pbtn=document.createElement('button'); pbtn.type='button'; pbtn.textContent='인쇄·저장'; pbtn.style.cssText='border:1px solid #e6e0d8;background:#fff;border-radius:6px;padding:8px 14px;margin-right:8px;font-size:13px;cursor:pointer';
  pbtn.addEventListener('click',function(){ try{ var w=fr.contentWindow; w.focus(); w.print(); }catch(e){} });
  var rg=document.createElement('div'); rg.style.cssText='display:flex;align-items:center'; rg.appendChild(pbtn); rg.appendChild(x);
  bar.appendChild(rg);
  var fr=document.createElement('iframe'); fr.src=contractPath(d.product, fillData.signed && d.consent && d.consent.contract && d.consent.contract.docVersion); fr.title='계약서 미리보기'; fr.style.cssText='flex:1 1 auto;width:100%;border:none;opacity:0;transition:opacity .25s ease';
  ov.appendChild(bar); ov.appendChild(fr); document.body.appendChild(ov);
  requestAnimationFrame(function(){ ov.style.opacity='1'; });
  var prevOv=document.body.style.overflow; var _sbw=window.innerWidth-document.documentElement.clientWidth; if(_sbw>0) document.documentElement.style.paddingRight=_sbw+'px'; document.body.style.overflow='hidden';   // 스크롤바가 사라져도 폭을 유지해 배경 밀림 방지
  function done(){ window.removeEventListener('message',onMsg); document.removeEventListener('keydown',onKey); if(ov.parentNode) ov.parentNode.removeChild(ov); document.body.style.overflow=prevOv; document.documentElement.style.paddingRight=''; }
  function onKey(e){ if(e.key==='Escape') done(); }
  function onMsg(ev){ if(ev.source!==fr.contentWindow || ev.origin!==location.origin) return; if(ev.data && ev.data.type==='momentedit:contractReady'){ fr.contentWindow.postMessage({type:'momentedit:contractFill', data:fillData}, location.origin); setTimeout(function(){ fr.style.opacity='1'; },70); } }
  x.addEventListener('click',done); document.addEventListener('keydown',onKey); window.addEventListener('message',onMsg);
  if(fillData.signed){   // 서명완료면 고객 손글씨 진본 가져와 다시 채움(관리자 검증용)
    try{ gas('adminGetSignature', d.code, '계약').then(function(rr){ if(rr&&rr.ok&&rr.dataUrl){ fillData.signImage=rr.dataUrl; if(fr.contentWindow) fr.contentWindow.postMessage({type:'momentedit:contractFill', data:fillData}, location.origin); } }).catch(function(){}); }catch(e){}
  }
}

// [ADM_AA5] 링크 입력칸 옆 '붙여넣기' — 하루 최다 손입력 제거. clipboard 미지원·권한 거부면 버튼을 숨기고 손입력 그대로(조용한 폴백 · alert 금지).
//   실패 안내는 H2 매핑대로 필드 옆 인라인 + focus. https로 시작할 때만 자동 채움(엉뚱한 클립보드 내용 방지).
function _pasteField(inputId){
  var inp=$(inputId), btn=$(inputId+'_paste'), hint=$(inputId+'_hint');
  if(!inp||!btn) return;
  if(!(navigator.clipboard && navigator.clipboard.readText)){ btn.style.display='none'; return; }
  btn.addEventListener('click', function(){
    navigator.clipboard.readText().then(function(t){
      t=String(t||'').trim();
      if(/^https:\/\//i.test(t)){ inp.value=t; if(hint) hint.textContent=''; inp.focus(); }
      else { if(hint) hint.textContent='복사해 둔 내용이 https 링크가 아니에요. 직접 붙여넣어 주세요.'; inp.focus(); }
    }).catch(function(){ btn.style.display='none'; if(hint) hint.textContent=''; });   // 권한 거부 등 — 버튼만 치우고 손입력 유지
  });
}
function _linkField(label,id,val){
  return '<div class="field"><label>'+esc(label)+'</label>'
    +'<div class="paste-row"><input type="url" id="'+id+'" inputmode="url" autocomplete="off" placeholder="https://…" value="'+esc(val||'')+'">'
    +'<button type="button" class="paste-btn" id="'+id+'_paste">붙여넣기</button></div>'
    +'<div class="paste-hint" id="'+id+'_hint"></div></div>';
}
function openSetResult(code,names,isSnap,d){
  var r=d.raw||{};
  var extra=_linkField('원본 드라이브 링크','rOrig',r['원본링크'])
    +_linkField('보정본 폴더 링크','rReto',r['보정본폴더'])
    +(isSnap?'':_linkField('본식 영상 링크','rVid',r['영상링크']));
  openModal({ title:'결과물 링크 등록', text:bumpName(names)+li('부분 입력 가능 (원본만 먼저 OK)')+li('원본만 저장 → 원본전달(고객이 고르기 시작) · 보정본 저장 → 보정중')+li('드라이브 공유가 "링크가 있는 모든 사용자"인지 먼저 확인해 주세요 · 저장 후 자동 점검이 한 번 더 경고해요')+li('처음 등록하면 고객에게 도착 알림이 바로 가요')   /* [ADM_AB4] 저장이 곧 고객 알림임을 누르기 전에 */, extra:extra, yes:'저장',
    init:function(){ _pasteField('rOrig'); _pasteField('rReto'); if(!isSnap) _pasteField('rVid'); },   // [ADM_AA5]
    onYes:function(){ var links={ '원본':String($('rOrig').value||'').trim(), '보정본':String($('rReto').value||'').trim(), '영상':(isSnap?'':String($('rVid')?$('rVid').value:'').trim()) };
      runAct(['adminSetResultLinks',code,links],code,'저장'); } });
}

function openPropose(code,names){
  gas('adminAvailability').then(function(d){
    if(d&&d.ok){ SLOTS.weekday=d.slotsWeekday||[]; SLOTS.weekend=d.slotsWeekend||[]; }
    var extra='<div class="field"><label>날짜</label><input type="date" id="pDate"></div>'+
      '<div class="field"><label>시간</label><select id="pTime"><option value="">날짜를 먼저 선택</option></select></div>'+
      '<div class="field"><label>메모(선택)</label><input type="text" id="pMemo" placeholder="고객에게 전할 한마디"></div>';
    openModal({ title:'시간 변경 제안', text:bumpName(names)+'님께 새 시간을 제안해요.', extra:extra, yes:'제안 보내기',
      init:function(){ var pd=$('pDate'); if(pd) pd.addEventListener('change',function(){ fillTimes(pd.value); }); },
      onYes:function(){ var nd=$('pDate').value, nt=$('pTime').value; if(!nd||!nt){ mErr('날짜와 시간을 선택해 주세요.'); return; } runAct(['adminProposeTime',code,nd,nt,$('pMemo').value||''],code,'제안 보내기'); } });
  }).catch(function(){ toast('슬롯 로드 실패'); });
}
function fillTimes(dateStr){ var sel=$('pTime'); if(!sel) return; var slots=[]; if(dateStr){ var d=new Date(dateStr+'T00:00:00'); var wd=d.getDay(); slots=(wd===0||wd===6)?SLOTS.weekend:SLOTS.weekday; } sel.innerHTML=slots.length?slots.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join(''):'<option value="">가능한 시간 없음</option>'; }

function _advHint(id,msg){
  var el=$(id); if(!el) return;
  var h=document.getElementById(id+'_hint');
  if(!h){ h=document.createElement('div'); h.id=id+'_hint'; h.className='adv-hint'; el.parentNode.insertBefore(h, el.nextSibling); }
  h.textContent=msg; try{ el.focus(); }catch(e){}
}
function doForce(code,names,target,reason){
  reason=String(reason||'').trim();
  // [ADM_AC3] 입력 누락은 필드 옆 인라인 + focus(H2 매핑) — 토스트는 사라져서 어디가 비었는지 안 보인다.
  if(!target){ _advHint('fStage','바꿀 단계를 선택해 주세요'); return; }
  if(!reason){ _advHint('fReason','강제 변경 사유를 입력해 주세요'); return; }
  openModal({ title:'강제로 단계를 바꿀까요?', danger:true, text:bumpName(names)+li('→ '+target+'(으)로 강제 변경')+li('⚠ 그 이후 단계 진행 데이터(계약·입금·시착 등)가 초기화돼요')+li('상담 예약(캘린더)은 별개예요')+li('이력에 남아요'), yes:'강제 변경',
    onYes:function(){ runAct(['adminForceStage',code,target,reason],code,'강제 변경'); } });
}

function saveMemo(){
  var memo=$('memoArea').value, btn=$('memoSave');
  btn.disabled=true; btn.textContent='저장 중…';
  gas('adminSaveMemo', curDetail.code, memo).then(function(d){ btn.disabled=false; btn.textContent='메모 저장'; toast(d&&d.ok?'저장됨':'저장 실패'); }).catch(function(){ btn.disabled=false; btn.textContent='메모 저장'; toast('오류'); });
}

/* ════════ 아카이브 ════════ */
function openArchive(){ _arcQuery=''; _arcFilter='all'; $('aq').value=''; loadArchive(); }
function loadArchive(){
  _admHistInit(); if(_view!=='archive') _admPushView('archive');   // [ADMIN_BACK_NAV] 목록→아카이브 진입 시 1회 push
  show('loading'); $('loading').innerHTML='<div class="spinner"></div>불러오는 중…';
  gas('adminArchive', _arcQuery, _arcFilter).then(function(d){
    if(!d||!d.ok){ toast('불러오기 실패'); return; }
    renderArchive(d); show('archive');
  }).catch(function(){ toast('오류'); });
}
function renderArchive(d){
  var chips=[['all','전체'],['done','완료(전달)'],['stopped','중단']];
  $('aChips').innerHTML=chips.map(function(c){ return '<div class="achip'+(_arcFilter===c[0]?' active':'')+'" data-f="'+c[0]+'">'+esc(c[1])+'</div>'; }).join('');
  $('aChips').querySelectorAll('.achip').forEach(function(el){ el.addEventListener('click', function(){ _arcFilter=el.getAttribute('data-f'); loadArchive(); }); });
  var html='';
  if(!d.results.length) html='<div class="empty">'+(_arcQuery?('\''+esc(_arcQuery)+'\' 결과가 없어요'):'끝난 고객이 없어요')+'</div>';
  else {
    if(!_arcQuery) html+='<div class="qhead">최근 종료 '+d.results.length+'명'+(d.total>d.results.length?(' (전체 '+d.total+')'):'')+'</div>';
    html+=d.results.map(function(r){
      var done=r.endType==='완료';
      var rb=r.rcptDue?'<span class="endchip" style="background:#fdf3e0;color:#b5852a;border:1px solid #ecd9b0">영수증 미발행</span>'
            :(r.rcptFix?'<span class="endchip" style="background:#fbeaea;color:#b3261e;border:1px solid #efc9c5">영수증 정리</span>':'');
      return '<div class="arow" data-code="'+esc(r.code)+'"><span class="endchip '+(done?'done':'stopped')+'">'+(done?'✓':'✕')+' '+esc(r.endTypeLabel)+'</span>'+rb+
        '<span class="an">'+esc(r.names)+' <span style="font-size:10px;color:var(--label-soft)">'+esc(prodLabel(r.product))+'</span></span>'+
        (r.modified?'<span class="ad">종료 '+esc(fmtDT(r.modified))+'</span>':'')+'</div>';
    }).join('');
  }
  $('archiveBody').innerHTML=html;
  $('archiveBody').querySelectorAll('.arow').forEach(function(el){ el.addEventListener('click', function(){ openDetail(el.getAttribute('data-code'),'archive'); }); });
}
