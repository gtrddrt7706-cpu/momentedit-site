<!-- ★★[DRESS_PUBLIC_OFF 2026-10-23 코워크 설계 명세 2 · 사장님 «마이페이지만»] 공개 «의상과 소품» 화면(사진 · 드레스 그리드 · 라인 · 길이 · 시착 · 신랑 · 상담 예약 단추 · 푸터 · 자세히 겹화면)과
     홈 «드레스 둘러보기»는 걷었다 — 되살리기 금지(2026-10-23 사장님 지시로 삭제 · merge-guard 가 막는다).
     이 파일은 ?pick=1 고르기 화면 하나다 · 그 밖의 주소는 마이페이지로 넘긴다(뒤로가기에 이 쪽이 남지 않게 replace) -->
<script>if(!/[?&]pick=1(?:&|$)/.test(location.search))location.replace('/mypage.html');</script>

<style>
/* ★★[DRESS_PAGE 2026-10-23 코워크 설계 명세 «시착 준비»] ?pick=1 «드레스 미리 보기» 고르기 화면 하나(해요체 · 마이페이지가 겹화면 iframe 으로 연다 · 단독은 저장 없이 검토용).
   공개 «의상과 소품»은 걷었다([DRESS_PUBLIC_OFF] 명세 2). 틀은 마이페이지 입력 화면(위 «나가기» · 진행 표시 [WZ_STEPS] · 아래 막대 [WZ_BAR] · 고름 [SEL_ONE])을 따른다.
   글자 크기는 11 / 12 / 13 / 14 / 16 / 18 / 20 안에서([TYPO_SCALE7]). 색은 변수만. */
html{font-synthesis:weight}
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0;height:0;display:none}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  color-scheme:light;
  --bg:#FAFAF8;--bg2:#F5F3EF;--bg3:#EDEBE6;
  --text:#1C1B19;--sub:#5A554C;--light:#6E6959;--label-soft:#6F695D;
  --gold:#B89A75;--gold-text:#7A5F37;--gold-deep:#7A5F37;--gold-bg:#FAF6EF;
  --accent:#3A2D22;--seal:#6B2A24;
  --photo-bg:#B19E8C;   /* ★[DRESS_GREIGE 1024 사장님 «B 그레이지 무봉»] 사진 칸 바탕(받는 동안) = 사진 배경 그레이지 실측값(브라우저에서 18장 바탕 평균 #AC9887 ~ 위쪽 #B3A08F · 코워크 안 #CFC6BA 는 실제 파일보다 밝아 뜰 때 한 번 어두워졌다) — 아이보리였으면 깜빡였다 */
  --border:#DDD8D1;--hairline:rgba(28,27,25,0.14);--card-white:#FFFFFF;
  --serif:'Cormorant Garamond',Georgia,serif;
  --serif-ko:'Noto Serif KR','Nanum Myeongjo',serif;
  --sans:'Noto Sans KR',-apple-system,sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--serif-ko);font-weight:300;font-size:14px;line-height:1.85;letter-spacing:0.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}

/* [NOTE_DOT] 안내 한 줄 = 점 + 글(마이페이지 .mp-dotln 과 같은 모양 · 칠한 상자 없음) — 목록 띠 아래 · 자세히의 «함께 볼 점» · 완료 화면이 같이 쓴다 */
.dotln{position:relative;margin:10px 0 0;padding:0 0 0 13px;font-family:var(--serif-ko);font-size:13px;line-height:1.65;color:var(--sub);text-align:left;word-break:keep-all}
.dotln::before{content:'';position:absolute;left:0;top:.66em;width:5px;height:5px;border-radius:999px;background:var(--gold-deep)}

/* 드레스 칸 — 사진 3:4 · 이름 · 한 줄. 사진이 비면 그 라인의 그림이 사진 자리에 선다(이름은 아래 한 번만) */
.dr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px;margin:18px 0 0}
.dr-cell{position:relative;min-width:0}
.dr-pv{position:relative;display:block;width:100%;aspect-ratio:3/4;margin:0;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--photo-bg,#B19E8C);cursor:pointer;-webkit-tap-highlight-color:transparent}
.dr-pv picture,.dr-pv picture img{display:block;width:100%;height:100%}
.dr-pv picture img{object-fit:cover}
.dr-ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.dr-ph img{display:block;width:100%;height:100%;object-fit:contain}
.dr-pv:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.dr-cell.on .dr-pv{box-shadow:0 0 0 1px var(--gold-deep)}   /* [SEL_ONE] 테가 없는 사진 칸 — 바깥 1px 한 겹(마이페이지 스냅 칸과 같다) */
.dr-badge{position:absolute;top:8px;left:8px;padding:2px 9px;border-radius:999px;background:var(--card-white);color:var(--accent);box-shadow:inset 0 0 0 1px var(--gold-deep);font-family:var(--serif);font-size:12px;letter-spacing:0.04em;line-height:1.6;font-variant-numeric:lining-nums}   /* ★[DRESS_BADGE_NOFILL 2026-10-23 코워크 검토 1] «Nº 01» = 흰 바탕 + 먹빛 글 + 금빛 테 한 겹 — 진사 칠 알약은 [SEL_ONE] 이 걷은 모양(진사는 CTA · 점에만) */
.dr-cap{display:block;margin-top:10px}
.dr-nm{display:block;font-family:var(--serif-ko);font-size:14px;font-weight:500;color:var(--accent);line-height:1.5}
.dr-sum{display:block;font-size:13px;color:var(--light);line-height:1.6;margin-top:2px}
.dr-fit{display:block;font-family:var(--serif-ko);font-size:12px;color:var(--gold-text);line-height:1.6;margin-top:2px}   /* ★[DRESS_ONE_GRID 2026-10-23 코워크 디자인 라운드 1 · 5] 답과 맞는 칸 = 이름 아래 작은 글 «답과 맞아요»(칠 없음) */

/* 자세히 — 같은 카드 안의 한 걸음(«‹ 목록»으로 돌아간다) */
.dv{display:block}
.dv-view{position:relative;max-width:400px;margin:0 auto;width:100%}
.dv-strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;list-style:none;border-radius:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.dv-sl{position:relative;flex:0 0 100%;aspect-ratio:3/4;scroll-snap-align:start;background:var(--photo-bg,#B19E8C)}
.dv-sl picture,.dv-sl picture img{display:block;width:100%;height:100%}
.dv-sl picture img{object-fit:cover}
.dv-sl .dr-ph img{object-fit:contain}
.dv-cap{position:absolute;left:12px;bottom:12px;padding:2px 10px;border-radius:999px;background:var(--card-white);font-family:var(--serif-ko);font-size:12px;color:var(--sub);line-height:1.7}
/* ★[DRESS_DETAIL_FIT 2026-10-23 코워크 검토 2] 사진 넘김(‹ › · n / 5)은 사진 위에 — 사진 아래 한 줄(50px)을 비워 «입어 볼 드레스로 고르기»가 막대 위에 선다.
   ‹ › 는 사진 가운데 높이 양옆(첫 장 ‹ · 끝 장 › 는 숨김) · n / 5 는 오른쪽 아래(왼쪽 아래 «앞 · 뒤» 이름표와 짝).
   반투명 면은 쓰지 않는다(흰 바탕 · 옅은 테 · [GLASS_MENU_OWNER] 의 «새 반투명 면 금지» — 이름표도 같이 흰 바탕으로) */
.dv-arr{position:absolute;top:calc(50% - 13px);z-index:2;width:44px;height:44px;margin-top:-22px;display:inline-flex;align-items:center;justify-content:center;padding:0 0 2px;border:1px solid var(--border);background:var(--card-white);color:var(--sub);font-family:var(--serif);font-size:20px;line-height:1;cursor:pointer;border-radius:999px;-webkit-tap-highlight-color:transparent}
.dv-prev{left:8px}
.dv-next{right:8px}
.dv-arr[disabled]{visibility:hidden}
@media (hover:hover){.dv-arr:hover{color:var(--accent);border-color:var(--gold)}}
.dv-arr:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.dv-cnt{position:absolute;right:12px;bottom:12px;z-index:2;padding:2px 10px;border-radius:999px;background:var(--card-white);font-family:var(--sans);font-size:12px;color:var(--light);line-height:1.7;font-variant-numeric:tabular-nums lining-nums}
.dv-tx{padding-top:10px}
.dv-nm{font-family:var(--serif-ko);font-size:20px;font-weight:500;color:var(--accent);line-height:1.5}
.dv-sum{font-size:13px;color:var(--light);line-height:1.7;margin-top:2px}
/* ★[DRESS_LINE_IN_DETAIL 2026-10-23 코워크 설계 명세 2] 그 드레스 라인의 한 줄 설명(lines[].lead) · 함께 볼 점(note · 있는 라인만) — 공개 화면의 라인 안내를 여기로 옮겼다 */
.dv-lead{font-size:14px;color:var(--sub);line-height:1.85;margin-top:14px}
.dv-lead + .dotln{margin-top:6px}
.dv-mood{font-size:14px;color:var(--sub);line-height:1.85;margin-top:14px}
.dv-pair{margin-top:12px;font-size:14px;color:var(--sub);line-height:1.85}
.dv-k{display:block;font-size:13px;color:var(--gold-text);letter-spacing:0.04em;line-height:1.6}

/* ── 고르기 «드레스 미리 보기»(?pick=1) — 마이페이지 입력 화면과 같은 틀 ─────────── */
body.pick{background:var(--bg)}
.pk-wrap{padding:20px 16px 0}
.pk-card{max-width:620px;margin:0 auto;min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px);display:flex;flex-direction:column;background:var(--card-white);border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0;padding:16px 20px 0}
.pk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;min-height:44px}
.pk-head-n{font-family:var(--serif-ko);font-size:12px;color:var(--gold-deep);letter-spacing:0.08em}
/* ★[DRESS_EXIT_ASK 2026-10-23 코워크 검토 4] 위 알약 «저장 · 나가기» = 마이페이지 입력 화면의 .wiz-acts(값 그대로) — 저장(바뀐 게 있다) · 저장 중… · 저장됨 · 다시 저장 */
.wiz-acts{display:inline-flex;align-items:center;gap:6px;flex:none}
.wiz-exit{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:var(--card-white);border:1px solid var(--border);border-radius:999px;padding:0 15px;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;line-height:1;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:color .2s var(--ease),border-color .2s var(--ease),background .2s var(--ease)}
@media (hover:hover){.wiz-exit:hover{color:var(--gold-deep);border-color:var(--gold-deep)}}
.wiz-exit:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.wiz-save{min-width:70px}
.wiz-save.on{border-color:var(--gold-deep);color:var(--gold-deep);font-weight:600}
.wiz-save.bad{border-color:var(--seal);color:var(--seal);font-weight:600}
.wiz-save:disabled{color:var(--light);cursor:default}
.wiz-save:disabled:hover{color:var(--light);border-color:var(--border);background:var(--card-white)}
html.pk-alone #pkSave,html.pk-ro #pkSave{display:none}   /* ★[DRESS_SOLO_NOSAVE 2026-10-23] 단독(?pick=1)은 저장이 없다 — 머리 «저장»을 숨긴다(마이페이지 스냅 동의 전 · 읽기 전용과 같은 꼴 [SNAP_PRECONSENT_EXIT]) · 저장한 척 «저장됨»이 머리 아래 «이 화면에서 고른 것은 저장되지 않아요»와 어긋났다.
   ★[DRESS_SEE_CLOSED 2026-10-23 코워크 디자인 라운드 1 · 1] 바꾸기 마감 뒤 카드 사진을 눌러 들어오면 보기만(pk-ro) — 고를 수 없으니 «저장»도 없다 */
/* ★[DRESS_POPUP 2026-10-24] 마이페이지 팝업 창 안(&pop=1) — 바깥 테 · 둥근 모서리 · 그림자는 부모 창(.dr-pop-card) · 머리는 창 위에 붙어 있다(창 안에서만 스크롤) */
html.pk-pop body.pick{background:var(--card-white)}
html.pk-pop .pk-wrap{padding:0}
html.pk-pop .pk-card{max-width:none;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;border:0;border-radius:0;padding:0 16px}   /* ★[POPUP_FIT_1024] 창 높이 = 내용 높이(부모가 최대치로 자른다) — 카드는 늘이지 않는다 · 넘치면 창 안 스크롤 · 머리(sticky top) · 막대(sticky bottom)는 붙는다 */
html.pk-pop #pkSave{display:none}   /* [POPUP_FIT_1024] 머리 = 제목 + ✕ · [DRESS_GUIDE_ONLY] 저장 없음(«이 한 벌로 · 이 두 벌로 …») */
html.pk-pop .pk-main .dv-view{max-width:min(360px,max(150px,calc((var(--pk-vh,100vh) - 402px) * 0.75)))}   /* 사진 크기는 창의 최대 높이로 잰다 — 창 높이(=내용)로 재면 서로 물고 늘어난다 */
html.pk-pop .pk-main.pk-fade{animation:pkFade .12s ease-out}
@keyframes pkFade{from{opacity:0}to{opacity:1}}
html.pk-pop .pk-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}   /* 여러 벌 = 2열 · 사이 12 / 16 */
html.pk-pop .pk-grid > :only-child{grid-column:1 / -1;justify-self:center;width:100%;max-width:200px}   /* 한 벌 = 가운데 · 최대 폭 200 */
html.pk-pop .wz-bar,html.pk-pop .wz-bar.pk-bar{gap:12px}   /* Nº 칸과 주 단추 사이 12 */
/* ★★[POPUP_FIXED_1024 · [POPUP_FIXED_1024] 사장님 «창이 막 움직이면 정신없으니깐 · 버튼 쪽만 고정하던가 하단 기준으로»] 창 높이는 부모가 하나로 고정 — 머리는 위 · 막대는 바닥에 붙고 가운데만 스크롤.
   물음 화면처럼 짧으면 내용은 위에서 시작하고 남는 칸은 비운다(#pkBar margin-top:auto) · 막대 높이는 모든 걸음이 같다(한 줄 61px + 상태 · 오류 줄 19px 을 늘 비워 둔다) */
html.pk-pop #pkBar{margin-top:auto}
html.pk-pop .wz-bar{display:block}
html.pk-pop .pk-barrow{display:flex;align-items:center;gap:12px;min-height:61px}
html.pk-pop .wz-bar .wz-err,html.pk-pop .wz-bar .wz-err:empty{display:block;min-height:19px;margin-top:4px;line-height:19px}
html.pk-pop .pk-head{position:sticky;top:0;z-index:6;margin:0 -16px 12px;padding:6px 8px 6px 16px;background:var(--card-white);transition:box-shadow .12s var(--ease,ease)}
html.pk-pop.pk-scrolled .pk-head{box-shadow:0 1px 0 var(--hairline)}   /* 머리 아래 선은 글이 머리 밑으로 지나갈 때만 — 띠 · 진행 표시의 윗선과 두 줄로 겹치지 않게 */
html.pk-pop .pk-head-n{font-size:13px}
@media (min-width:480px){ html.pk-pop .pk-card{padding:0 20px} html.pk-pop .pk-head{margin:0 -20px 14px;padding:6px 10px 6px 20px} }
.pk-x{width:44px;height:44px;margin:0;border:0;background:transparent;color:var(--light);font-size:17px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;border-radius:8px;-webkit-tap-highlight-color:transparent}
.pk-x:active{color:var(--accent)}
@media (hover:hover){.pk-x:hover{color:var(--accent)}}
.pk-x:focus-visible{outline:2px solid var(--gold-deep);outline-offset:-4px}
.pk-solo{margin:-4px 0 14px;font-size:12px;color:var(--light);line-height:1.7}   /* 단독(?pick=1)일 때만 — 마이페이지 겹화면에는 없다 */
.pk-main{flex:1 0 auto;padding-bottom:24px}
.pk-main:focus{outline:none}

.wz-steps{display:flex;gap:4px;list-style:none;margin:2px 0 20px;font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--light)}
.wz-steps li{flex:1 1 0;min-width:0;text-align:center;padding-top:6px;border-top:2px solid var(--border);white-space:nowrap}
.wz-steps li.on{color:var(--accent);font-weight:600;border-top-color:var(--seal)}
.wz-steps li.done{color:var(--sub);border-top-color:var(--gold-deep)}
.wz-steps li.nav{padding-top:0}
.wz-stepb{display:flex;align-items:flex-start;justify-content:center;width:100%;min-height:44px;padding:6px 0 0;border:0;background:none;font:inherit;line-height:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;-webkit-tap-highlight-color:transparent}
/* ★[WZ_STEPS_STILL 2026-10-23 코워크 검토 1] 지나온 걸음 단추(누름 칸 44px)가 줄 높이를 키워 1 → 2 걸음에서 제목이 20px 내려앉았다.
   단추 아래를 글줄 높이(윗여백 6px + 글 1줄 = 6px + 1.5em)만큼만 자리로 잡는다 — 누름 칸 44px 는 그대로 아래 여백으로 뻗는다(마이페이지 · 같은 값) */
.wz-steps li.nav .wz-stepb{margin-bottom:calc(6px + 1.5em - 44px)}
.wz-stepb:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;border-radius:4px}

/* ★[DRESS_NO_INTRO 2026-10-23 코워크 검토 4] 첫 화면(인트로)은 걷었다 — 카드가 같은 말을 이미 했다 · ★[DRESS_LIST_FIRST 명세 2] 열면 드레스 목록부터 */
.pk-acts{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin:28px auto 0;max-width:360px}

.cc-btn{display:block;width:100%;text-align:center;padding:15px 18px;border:none;border-radius:12px;font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:0.02em;line-height:1.3;background:#4E3F31;color:#fff;cursor:pointer;transition:background .3s;-webkit-tap-highlight-color:transparent}
.cc-btn:hover{background:#3A2D22}
.cc-btn:focus-visible,.cc-btn-ghost:focus-visible,.pk-txt:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.cc-btn.cc-btn-wait,.cc-btn.cc-btn-wait:hover{background:var(--bg2);color:var(--sub);box-shadow:inset 0 0 0 1px var(--border);cursor:default}   /* [CHG_SUBMIT_WAIT] «아직 못 누름» 한 모양 — 마이페이지와 같다 */
.cc-btn-ghost{display:block;width:100%;text-align:center;padding:15px 18px;border:1px solid var(--border);border-radius:12px;font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:0.02em;line-height:1.3;color:var(--sub);background:#fff;cursor:pointer;transition:all .3s;-webkit-tap-highlight-color:transparent}
.cc-btn-ghost:hover{border-color:var(--gold);color:var(--accent)}
.pk-txt{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border:0;background:none;font-family:var(--serif-ko);font-size:13px;color:var(--gold-deep);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pk-txt:hover{color:var(--accent)}

.pk-q{font-family:var(--serif-ko);font-size:18px;font-weight:500;color:var(--accent);line-height:1.55;outline:none}
.pk-qsub{font-size:13px;color:var(--light);line-height:1.7;margin-top:4px}
.pk-opts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.pk-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 16px;border:1px solid var(--border);border-radius:8px;background:#fff;font-family:var(--serif-ko);font-size:14px;font-weight:400;color:var(--sub);text-align:left;cursor:pointer;transition:border-color .2s var(--ease),background .2s var(--ease),color .2s var(--ease),transform .12s ease;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.pk-opt:hover{border-color:var(--gold)}}   /* ★[DRESS_FORM_FIX3 코워크 1024 · 2] 폰은 손가락을 뗀 뒤에도 :hover 가 남아 고르기 전부터 금빛 테로 보였다 — 마우스가 있을 때만 · 키보드 초점은 :focus-visible */
.pk-opt[aria-pressed="true"]{border-color:var(--gold-deep);background:var(--gold-bg);color:var(--text)}   /* [SEL_ONE] 카드 고름 = 짙은 금빛 테 + 옅은 금빛 바탕 */
.pk-opt:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.pk-mk{flex:0 0 auto;width:18px;height:18px;border:1px solid var(--border);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.pk-opts.multi .pk-mk{border-radius:4px}
.pk-opt[aria-pressed="true"] .pk-mk{border-color:var(--gold-deep)}
.pk-opt[aria-pressed="true"] .pk-mk::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--gold-deep)}
.pk-opts.multi .pk-opt[aria-pressed="true"] .pk-mk::after{border-radius:2px}
.pk-ofig{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:40px;margin:-6px 0}   /* [DRESS_Q_WORDS] 핏 답 왼쪽 라인 그림(답 셋 모두 그림이 있다 · [DRESS_Q_TRIM] «아직 몰라요»를 뺐다) */
.pk-ofig img{display:block;width:100%;height:100%}

/* ★[DRESS_LIST_FIRST 2026-10-23 코워크 설계 명세 2 · 3장] 목록 맨 위 한 줄 띠 — 답이 없으면 «몇 가지만 답하시면 …» + «답하기 ›» · 답했으면 고른 답 + «답 바꾸기 ›».
   칠한 상자 없이 위아래 가는 줄만([NO_SIDE_STRIPE] · 아래 «다 찼어요» 줄 .pk-full 과 같은 꼴) · 글이 길면 접히고 단추는 오른쪽 그 자리 */
.pk-band{display:flex;align-items:center;gap:8px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
.pk-band-t{flex:1 1 auto;min-width:0;font-size:13px;color:var(--sub);line-height:1.6;padding:9px 0;text-wrap:pretty}
.pk-band .pk-txt{flex:0 0 auto;gap:4px;margin-right:-12px;white-space:nowrap}
/* ★[DRESS_BAND_DOTS 2026-10-23 코워크 디자인 라운드 1 · 3] 띠 바로 아래 점 줄 둘 — 막대에서 뺀 한 줄의 자리(물음 화면에는 두지 않는다 · 시착비 금액은 상담 카드 · 시착 동의서가 맡는다) */
.pk-band-dots{margin-top:12px}
.pk-band-dots .dotln{margin-top:4px}
.pk-band-dots .dotln,.pk-dots .dotln{text-wrap:balance}   /* [DRESS_NO_DEADLINE] «시착(기본 2벌)은 …» 줄이 끝 낱말만 넘어가지 않게 */
.pk-band-dots .dotln:first-child{margin-top:0}
.pk-band-dots + .pk-near{margin-top:14px}

/* ★[DRESS_ONE_GRID 2026-10-23 코워크 디자인 라운드 1 · 4 · 5] 소제목 «드레스» · «답에 맞는 드레스 / 다른 드레스» 두 덩어리와 구분선을 걷었다 — 한 그리드에 답과 맞는 칸을 앞에(칸에 «답과 맞아요») */
.pk-near{font-size:13px;color:var(--light);line-height:1.7}
.pk-grid{margin-top:20px}
.pk-near + .pk-grid{margin-top:12px}
/* ★[DRESS_RESULT_SPLIT 2026-10-24 사장님] 결과 두 덩어리 — 소제목(작게 · 먹색 600) · «다른 드레스도 보기»(외곽 단추 · 그리드 아래 가운데) · 맨 아래 점 줄 하나 */
.pk-sub-h{margin:20px 0 0;font-family:var(--serif-ko);font-size:14px;font-weight:600;color:var(--text);letter-spacing:.01em}
.pk-sub-h:focus{outline:none}
.pk-sub-h + .pk-grid{margin-top:12px}
.pk-near{margin-top:16px}
.pk-grid + .pk-sub-h{margin-top:32px;padding-top:20px;border-top:1px solid var(--hairline)}
.pk-more{display:block;width:100%;max-width:320px;margin:28px auto 0}
.pk-end-dots{display:flex;justify-content:center;margin:28px 0 8px}
.pk-end-dots .dotln{margin:0;text-wrap:balance}
@media(min-width:560px){.pk-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pk-memo-l{display:block;font-family:var(--serif-ko);font-size:13px;color:var(--accent);line-height:1.6}
.pk-memo-l span{color:var(--light);font-size:12px}
.pk-memo{display:block;width:100%;margin-top:8px;border:1px solid var(--border);border-radius:8px;padding:12px 13px;font-family:var(--serif-ko);font-size:16px;line-height:1.6;color:var(--accent);background:#fff;resize:vertical;min-height:84px}
.pk-memo:focus{outline:none;border-color:var(--gold-deep);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.pk-memo::placeholder{font-size:14px;color:var(--label-soft);font-weight:300;opacity:1}   /* 마이페이지 입력칸 안내 글과 같다(14px · 옅은 라벨색) */
.pk-memo-c{font-family:var(--sans);font-size:11px;color:var(--light);font-variant-numeric:tabular-nums lining-nums}
/* ★[DRESS_MEMO_DONE 2026-10-23 코워크 검토 4] 남길 말은 완료 화면에.
   ★[DRESS_MEMO_ONEBTN 2026-10-23 코워크 디자인 라운드 1 · 7] 작은 «남기기» 알약을 걷었다 — 글을 쓰고 «마이페이지로 돌아가기»를 누르면 나가기 판이 한 번 더 떴다.
     글을 고치면 아래 단추가 «남기고 돌아가기»로 바뀌어 저장 + 돌아가기를 한 번에(실패하면 단추 아래 한 줄 · 화면에 남는다) */
.pk-memo-box{margin:28px auto 0;max-width:360px;text-align:left}
.pk-memo-act{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:8px}
.pk-done-err{margin:8px 0 0;font-family:var(--serif-ko);font-size:12px;line-height:1.6;color:var(--seal);text-align:center;word-break:keep-all}
.pk-done-err:empty{display:none}

.pk-back{margin:-6px 0 6px -12px}
/* ★[DRESS_NEXT_PREV 2026-10-23 코워크 디자인 라운드 2 · 4] 자세히 맨 아래 «‹ 이전 드레스 · 다음 드레스 ›» — 글 단추(사진 넘김 ‹ › 와 다른 모양) · 한쪽만 남아도 제자리 */
.pk-nb{display:flex;align-items:center;margin-top:24px;padding-top:4px;border-top:1px solid var(--hairline)}   /* 선은 본문 폭 그대로 · 글은 본문 가장자리에 맞춘다(글 단추의 안쪽 12px 만큼 당긴다) */
.pk-nb-p{margin-left:-12px}
.pk-nb-n{margin-left:auto;margin-right:-12px}
/* ★[DRESS_PRESS 2026-10-23 코워크 디자인 라운드 2 · 5] 누르는 동안 반응 — 마이페이지 공통 눌림([MPD_G8] .srv-opts · .gal-it)과 같은 값: 사진 칸 · Nº 칸은 살짝 작게 · 물음 칸은 작게 + 옅은 바탕 */
.dr-pv,.pk-slot.on{transition:transform .12s ease}
.dr-pv:active,.pk-slot.on:active{transform:scale(.98)}
.pk-opt:active{transform:scale(.98);background:var(--bg2)}
.pk-ctl{margin-top:12px}   /* [DRESS_DETAIL_FIT] 이름 · 한 줄 바로 아래(분위기 · 어울리는 소품은 그 아래) */
.pk-picked{display:flex;align-items:center;gap:8px;min-height:calc(30px + 14px * 1.3);font-family:var(--serif-ko);font-size:14px;color:var(--accent);line-height:1.6}   /* 명세 «고른 드레스예요 · 빼기» 한 줄 · ★[DRESS_BAR_FIT] 높이 = 고르기 단추(.cc-btn 위아래 15px + 14px × 1.3) — 고르기 · 빼기를 눌러도 아래 라인 설명이 움직이지 않는다(첫 화면 맞춤이 그대로 맞는다) */
.pk-picked:focus{outline:none}
.pk-picked .dr-badge{position:static}
.pk-picked .pk-txt{margin:0 -12px 0 auto}
.pk-swap-t{margin:0 0 8px;font-size:13px;color:var(--sub);line-height:1.7}   /* [DRESS_FULL_SWAP] «두 벌을 다 골랐어요.» + 외곽 단추 둘 한 줄 */
.pk-swap-t:focus{outline:none}
.pk-swap-b{display:flex;gap:8px}
.pk-swap-b .cc-btn-ghost{flex:1 1 0;min-width:0;padding-left:8px;padding-right:8px}
/* [DRESS_DETAIL_FIT] 짧은 화면에서는 사진 칸을 화면 높이에 맞춰 줄인다(3:4 그대로 · 가운데) — 자세히 첫 화면에서 고르기 단추가 막대 위에 서게.
   402px = 머리 · 목록 줄 · 이름 · 한 줄 · 단추 · 막대가 쓰는 높이(390×844 에서 사진 칸 폭 316px 에 닿는다 · 1280×900 에서 360px 에 닿는다 · 390×740 에서 338px)
   ★[DRESS_BAR_PLAIN 2026-10-23 코워크 디자인 라운드 1 · 2] 430 → 402 — 막대가 28px 낮아진 만큼 사진을 키웠다(«막대가 낮아져 사진 자리가 넓어진다»).
     단추 ~ 막대 사이는 막대를 낮추기 전과 같은 51px 안팎 · 그 사이에 걸리는 글줄은 첫 화면 맞춤([DRESS_BAR_FIT])이 몇 px 로 비킨다 */
.pk-main .dv-view{max-width:360px;max-width:min(360px,max(150px,calc((100vh - 402px) * 0.75)));max-width:min(360px,max(150px,calc((100dvh - 402px) * 0.75)))}
.pk-main .dv-tx{max-width:360px;margin:0 auto}

/* 아래 막대 [WZ_BAR] — 화면 아래에 붙는다 · 오류 한 줄은 막대 안
   ★[DRESS_BAR_PLAIN 2026-10-23 코워크 디자인 라운드 1 · 2] 바탕 = 흰 단색 + 위 1px 가는 선 — 위 15px 흐림(그라데이션)을 걷었다.
     흐림 구간에 걸린 글(자세히 «앉고 걷는 품을…» · 목록 칸 한 줄)이 반쯤 덮여 취소선처럼 보였다. 막대 위 시착비 한 줄도 막대 밖(목록 띠 아래 점 줄 [DRESS_BAND_DOTS])으로 옮겨 막대가 낮아졌다
   ★★[DRESS_BAR_STICK 2026-10-23 코워크 검토 1] 붙는 것은 #pkBar(카드의 직계)다 — 막대(.wz-bar)에 sticky 를 걸면 부모 #pkBar 의 높이가 막대와 같아
   붙을 자리가 없었다(목록 · 자세히에서 Nº 칸 · 보내기 단추 · 차감 안내 줄이 맨 끝까지 내려야 보였다). 카드 아래 여백이 0 이라 [WZ_BAR_EDGE] 보정은 없다. */
#pkBar{position:sticky;bottom:0;z-index:5}
html.pk-on{scroll-padding-bottom:150px}   /* [WZ_BAR_FOCUS] 막대가 붙으면 초점 간 칸이 막대 뒤로 숨을 수 있다 — 스크롤이 막대 높이(390 에서 137px)만큼 비켜 세운다 */
.wz-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--card-white);border-top:1px solid var(--hairline)}
.wz-bar .cc-btn{flex:1 1 0;min-width:0;width:auto}
/* ★[DRESS_SKIP_SOFT 2026-10-23 코워크 검토 1] 답이 없을 때 앞 단추 «건너뛰기»는 옅은 단추(외곽 격) — 칠한 단추는 답한 뒤 «다음»에만. 자리 · 크기는 같다 */
.wz-bar .cc-btn.pk-skip,.wz-bar .cc-btn.pk-skip:hover{background:var(--card-white);color:var(--sub);box-shadow:inset 0 0 0 1px var(--border)}
@media (hover:hover){.wz-bar .cc-btn.pk-skip:hover{color:var(--accent);box-shadow:inset 0 0 0 1px var(--gold)}}
.wz-bar .cc-btn-ghost{flex:0 0 auto;width:auto;min-width:82px;background:var(--bg2);border-color:var(--bg2);color:var(--sub)}
.pk-barrow{display:contents}
.pk-intro{margin:0 0 12px;font-family:var(--serif-ko);font-size:13px;line-height:1.5;color:var(--sub);word-break:keep-all;text-wrap:pretty}
.wz-err{flex:1 0 100%;margin:0;font-family:var(--serif-ko);font-size:12px;line-height:1.6;color:var(--seal);text-align:center;word-break:keep-all}
.wz-err:empty{display:none}
.pk-slots{display:flex;gap:8px;flex:0 0 auto}
.pk-bar .cc-btn{padding-left:12px;padding-right:12px}   /* [DRESS_PICK_TIER] 막대 단추 글이 375 · 360 에서도 한 줄 — 첫 벌을 고르는 순간 막대 높이가 바뀌지 않게(375 에서 6px 커졌다) */
.pk-slot{position:relative;display:inline-flex;align-items:center;justify-content:center;width:46px;height:61px;padding:0;border:1px dashed var(--border);border-radius:6px;background:var(--bg);font-family:var(--serif);font-size:11px;letter-spacing:0.04em;color:var(--light);overflow:hidden;-webkit-tap-highlight-color:transparent;font-variant-numeric:lining-nums}   /* [DRESS_NUM_LINING] Cormorant 기본 숫자는 «o1»처럼 내려앉는다 */
.pk-slot.on{border:0;box-shadow:0 0 0 1px var(--gold-deep);background:var(--bg2);cursor:pointer}
.pk-slot.on picture,.pk-slot.on picture img,.pk-slot.on .dr-ph,.pk-slot.on .dr-ph img{display:block;width:100%;height:100%}
.pk-slot.on picture img{object-fit:cover}
/* ★[DRESS_SLOT_SEE 2026-10-23 코워크 디자인 라운드 3 · 1] 막대 작은 사진 = 그 드레스 자세히(목록 칸 · 완료 화면 사진과 같은 «보기») — × 장식과 «누르면 빼기»는 걷었다(다시 보려고 누른 고객이 말없이 잃었다).
   빼기는 자세히의 «고른 드레스예요 · 빼기» 한 곳 · ★× 되살리기 금지 — 2026-10-23 코워크 라운드 3 지시로 삭제 */
.pk-slot:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
@media(max-width:380px){.pk-bar{gap:8px}.pk-slots{gap:6px}.pk-slot{width:44px;height:59px}}   /* [DRESS_PICK_TIER] 좁은 폰은 Nº 칸을 누르는 칸 하한(44px)까지만 줄이고 사이를 좁혀 막대 단추 글 자리를 낸다(3:4 그대로 · 360 에서 한 줄) */

.pk-done{text-align:center;padding:36px 4px 8px}
.pk-done-t{font-family:var(--serif-ko);font-size:18px;font-weight:500;color:var(--accent);line-height:1.6;outline:none;text-wrap:balance}
.pk-figs{display:flex;justify-content:center;gap:16px;margin:22px 0 0}
.pk-fig{width:140px;min-width:0}
.pk-fig .dr-pv{cursor:default}
.pk-fig .dr-nm{font-size:13px}
.pk-bring{margin:28px auto 0;max-width:360px;text-align:left;padding:16px 0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
.pk-bring-h{font-family:var(--serif-ko);font-size:13px;font-weight:500;color:var(--accent);line-height:1.6;margin-bottom:6px}
.pk-bring ul{list-style:none}

.pk-bring li::before{content:'';position:absolute;left:0;top:calc(.925em - 2.5px);width:5px;height:5px;border-radius:999px;background:var(--gold-deep)}   /* 점은 위 점 줄([NOTE_DOT])과 같은 모양 — 한 화면에 점이 두 벌이면 다른 뜻으로 읽힌다 */
.pk-dots{display:table;margin:18px auto 0;text-align:left}   /* 점 줄 둘 — 가운데에 서되 줄 머리는 왼쪽으로 맞춘다 */

/* ★★[DRESS_FORM_1024 코워크 «상담 전 둘러보기» 완성도 · 사장님 «폼 디자인도 신경 써서»] 물음 · 막대 · 결과 · 자세히 값 — 아래가 위의 옛 값을 덮는다.
   폰 = 창 폭 560 미만 · PC = 560 이상(마이페이지 PC 창 600 안). 보기 글은 폰 · PC 16(코워크 폰 15 는 글자 단계 [TYPO_SCALE7] 밖이라 16).
   확대 · 반짝임 · 고르면 저절로 넘어가기 없음 · 고르면 테 1px → 1.5px(바깥 크기는 그대로 · 안쪽 그림자 0.5px) */
.wz-steps{font-size:12px;color:var(--gold-text)}
.wz-steps li.on{color:var(--gold-text);font-weight:600}
.wz-steps li.done{color:var(--gold-text)}
.pk-intro{font-size:14px;color:var(--sub);margin-bottom:14px}
.pk-q{font-size:22px;font-weight:500;line-height:1.45;color:var(--accent)}
.pk-qsub{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.54;min-height:1.54em}   /* [DRESS_QSUB_SLOT] 세 물음 같은 칸(줄 20 · 글자를 키우면 같이 늘어난다) · 아래 8 + 보기 위 12 = 종전 20 */
.pk-qbox{display:grid}
.pk-qbox > *{grid-area:1/1}
.pk-qghost{visibility:hidden}
.pk-qsubs + .pk-opts{margin-top:12px}
.pk-qsub{margin-bottom:8px}
.pk-opts{gap:10px;margin-top:20px}
.pk-opt{min-height:52px;padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card-white);font-size:16px;line-height:1.5;color:var(--sub);transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),color .2s var(--ease)}
.pk-opt.has-fig{min-height:76px}
.pk-opt[aria-pressed="true"]{border-color:var(--gold-deep);box-shadow:inset 0 0 0 .5px var(--gold-deep);background:var(--bg);color:var(--text)}
.pk-opt:active{transform:none;background:var(--bg)}
.pk-opt:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.pk-ot{min-width:0}
.pk-ofig{width:40px;height:50px;margin:0}   /* 칸 76 = 그림 50 + 위아래 12 + 테 1 */
.pk-ofig img{object-fit:contain}

  .pk-opts.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .pk-opts.figs .pk-opt.has-fig{position:relative;flex-direction:column;justify-content:center;gap:8px;min-height:132px;padding:14px 12px;text-align:center}
  .pk-opts.figs .pk-opt.has-fig .pk-mk{position:absolute;top:12px;left:12px}
  .pk-opts.figs .pk-opt.has-fig .pk-ofig{width:48px;height:64px}
  .pk-opts.figs .pk-opt.no-fig{grid-column:1 / -1}
  .pk-opts.figs.figs3{grid-template-columns:repeat(3,minmax(0,1fr))}   /* ★[DRESS_FORM_FIX3 코워크 1024 · 1] 그림 보기 셋(길이 · 라인) = 3열 한 줄 · 물음 3 은 그림 둘 + «특별한 선호는 없어요» 가로 한 줄 그대로 */
  .pk-opts.figs.figs3 .pk-opt.has-fig{padding-left:10px;padding-right:10px}   /* 보기 셋 = 둘 + 가운데 하나(한 칸이 왼쪽에 홀로 남지 않게) */
}
/* 막대 — 폰 72 + 안전 여백 · PC 80 · 단추 높이 48 · «이전» 폰 80 · PC 100 · 진사는 주 단추(«다음 · 드레스 보기»)만 · 답 전엔 옅게 그대로 */
.wz-bar .cc-btn,.wz-bar .cc-btn-ghost{height:48px;padding-top:0;padding-bottom:0;display:flex;align-items:center;justify-content:center;border-radius:8px}
.wz-bar .cc-btn-ghost{flex:0 0 80px;min-width:80px}
.wz-bar .cc-btn:not(.cc-btn-wait),.wz-bar .cc-btn:not(.cc-btn-wait):hover{background:var(--seal);color:#fff}

html.pk-pop .pk-barrow{min-height:48px}
html.pk-pop .wz-bar .wz-err,html.pk-pop .wz-bar .wz-err:empty{display:none}
html.pk-pop .pk-card{padding:0 20px}
html.pk-pop .pk-head{margin:0 -20px 12px;padding:6px 8px 6px 20px}
@media (min-width:560px){
  .wz-bar .cc-btn-ghost{flex-basis:100px;min-width:100px}

  html.pk-pop .pk-card{padding:0 28px}
  html.pk-pop .pk-head{margin:0 -28px 14px;padding:6px 10px 6px 28px}
}
/* 결과 — «내가 고른 스타일» 판 → 한 줄 → 소제목 + 작은 줄 → 그리드 → «다른 드레스도 살펴보기» → 맨 아래 두 줄 [DRESS_RESULT_MINE] */
/* ★★[DRESS_RESULT_COMPACT] 요약 판 높이 64~72 — 윗줄(이름표 + 답 바꾸기) 17 · 아랫줄 13px 두 줄까지 · 위아래 8 */
.pk-mine{display:flex;flex-direction:column;justify-content:center;min-height:64px;padding:8px 14px;border-radius:10px;background:var(--gold-bg)}
.pk-mine-r{display:flex;align-items:center;justify-content:space-between;gap:8px;height:17px}
.pk-mine-h{font-size:12px;color:var(--gold-text);letter-spacing:0.04em;line-height:1.4}
.pk-mine .pk-txt{flex:0 0 auto;min-height:44px;margin:-14px -10px -13px 0;font-size:12px;white-space:nowrap}
.pk-mine-l{margin-top:2px;font-size:13px;color:var(--text);line-height:1.4}
.pk-mine-n{margin-top:10px;text-wrap:balance}
.pk-mine + .pk-sub-h{margin-top:18px}
/* [DRESS_TIPS_FOLD] 살펴볼 점 — 사진 · 이름 아래 한 줄 단추 · 펼치면 점 줄 */
.pk-tipbox{margin-top:16px}
.pk-tipt{margin-left:-12px}
.pk-tipb .pk-tips{margin-top:2px}
.pk-sub-s{margin-top:2px;font-size:12px;color:var(--light);line-height:1.6}
.pk-sub-s + .pk-grid{margin-top:12px}
.pk-end-dots{display:table;margin:28px auto 8px}
.pk-end-dots .dotln + .dotln{margin-top:4px}
/* 자세히 — 한 줄 소개 · 디자인 · 소재 · 분위기 · 입어 보며 확인해요 · 현장에서 함께 볼 것 · 함께 살펴볼 드레스 [DRESS_DETAIL_FIELDS] */
.dv-sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--hairline)}
.dv-sec .dv-k{font-weight:500;margin-bottom:8px}
.dv-dl{display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:4px}
.dv-dl div{display:contents}
.dv-dl dt{font-size:13px;color:var(--light);line-height:1.7}
.dv-dl dd{font-size:14px;color:var(--text);line-height:1.7}
.dv-p{font-size:14px;color:var(--sub);line-height:1.85}
.dv-ul,.dv-rel{list-style:none}
.dv-ul li{position:relative;padding-left:13px;font-size:14px;color:var(--sub);line-height:1.85}
.dv-ul li::before{content:'';position:absolute;left:0;top:calc(.925em - 2.5px);width:5px;height:5px;border-radius:999px;background:var(--gold-deep)}
.dv-relb{margin-left:-12px;font-size:14px;color:var(--accent)}
/* ★[DRESS_SAMPLE_V2 사장님 결정] «스타일 예시 이미지» — 사진 오른쪽 아래 11px · 연한 먹색 · 흰 바탕 알약(반투명 면은 쓰지 않는다 [GLASS_MENU_OWNER]) */
/* ★[DRESS_PHOTO_CLEAN 1024 코워크 GPT 2차] 사진 위는 비운다 — «앞 · 1 / 3» · «스타일 예시 이미지»는 사진 밖 아래 한 줄 12px */
.dv-meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 0;font-family:var(--serif-ko);font-size:12px;line-height:1.6;color:var(--light)}
.dv-meta .dv-cnt{position:static;padding:0;background:none;font-family:var(--serif-ko);font-size:12px;color:var(--light);font-variant-numeric:tabular-nums lining-nums}

/* ★★[DRESS_CELL_TAP] 칸 전체 = 한 단추 · 이름 아래 «자세히 보기 ›» · [DRESS_NAME_SPLIT] 보조 줄 12px */
.dr-cell{display:block;align-self:start;width:100%;margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:6px}
.dr-cell:focus-visible{outline:2px solid var(--gold-deep);outline-offset:4px}
span.dr-pv{cursor:inherit}
.dr-cell:active .dr-pv{transform:scale(.98)}
.dr-kick{display:block;font-size:12px;color:var(--light);line-height:1.5}
.dr-go{display:block;margin-top:4px;font-family:var(--serif-ko);font-size:13px;color:var(--gold-text);line-height:1.6}
@media (hover:hover){.dr-cell:hover .dr-go{color:var(--accent)}}
.dv-kick{font-size:12px;color:var(--light);line-height:1.5}
.dv-tx .dv-nm{font-size:20px;line-height:28px}
.pk-back{margin-bottom:-1px}   /* «‹ 목록» 글 아래 ~ 사진 위 12~16px(실측 14) */
@media (min-width:560px){
  html.pk-pop .pk-main .dv-view,.pk-main .dv-view{max-width:300px}   /* PC 자세히 사진 300 × 400 */
  .pk-main .dv-tx{max-width:440px}   /* 설명 본문 폭 440 */
}
/* ★[DRESS_TIPS_1024] 물음별 살펴볼 점 · 방문 전 준비 */
.pk-tips{list-style:none;margin-top:12px}
.pk-tips li{position:relative;padding-left:13px;font-size:13px;color:var(--text);line-height:1.7;word-break:keep-all}
.pk-tips li + li{margin-top:4px}
.pk-tips li::before{content:'';position:absolute;left:0;top:calc(.85em - 2.5px);width:5px;height:5px;border-radius:999px;background:var(--gold-deep)}
/* ★[DRESS_ACC_1024] 함께 보는 소품 — 다른 드레스 덩어리와 같은 윗선 · 사진 1:1(바탕 그레이지 · 받는 동안) · 폰 2열 · 560+ 3열 */
.pk-acc{margin-top:32px;padding-top:20px;border-top:1px solid var(--hairline)}
.pk-acc .pk-sub-h{margin-top:0}
.pk-accg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;margin-top:12px}
@media (min-width:560px){ .pk-accg{grid-template-columns:repeat(3,minmax(0,1fr))} }
.pk-accp{display:block;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--photo-bg,#B19E8C)}
/* ★★[DRESS_BOUQUET3_1031] 부케 칸 «3종» 알약 — 사진 안 왼쪽 위(칸 높이는 그대로) · 흰 바탕 · 반투명 면 없음([GLASS_MENU_OWNER]) */
.pk-accp{position:relative}
.pk-accb{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:999px;background:#fff;font-family:var(--serif-ko);font-size:11px;line-height:18px;color:var(--gold-text);letter-spacing:.02em}
/* [DRESS_BOUQUET3_1031] 자세히 — «3가지 부케 보기» 아래 보기 전환 셋(밑줄 글 단추 · 고른 칸처럼 칠하지 않는다 · 44px) · 지금 보는 종류는 글자로 */
.pk-bq{margin-top:20px}
.pk-bq .pk-sub-h{margin-top:0}

.pk-bqb{min-height:44px;padding:0 10px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;font-family:var(--serif-ko);font-size:14px;color:var(--sub);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pk-bqb[aria-pressed="true"]{color:var(--gold-text);border-bottom-color:var(--gold-text)}
.pk-bqb:focus-visible{outline:2px solid var(--gold-text);outline-offset:-4px}
.pk-bqn{margin-top:10px;font-size:14px;line-height:1.75;color:var(--sub);word-break:keep-all}
.pk-bqn b{display:block;font-weight:600;color:var(--text)}

.pk-bout .pk-gul{margin:8px 0 14px}
.pk-accp img{display:block;width:100%;height:100%;object-fit:cover}
.pk-accx{margin-top:8px}
.pk-accn{display:block;margin-top:2px;font-size:13px;color:var(--light);line-height:1.6;word-break:keep-all}   /* [DRESS_ACC_NOTE13] 12 → 13 */
.pk-drtop{margin:24px 0 0 -12px;font-size:14px}   /* [DRESS_ACC_TOP] 글 14 · 누르는 곳 44(.pk-txt) · 위 24 */

.pk-subrow .pk-accj{flex:0 0 auto;margin:-12px -12px -12px auto;font-size:12px;white-space:nowrap}
.pk-near + .pk-accj,.pk-accj + .pk-near{margin-top:4px}
/* ★★[DRESS_TABS_1030 사장님 «추천대로» · 코워크 · GPT 2라운드] 오른쪽 아이콘(상담 뒤)으로 연 창 = 머리 아래 두 탭 «드레스 / 소품·부케» — 물음 · 답 요약 · 순위 없음.
   탭: 높이 44 이상 · 같은 너비 · 14/22 · 고른 탭 = 금빛 글 + 2px 밑줄 · 구분선 1px · 머리와 함께 고정 · 진사 없음 */

.pk-tab:focus-visible{outline:2px solid var(--gold-text);outline-offset:-5px}   /* [DRESS_TAB_RING] 초점 테는 선택 밑줄과 따로(밑줄 위로 3px 띄운다) */

.pk-gdh{margin:6px 0 0;font-family:var(--serif-ko);font-size:14px;font-weight:600;color:var(--text);letter-spacing:.01em;line-height:1.6}

.pk-toacc{margin:24px 0 0 -12px;font-size:14px}
button.pk-acci{align-self:start;display:block;width:100%;margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:6px}
button.pk-acci:focus-visible{outline:2px solid var(--gold-deep);outline-offset:4px}

/* [DRESS_ACC_BIG] 소품 크게 보기 — 같은 창 안 본문만 바꾼다 · 사진 → 이름 → 제공 안내 · 사진 한 장(넘김 없음) */
.pk-accv .pk-accp{border-radius:6px;width:100%;max-width:420px;margin:0 auto}   /* [DRESS_ACC_FIT] 크게 보기 사진 = 최대 420 · 본문 폭 이하 · 긴 면사포 끝이 잘리지 않게 contain */
.pk-accv .pk-accp img{object-fit:contain}
html .pk-main .pk-accv .dv-view,html.pk-pop .pk-main .pk-accv .dv-view{max-width:420px}   /* [DRESS_ACC_FIT] 드레스 사진 폭(300 · 높이로 잰 값)이 아니라 소품 기준 420 · 이름 · 안내도 같은 폭(왼쪽 줄 맞춤) */
html .pk-main .pk-accv .dv-tx,html.pk-pop .pk-main .pk-accv .dv-tx{max-width:420px}
.pk-accv .dv-p{margin-top:8px}

@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} html.pk-pop .pk-main.pk-fade{animation:none} }

<body>

<div id="pickView" class="pk-wrap">
  <div class="pk-card">
    <div class="pk-head"><span class="pk-head-n">드레스 미리 보기</span><span class="wiz-acts"><button type="button" class="wiz-exit wiz-save" id="pkSave" disabled>저장</button><button type="button" class="wiz-exit" id="pkExit">나가기</button></span></div>
    <div class="pk-tabs" id="pkTabs" role="tablist" aria-label="드레스 · 소품 · 부케 보기" hidden><button type="button" role="tab" class="pk-tab" id="pkTabD" data-tab="dress" aria-controls="pkPanD" aria-selected="true">드레스</button><button type="button" role="tab" class="pk-tab" id="pkTabA" data-tab="acc" aria-controls="pkPanA" aria-selected="false" tabindex="-1">소품·부케</button></div>
    <p class="pk-solo" id="pkSolo" hidden>이 화면에서 고른 것은 저장되지 않아요</p>
    <div class="pk-main" id="pkMain" tabindex="-1"></div>
    <div id="pkBar"></div>
  </div>
</div>

<script>
/* ★★[DRESS_PAGE] 이 쪽은 GAS 를 부르지 않는다 — 고르기 화면의 저장은 마이페이지(부모 창)가 하고 결과만 돌려준다(postMessage · 같은 출처만).
   단독 ?pick=1 은 같은 화면을 띄우되 아무것도 저장하지 않는다(검토용). 줄 세우기는 DRESS_REFS.rank 한 곳([DRESS_RANK]).
   ★[DRESS_EXIT_ASK 2026-10-23 코워크 검토 4] 나가기 판단(저장하지 않은 변경)은 마이페이지 입력 화면과 같은 규칙 · 같은 판 — 판은 부모 창(mpConfirm)이 띄운다.
     이 쪽은 «바뀐 게 있나 · 저장 중 · 실패»만 알린다(momentedit:dressState) · 머리 «나가기»는 부모에게 묻는다(momentedit:dressExit).
   ★★[DRESS_LIST_FIRST 2026-10-23 코워크 설계 명세 2 · 3장] 열면 드레스 목록부터 — 물음 셋은 목록 맨 위 띠의 «답하기 ›»로 들어가 끝나면 목록(한 그리드 · 답과 맞는 칸이 앞 [DRESS_ONE_GRID])으로 돌아온다.
     진행 표시는 물음 걸음에서만(길이 · 핏 · 노출 · 소매) · 목록 · 자세히 · 완료에는 없다.
   ★[DRESS_SEE_TAP 2026-10-23 코워크 디자인 라운드 1 · 1] 마이페이지 카드의 드레스 칸을 누르면 &open=<id> — 그 드레스 «자세히»로 바로 연다(«‹ 목록»은 그대로) */
(function(){
  'use strict';
  var R = window.DRESS_REFS;
  var Q = new URLSearchParams(location.search);
  var PICK = Q.get('pick') === '1';
  var EMBED = PICK && Q.get('embed') === '1' && window.parent && window.parent !== window;
  /* ★★[DRESS_POPUP 2026-10-24 사장님 «전체화면이 아니고 팝업으로»] 마이페이지 가운데 창 안(&pop=1) — 창 테 · 둥근 모서리는 부모 창이 맡는다.
     머리 = 왼쪽 «드레스 미리 보기» · 오른쪽 «저장» + 닫기 ✕ — «나가기» 알약과 ✕ 는 같은 역할이라 ✕ 하나로([BOSS_WAY_1006] 같은 역할 같은 모양 · 마이페이지 창 닫기 [X_ONE] 와 같은 꼴) */
  var POP = EMBED && Q.get('pop') === '1';
  /* ★[DRESS_FAB_TITLE 1024 코워크 · 사장님 «대면 상담 이후 수시로»] 오른쪽 아이콘 줄(상담 뒤)로 열면 창 이름 «드레스 · 소품 · 부케» · 상담 카드 스티커(상담 전)는 «드레스 미리 보기» 그대로 */
  var AFTER = Q.get('ctx') === 'after';
  if (AFTER) { var hn = document.querySelector('.pk-head-n'); if (hn) hn.textContent = '드레스 · 소품 · 부케'; document.title = '드레스 · 소품 · 부케 · 모먼트에디트'; }
  if (POP) { window.addEventListener('scroll', function(){ document.documentElement.classList.toggle('pk-scrolled', window.pageYOffset > 2); }, { passive: true }); }
  /* ★[POPUP_FIT_1024] 창 높이 = 이 카드의 내용 높이 — 바뀔 때마다 부모에 알린다(부모가 폰 min(88dvh, 760) · 넓은 화면 min(84dvh, 720)으로 자른다 · 높이 애니메이션 없음) */
  var _popH = 0, _popT = 0;
  function popH(){ _popT = 0; var c = document.querySelector('.pk-card'); if (!c) return; var h = Math.ceil(c.getBoundingClientRect().height); if (h === _popH) return; _popH = h; try { window.parent.postMessage({ type: 'momentedit:dressHeight', h: h }, location.origin); } catch (e) {} }
  function popHSoon(){ if (!_popT) _popT = requestAnimationFrame(popH); }
  if (POP) { try { if (window.ResizeObserver) new ResizeObserver(popHSoon).observe(document.querySelector('.pk-card')); } catch (e) {} }
  if (POP) { document.documentElement.classList.add('pk-pop'); var px = document.getElementById('pkExit'); if (px) { px.className = 'pk-x'; px.textContent = '\u2715'; px.setAttribute('aria-label', '닫기'); } }
  var OPEN = String(Q.get('open') || '');   // [DRESS_SEE_TAP] 카드에서 누른 드레스(없거나 모르는 id 면 목록부터)
  var $ = function(id){ return document.getElementById(id); };
  var RM = false; try { RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  if (!R || !PICK) { return; }   // [DRESS_PUBLIC_OFF] ?pick=1 이 아니면 머리의 한 줄이 이미 마이페이지로 넘겼다

  /* 사진 한 칸 — 사진이 있으면 webp · jpg, 없거나 못 받으면 그 라인의 그림(이름은 칸 아래 한 번만) */
  function lineFig(d){ var s = R.svg(d); return '<span class="dr-ph"><img src="' + esc(s) + '" alt="" width="150" height="200" decoding="async"></span>'; }
  function photo(d, src){
    var img = src || (d && d.img ? d.img : '');
    if (!img) return lineFig(d);
    var w = '/assets/dress-refs/' + img + '.webp';   // ★[DRESS_SAMPLE_V2] 사진은 webp 하나(jpg 를 따로 두지 않는다 — 없는 jpg 를 부르지 않게)
    return '<picture><source type="image/webp" srcset="' + esc(w) + '"><img src="' + esc(w) + '" alt="" loading="lazy" decoding="async" data-dr="' + esc(d.id) + '"></picture>';   // ★[DRESS_PHOTO_CLEAN 1024 코워크 GPT 2차] 사진 위는 비운다 — 표시는 사진 밖 아래 한 줄
  }
  document.addEventListener('error', function(e){   // 사진을 못 받으면 라인 그림으로 — 깨진 그림 아이콘을 보이지 않는다
    var t = e.target; if (!t || t.tagName !== 'IMG' || !t.getAttribute('data-dr')) return;
    var d = R.dress(t.getAttribute('data-dr')), pic = t.closest('picture');
    if (d && pic && pic.parentNode) { var tmp = document.createElement('span'); tmp.innerHTML = lineFig(d); pic.parentNode.replaceChild(tmp.firstChild, pic); }
  }, true);

  function cellHTML(d){
    /* ★★[DRESS_CELL_TAP 1024 코워크 GPT 2차] 사진 · 이름 칸 전체가 한 누름 영역(그 드레스 자세히) · 이름 아래 «자세히 보기 ›»(13px · 금빛) · 진사 단추는 더하지 않는다
       [DRESS_NAME_SPLIT] «스타일 예시 0n»은 12px 보조 줄 · 제목은 그 아래 · [DRESS_GUIDE_ONLY] 칸에 Nº · 고른 표시 없음 · [DRESS_SUM_ONE] 한 줄(라인 · 길이 · 소재) */
    var np = R.nameParts(d), sum = R.sumCell(d);
    return '<button type="button" class="dr-cell" data-open="' + esc(d.id) + '" aria-label="' + esc((np.kick ? np.kick + ' ' : '') + np.title + ' 자세히 보기') + '"><span class="dr-pv">' + photo(d) + '</span>'
      + '<span class="dr-cap">' + (np.kick ? '<span class="dr-kick">' + esc(np.kick) + '</span>' : '') + '<span class="dr-nm">' + esc(np.title) + '</span>'
      + '<span class="dr-sum">' + esc(sum) + '</span><span class="dr-go" aria-hidden="true">자세히 보기 &rsaquo;</span></span></button>';
  }


  /* 자세히 — ★[DRESS_SLIDES 2026-10-23 코워크 검토 4] 넘겨 보는 사진은 사진(img)이 있는 장만(R.slides) · 한 장이면 ‹ › 와 «n / 5»를 두지 않는다.
     ★[DRESS_LINE_IN_DETAIL 2026-10-23 코워크 설계 명세 2] 그 드레스 라인의 한 줄 설명(lead) · 함께 볼 점(note · 있는 라인만) — 고르기 단추 바로 아래([DRESS_DETAIL_FIT] 단추가 막대 위에 보이게) */
  function detailHTML(d, ctl){
    var sl = R.slides(d), n = sl.length, ln = R.line(d.line), NP = R.nameParts(d);
    var li = sl.map(function(e, i){
      return '<li class="dv-sl" data-t="' + esc(e.t || '') + '"' + (n > 1 ? ' aria-label="' + esc((i + 1) + ' / ' + n + (e.t ? ' · ' + e.t : '')) + '"' : '') + '>' + photo(d, e.img) + '</li>';   // [DRESS_PHOTO_CLEAN] 사진 이름(앞 · 뒤 · 디테일)은 사진 밖 아래 한 줄로
    }).join('');
    return '<div class="dv"><div class="dv-view"><ul class="dv-strip" id="dvStrip"' + (n > 1 ? ' tabindex="0"' : '') + ' aria-label="' + esc(d.name) + ' 사진">' + li + '</ul>'
      + (n > 1 ? '<button type="button" class="dv-arr dv-prev" data-dv="-1" aria-label="앞 사진" disabled>&lsaquo;</button><button type="button" class="dv-arr dv-next" data-dv="1" aria-label="다음 사진">&rsaquo;</button>' : '')   // [DRESS_DETAIL_FIT] 넘김은 사진 위에
      + '<p class="dv-meta"><span class="dv-cnt" id="dvCnt" aria-live="polite">' + esc((sl[0].t ? sl[0].t + (n > 1 ? ' · ' : '') : '') + (n > 1 ? '1 / ' + n : '')) + '</span>' + (d.sample ? '<span class="dr-ex">스타일 예시 이미지</span>' : '') + '</p></div>'   // ★[DRESS_PHOTO_CLEAN] «앞 · 1 / 3» · «스타일 예시 이미지» = 사진 밖 아래 한 줄 12px
      + '<div class="dv-tx">' + (NP.kick ? '<p class="dv-kick">' + esc(NP.kick) + '</p>' : '') + '<h2 class="dv-nm" id="dvName" tabindex="-1">' + esc(NP.title) + '</h2>'
      + (ctl ? '<div class="pk-ctl">' + ctl + '</div>' : '')
      + detailBody(d, ln)   // ★★[DRESS_DETAIL_FIELDS 1024 코워크] 한 줄 소개 → 디자인 → 소재 · 분위기 → 입어 보며 확인해요 → 현장에서 함께 볼 것 → 함께 살펴볼 드레스(빈 칸은 줄째 없음)
      + '</div></div>';
  }
  /* ★★[DRESS_DETAIL_FIELDS 1024 코워크 «자세히 — 사장님이 채울 칸»] 비어 있으면 그 줄을 아예 그리지 않는다 · [DRESS_SUM_ONE] 이름 아래 요약 줄은 «디자인»과 같은 말이라 걷었다(한 번만) ·
     [DRESS_LINE_IN_DETAIL] 한 줄 소개가 비면 그 라인의 lead · 함께 볼 점(note)은 그 아래 */
  function detailBody(d, ln){
    var g = R.lengthOf(d.length), sl = R.SLEEVE_KO[d.sleeve] || '';
    var dzt = String(d.design || '');   // ★[DRESS_SAMPLE_V2] 디자인 한 줄이 있으면 그 글 · 없으면 칸(라인 · 허리선 · 기장 · 네크라인 · 소매)
    var dz = dzt ? [] : [['라인', ln ? ln.ko : ''], ['허리선', d.waist || ''], ['기장', g ? (g.q || g.ko) : ''], ['네크라인', d.neck || ''], ['소매', sl]].filter(function(r){ return r[1]; });
    var fm = String(d.feel || '') || [d.fabric || '', d.mood || ''].filter(Boolean).join(' · ');   // 소재 · 분위기 문장(feel)이 있으면 그 글
    var lst = function(a){ return (Array.isArray(a) ? a : []).map(function(x){ return String(x || '').trim(); }).filter(Boolean); };
    var tryOn = lst(d.tryOn), onsite = lst(d.onsite); if (!onsite.length && d.pair) onsite = String(d.pair).split(' · ').map(function(x){ return x.trim(); }).filter(Boolean);
    var rel = (Array.isArray(d.related) ? d.related : []).map(function(r){ var x = r && R.dress(r.id); return x && x.id !== d.id ? { d: x, diff: String(r.diff || '') } : null; }).filter(Boolean).slice(0, 2);
    var intro = String(d.intro || (ln && ln.lead) || '');
    var sec = function(h, body){ return '<section class="dv-sec"><h3 class="dv-k">' + h + '</h3>' + body + '</section>'; };
    var ul = function(a){ return '<ul class="dv-ul">' + a.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; };
    return (intro ? '<p class="dv-lead">' + esc(intro) + '</p>' : '')
      + (ln && ln.note ? '<p class="dotln">' + esc(ln.note) + '</p>' : '')   // 함께 볼 점(슬립 · 컬럼만 · [NOTE_DOT])
      + (dzt ? sec('디자인', '<p class="dv-p">' + esc(dzt) + '</p>') : '')
      + (dz.length ? sec('디자인', '<dl class="dv-dl">' + dz.map(function(r){ return '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl>') : '')
      + (fm ? sec('소재 · 분위기', '<p class="dv-p">' + esc(fm) + '</p>') : '')
      + (tryOn.length ? sec('입어 보며 확인해요', ul(tryOn)) : '')
      + (onsite.length ? sec('현장에서 함께 볼 것', ul(onsite)) : '')
      + (rel.length ? sec('함께 살펴볼 드레스', '<ul class="dv-rel">' + rel.map(function(r){ return '<li><button type="button" class="pk-txt dv-relb" data-nb="' + esc(r.d.id) + '">' + esc(r.d.name) + ' <span aria-hidden="true">&rsaquo;</span></button>' + (r.diff ? '<p class="dv-reld">' + esc(r.diff) + '</p>' : '') + '</li>'; }).join('') + '</ul>') : '');
  }
  function wireStrip(root){
    var st = root.querySelector('#dvStrip'); if (!st) return;
    var n = st.children.length, cnt = root.querySelector('#dvCnt'), prev = root.querySelector('[data-dv="-1"]'), next = root.querySelector('[data-dv="1"]');
    if (n < 2) return;   // [DRESS_SLIDES] 한 장 — 넘길 것이 없다
    var cur = function(){ return Math.max(0, Math.min(n - 1, Math.round(st.scrollLeft / Math.max(1, st.clientWidth)))); };
    var paint = function(){ var i = cur(), t = st.children[i] ? st.children[i].getAttribute('data-t') : ''; if (cnt) cnt.textContent = (t ? t + ' · ' : '') + (i + 1) + ' / ' + n; if (prev) prev.disabled = i <= 0; if (next) next.disabled = i >= n - 1; };   // [DRESS_PHOTO_CLEAN] «뒤 · 2 / 3»
    var go = function(dir){ var i = Math.max(0, Math.min(n - 1, cur() + dir)); st.scrollTo({ left: i * st.clientWidth, behavior: RM ? 'auto' : 'smooth' }); };
    var raf = 0; st.addEventListener('scroll', function(){ if (raf) return; raf = requestAnimationFrame(function(){ raf = 0; paint(); }); }, { passive: true });
    st.addEventListener('keydown', function(e){ if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); } else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); } });
    if (prev) prev.addEventListener('click', function(){ go(-1); });
    if (next) next.addEventListener('click', function(){ go(1); });
    paint();
  }

  /* ════════════ 고르기 «드레스 미리 보기» ════════════ */
  var STEPS = R.questions.map(function(q){ return q.step; });   // [DRESS_LIST_FIRST] 진행 표시는 물음 셋 — 목록은 걸음이 아니라 첫 화면이다 · [DRESS_Q_TRIM] 이름은 원천 한 곳(길이 · 핏 · 노출 · 소매)
  /* ★★[DRESS_Q_FIRST 2026-10-24 사장님 «드레스 질문을 먼저 의무적으로 묻고 추천하는 드레스 · 그 외 다른 드레스 보러 가기 누르면 전체»] 처음 열면 물음 1부터 —
     물음 셋을 다 답해야 결과(답에 맞는 드레스 → «다른 드레스도 보기»)로 간다. 답 없는 목록 상태는 없다(건너뛰기 · «드레스 바로 보기» · «답하기» 걷음 · 되살리지 말 것).
     답한 적이 있으면(저장본 · 이 기기에 남긴 답) 결과로 바로 연다 */
  var S = { view: 'q', q: 0, ans: { len: '', fit: '', pref: [] }, seen: [false, false, false], picks: [null, null], memo: '', cur: '', busy: false, mode: '', err: '', touched: false, wait: 0, ymd: '', listY: 0,
    tipsOpen: false, base: '[[],""]', saved: false, failed: false, ro: false, answered: false, more: false, akey: '' };
  if (OPEN && R.dress(OPEN)) { S.view = 'detail'; S.cur = OPEN; }   // [DRESS_SEE_TAP] 카드에서 누른 드레스 자세히로 바로
  /* ★★[DRESS_TABS_1030] 상담 뒤(아이콘 · ctx=after) = 처음부터 탭 화면 — 물음(q) · 결과(list)로 가는 길이 없다(늦게 온 데이터 · 뒤로가기 · Esc 포함 · 되살리지 말 것).
     S.ty = 탭마다 스크롤 자리 · 마이페이지(부모) 메모리에 남겨 같은 페이지에서 다시 열면 마지막 탭 + 그 자리(새로고침 · 다른 고객이면 드레스 탭부터 · 서버 저장 없음) */
  if (AFTER) { S.view = 'tabs'; S.tab = 'dress'; S.ty = { dress: 0, acc: 0 }; S.accCur = ''; S.cur = ''; }
  function count(){ return S.picks.filter(Boolean).length; }

        var hd = document.querySelector('.pk-head'), off = (POP && hd ? hd.getBoundingClientRect().height : 0) + 12, ty = hx.getBoundingClientRect().top + (window.pageYOffset || 0) - off, rm = false;

      if (act === 'drtop') { var dh = $('pkMain').querySelector('.pk-subrow .pk-sub-h, .pk-near'); if (!dh) return;   // ★[DRESS_ACC_TOP] 결과 소제목으로(동작 줄이기면 바로) · 초점도 그 소제목
        dh.setAttribute('tabindex', '-1'); var hd3 = document.querySelector('.pk-head'), off3 = (POP && hd3 ? hd3.getBoundingClientRect().height : 0) + 12, ty3 = dh.getBoundingClientRect().top + (window.pageYOffset || 0) - off3, rm3 = false;

        try { dh.focus({ preventScroll: true }); } catch (e) {} return; }
      if (act === 'acc') { var ah = $('pkAccH'); if (!ah) return;   // ★[DRESS_ACC_1024] «소품 · 부케 보기 ›» — 소제목이 머리 아래 보이는 자리로(동작 줄이기면 바로) · 초점도 그 소제목으로
        var hd2 = document.querySelector('.pk-head'), off2 = (POP && hd2 ? hd2.getBoundingClientRect().height : 0) + 12, ty2 = ah.getBoundingClientRect().top + (window.pageYOffset || 0) - off2, rm2 = false;
        try { rm2 = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        try { window.scrollTo({ top: Math.max(0, ty2), behavior: rm2 ? 'auto' : 'smooth' }); } catch (e) { window.scrollTo(0, Math.max(0, ty2)); }
        try { ah.focus({ preventScroll: true }); } catch (e) {} return; }
      if (act === 'guide') { S.guideOpen = !S.guideOpen; document.querySelectorAll('.pk-guidet').forEach(function(b){ b.setAttribute('aria-expanded', S.guideOpen ? 'true' : 'false'); var gb = $(b.getAttribute('aria-controls')); if (gb) gb.hidden = !S.guideOpen; }); return; }   // ★[DRESS_GUIDE_1031] 그 자리에서 펼침(다시 그리지 않는다 · 읽던 자리 그대로)

      if (act === 'list') { backToList(); return; }   // [DRESS_BACK_STEP] 목록으로 돌아가는 길 하나
      if (act === 'pick') { pick(S.cur); return; }

      if (act === 'slot') { var sid = S.picks[+t.getAttribute('data-i')]; if (!sid) return; S.touched = true; if (S.view === 'list') S.listY = window.pageYOffset || 0; go('detail', { cur: sid }); return; }   // [DRESS_SLOT_SEE] 막대 작은 사진 = 그 드레스 자세히(목록 칸과 같은 길 · 목록에서 왔으면 돌아올 자리를 적는다)
      if (sw != null) { var si = +sw; if (S.picks.indexOf(S.cur) < 0 && R.dress(S.cur)) { S.picks[si] = S.cur; S.touched = true; S.err = ''; render(false); focusCtl(); } return; }   // [DRESS_FULL_SWAP] 그 자리에 이 드레스(순서 번호 그대로)

      if (act === 'home') { if (EMBED && S.memo.trim() !== baseMemo()) save('home'); else if (EMBED) exit(); else location.href = '/mypage.html'; return; }
    });
    $('pickView').addEventListener('input', function(e){
      if (e.target && e.target.id === 'pkMemo') { S.memo = String(e.target.value || '').slice(0, 200); var c = $('pkMemoC'); if (c) c.textContent = S.memo.length + ' / 200'; syncState(); }   // syncState → paintHead 가 아래 단추 글을 바꾼다(다시 그리지 않아 쓰던 칸의 초점이 그대로)

    var tl = $('pkTabs'); if (tl) tl.addEventListener('keydown', function(e){ var k = e.key; if (k !== 'ArrowLeft' && k !== 'ArrowRight' && k !== 'Home' && k !== 'End') return; e.preventDefault(); var t = k === 'Home' ? 'dress' : k === 'End' ? 'acc' : (S.tab === 'dress' ? 'acc' : 'dress'); switchTab(t, 'tab'); });
    if (AFTER) { var mT = 0; window.addEventListener('scroll', function(){ if (S.view !== 'tabs' || mT) return; mT = setTimeout(function(){ mT = 0; memPost(); }, 250); }, { passive: true }); }   // 탭 자리를 부모 메모리에
