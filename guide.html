<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin"><!-- 개인정보: URL의 안내 토큰이 Referer로 제3자에 새지 않게 origin만 전송 -->
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FAFAF8">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>하객 안내 · Moment Edit</title>
<meta property="og:title" content="MOMENT EDIT · 하객 안내">
<meta property="og:description" content="예식 안내를 확인해 보세요.">
<!-- [GUIDE_FONT_NOBLOCK] 이 페이지는 하객이 '예식장 안에서, 남의 와이파이로' 여는 화면이다.
     폰트 CSS를 렌더 블로킹으로 두면 폰트 CDN이 느린 만큼 흰 화면이 그대로 길어진다.
     실측(폰트 CDN 3초 지연): first-contentful-paint 3056ms — 3초 동안 완전한 백지.
     게다가 body 끝의 부트 스크립트도 이 CSS 뒤에야 실행돼 GAS 요청이 3057ms에야 나갔다.
     ★즉 폰트 한 개가 데이터 요청까지 3초 밀고 있었다.
     media=print → onload로 all 전환하면 브라우저가 이 CSS를 렌더 블로킹에서 뺀다.
     그동안 한글은 시스템 서체로 먼저 읽히고 브랜드 세리프가 도착하면 바뀐다(URL에 display=swap).
     ★폰트가 아예 안 와도 페이지는 읽힌다 — 전엔 영영 백지였다.
     ★브랜드 세리프 자체는 그대로 유지한다(2026-07-20 수정 취지) · 로드 '시점'만 바꾼 것. -->
<link rel="preconnect" href="https://script.google.com"><!-- 실제 데이터가 오는 곳 — 핸드셰이크를 미리 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#FAFAF8; --accent:#3A2D22; --sub:#5A554C; --light:#75705F; --faint:#A49D8E;
  --gold:#B89A75; --gold-deep:#9A7B4F; --seal:#6B2A24; --border:#DDD8D1; --bg2:#F5F3EF; --hair:#EAE5DD;
  --serif:'Cormorant Garamond',Georgia,serif;
  --serif-ko:'Noto Serif KR','Nanum Myeongjo',serif;
  --card-white:#FFFFFF; --card-shadow:0 1px 2px rgba(28,27,25,.03),0 8px 30px rgba(28,27,25,.05);
}
*{box-sizing:border-box}
body{background:var(--bg);margin:0;padding:26px 15px 60px;font-family:var(--serif-ko);color:var(--accent);-webkit-text-size-adjust:100%;line-height:1.7}
.wrap{max-width:440px;margin:0 auto;position:relative}
.brand{text-align:center;font-family:var(--serif);font-size:12px;letter-spacing:.24em;color:var(--gold-deep);text-transform:uppercase;margin-bottom:16px}
.backbar{position:absolute;left:0;top:-4px}   /* 브랜드 줄과 같은 높이 왼쪽 — 홀로 뜬 알약이 상단 리듬을 깨던 것 통합(2026-07-18 사용자 지적) */
.backbar button{font-family:var(--serif-ko);font-size:12.5px;color:var(--faint);background:transparent;border:none;padding:6px 8px;cursor:pointer}
.backbar button:active{color:var(--gold-deep)}
.card{background:var(--card-white);border:1px solid var(--border);border-radius:10px;padding:0 18px;box-shadow:var(--card-shadow)}
.hero{text-align:center;padding:24px 0 20px;border-bottom:1px solid var(--hair)}
.hero .ek{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--gold-deep);letter-spacing:.02em}
.hero .couple{font-size:23px;font-weight:500;letter-spacing:.02em;margin:8px 0 6px}
.hero .heart{font-family:var(--serif);font-style:italic;color:var(--gold);margin:0 7px;font-weight:400}
.hero .today{display:inline-block;margin-top:10px;background:var(--gold-deep);color:#fff;font-size:12px;font-weight:600;border-radius:20px;padding:6px 14px;letter-spacing:.01em}
.hero .date{font-size:12.5px;color:var(--sub)}
.sec{padding:20px 0;border-bottom:1px solid var(--hair)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}
.sec-t{font-size:15.5px;font-weight:500;color:var(--accent)}
.sec-n{font-family:var(--serif);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}

.pick{background:var(--bg2);border:1px solid var(--gold);border-radius:9px;padding:13px 14px;margin-bottom:12px}
.pick .pl{font-family:var(--serif);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep)}
.pick .pn{font-size:15px;font-weight:500;color:var(--accent);margin-top:3px}
.pick .pm{font-size:12px;color:var(--sub);margin-top:4px}
.pick .rsv{font-size:12.5px;color:var(--gold-deep);margin-top:5px}
.pick .acts{margin-top:11px}
.pick .rsv b{color:var(--seal);font-weight:600}
.gather{font-size:12px;color:var(--sub);text-align:center;margin:-2px 0 12px}

.spot{padding:12px 0;border-top:1px solid var(--hair)}
.spot:first-child{border-top:0}
.spot .sn{font-size:14px;font-weight:500;color:var(--accent)}
.spot .sm{font-size:12px;color:var(--gold-deep);margin-top:2px}
.acts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.act{font-family:var(--serif-ko);font-size:12px;color:var(--gold-deep);background:var(--card-white);border:1px solid var(--border);border-radius:20px;padding:6px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.act svg{width:12px;height:12px;stroke:var(--gold-deep);fill:none;stroke-width:1.6}
.subh{font-size:11px;letter-spacing:.04em;color:var(--light);margin:16px 0 6px}

.find input{width:100%;border:1px solid var(--border);border-radius:8px;background:#fff;font-family:var(--serif-ko);font-size:15px;color:var(--accent);padding:12px 13px}
.find input:focus{outline:none;border-color:var(--gold-deep)}
.find-res{min-height:20px;text-align:center;font-size:13px;color:var(--gold-deep);margin-top:10px}
/* 내 자리 홀 배치 — 검색 일치 시 홀 전체 테이블 위치를 그려 현장에서 넘버·명패 없이 바로 찾아가게(2026-07-17).
   이름은 본인 것 하나만 · 나머지 자리는 익명 점(타인 명단 비노출) */
.mtb-wrap{margin:14px auto 2px;text-align:center}
.mtb-stage{font-size:9.5px;letter-spacing:.2em;color:var(--gold-deep);opacity:.75;margin-bottom:8px;border:1px dashed var(--border);border-radius:20px;padding:6px;max-width:300px;margin-left:auto;margin-right:auto}
.gr-room{display:flex;gap:2px;align-items:stretch;max-width:330px;margin:0 auto}
.gr-aisle{position:relative;width:12px;flex-shrink:0;border-radius:8px;background:linear-gradient(180deg,rgba(184,154,117,.13),rgba(184,154,117,.04));border-left:1px dashed var(--border);border-right:1px dashed var(--border)}
.gr-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;align-items:center}
.gr-tbl{position:relative;width:118px;height:118px;flex-shrink:0}
.gr-tbl::before{content:'';position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);border-radius:50%;background:#FCFBF9;border:1.5px solid var(--border)}
.gr-tbl.hit::before{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,154,117,.25)}
.gr-no{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:44px;text-align:center;font-family:var(--serif-ko);font-size:11px;font-weight:600;color:var(--accent);line-height:1.2;word-break:keep-all}
.gr-dot{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:#E9E2D5;border:1px solid var(--border)}
.gr-me{position:absolute;transform:translate(-50%,-50%);max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif-ko);font-size:10.5px;padding:3px 8px;border-radius:11px;background:#F4ECDD;border:1px solid var(--gold);color:var(--accent);font-weight:600;z-index:2}
.gr-dot.me{width:13px;height:13px;background:#F4ECDD;border-color:var(--gold);z-index:2}   /* 다중 일치 강조(이름 없음) */
.gr-nm{position:absolute;transform:translate(-50%,-50%);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif-ko);font-size:9.5px;padding:2px 6px;border-radius:9px;background:var(--card-white);border:1px solid var(--border);color:var(--sub)}   /* 전체 공개 좌석표 이름 라벨(차분한 톤) */
.mtb-cap{font-family:var(--serif-ko);font-size:11px;color:var(--light);margin-top:6px}
.find-res b{color:var(--seal);font-weight:600}
.find-res .rt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;background:var(--seal);color:#fff;font-size:12px;font-weight:500;margin-right:6px;vertical-align:middle}
.mapall{display:block;text-align:center;font-size:12px;color:var(--gold-deep);text-decoration:none;margin-top:12px}
.privacy{font-size:10.5px;color:var(--faint);text-align:center;margin-top:9px}
/* [GUEST_PHOTO_IN] 업로드 진행·결과 한 줄 — 버튼 바로 아래, 안내문과 같은 크기로 조용하게 */
/* [GUEST_PHOTO_IN] .ps-btn 은 원래 <a> 용이라 폭이 저절로 찬다 — <button> 은 안 그래서 명시한다.
   ★버튼은 부모 글꼴도 상속하지 않는다(브라우저 기본값이 이긴다) → font 도 여기서 되돌린다. */
button.ps-btn{width:100%;font:inherit;font-family:var(--serif-ko);cursor:pointer;-webkit-appearance:none;appearance:none}
.gp-stat{font-size:11.5px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.65;word-break:keep-all}
.gp-stat.gp-err{color:var(--gold-deep)}
.gp-retry{font:inherit;color:var(--gold-deep);background:none;border:0;border-bottom:1px solid currentColor;padding:0 0 1px;cursor:pointer;min-height:44px}
/* [GUIDE_DRINK] 자리 안내 바로 아래 한 줄 — 배치도보다 위에 둔다(내 자리 다음으로 궁금한 것) */
.dk-line{display:flex;align-items:center;justify-content:center;gap:7px;margin:9px 0 2px}
.dk-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dk-t{font-family:var(--serif-ko);font-size:12.5px;color:var(--sub);letter-spacing:.01em}
.dk-t b{color:var(--accent);font-weight:500}
/* [DEMO_MAP] 표본에서 지도 버튼을 죽여 두니 '여기 뭔가 비었다'로 읽혔다(2026-08-01 사용자 지시
   "지도 부분도 임시로 해놓자"). 진짜 지도를 박으면 지어낸 가게로 안내하는 셈이라,
   ★지명·도로명 없는 추상 도식으로 자리만 잡는다. 표본임을 라벨로 못 박는다. */
.dm-map{position:relative;height:132px;margin:11px 0 2px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg2);overflow:hidden}
.dm-map::before{content:'';position:absolute;inset:0;
  background:
    linear-gradient(90deg,transparent 0 46%,rgba(184,154,117,.30) 46% 47%,transparent 47%),
    linear-gradient(0deg,transparent 0 62%,rgba(184,154,117,.22) 62% 63%,transparent 63%),
    linear-gradient(0deg,transparent 0 28%,rgba(28,27,25,.06) 28% 28.6%,transparent 28.6%)}
.dm-pin{position:absolute;left:46.5%;top:62%;transform:translate(-50%,-100%);width:11px;height:11px;
  border-radius:50% 50% 50% 0;background:var(--seal);rotate:-45deg}
.dm-pin::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:4px;height:4px;border-radius:50%;background:var(--bg)}
.dm-tag{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);font-family:var(--serif);
  font-style:italic;font-size:9.5px;letter-spacing:.18em;color:var(--sub);
  background:rgba(250,250,248,.9);padding:3px 9px;border-radius:999px}
/* [GUIDE_DEMO] 표본에서는 바깥으로 나가는 링크를 죽인다 — 지어낸 가게로 지도를 띄우거나
   빈 앨범으로 내보내면 '고장난 화면'으로 읽힌다. 모양은 그대로 두되 링크가 아니게 만든다
   (a→span이라 스크린리더에도 '링크'로 들리지 않고 포커스도 잡히지 않는다). */
/* ★opacity로 흐리게 두었더니 대비가 AA 미달로 떨어졌다(axe 적발 4건).
   게다가 이 화면의 목적은 '하객이 보는 모양 그대로' 보여주는 것이라 흐리게 만들 이유도 없다.
   생김새는 원본과 똑같이 두고 '이동'만 막는다 — 연결 안 된다는 설명은 꼬리말이 한다. */
.act-off,.ps-btn-off{cursor:default}
.ps-btn-off{pointer-events:none}
.demo-foot{margin:0 -18px;padding:16px 18px 18px;border-top:1px solid var(--hair);background:var(--bg2);
  border-radius:0 0 10px 10px;text-align:center}
.demo-foot .t{font-size:11.5px;color:var(--sub);line-height:1.7}
.demo-foot .t b{color:var(--seal);font-weight:600}
/* .demo-foot .b(홈 버튼) 규칙 삭제 — 버튼 자체를 뺐다(2026-08-01). 죽은 규칙 남기지 않는다. */
/* [GUIDE_SCROLLCUE] 윈도우 실물 스크롤바 숨김(스크롤은 유지) + 인지는 하단 Scroll 큐가 담당
   (2026-08-01 사용자 지시 "스크롤바 없애고 아래 스크롤 효과가 잠깐 나오는 식으로").
   큐는 invitation-09의 gd-scroll과 같은 언어 — 페이지 끝이거나 스크롤할 게 없으면 숨는다. */
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}
.mtb-wrap{scrollbar-width:none;-ms-overflow-style:none}
.mtb-wrap::-webkit-scrollbar{width:0;height:0;display:none}
/* ★고정 큐가 본문 위에 겹쳐 글자와 뒤엉키던 것 — 옅은 알약 배경으로 층을 분리한다(2026-08-01)
   [CUE_ONE][CUE_GLIDE 2026-08-04] 청첩장 16장·갤러리와 **같은 한 벌**로 맞춘다 —
   자리(80px) · 알약(.42 + blur7) · 라벨 10.5px/.13em · 선 22px/cueDrip 2.1s ·
   0.5s 뒤 스르륵 떠오르고 2.2s 뒤 스르르 가라앉는다 · 손으로 내리면 그 즉시.
   갤러리에서 좌우로 넘기면 이 화면도 한 카드로 지나간다 — 거기서만 다르게 생기면 안 된다. */
.g-scroll{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));visibility:visible;
  transform:translateX(-50%) translateY(9px);
  display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:40;
  padding:9px 20px 11px;border-radius:999px;background:rgba(250,250,248,.42);
  box-shadow:0 1px 2px rgba(28,27,25,.045);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;transition:opacity .95s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1),visibility 0s linear 0s}
.g-scroll.in{opacity:1;transform:translateX(-50%) translateY(0)}
.g-scroll.hide{opacity:0 !important;transform:translateX(-50%) translateY(9px) !important;visibility:hidden !important;
  transition:opacity 1.15s cubic-bezier(.37,0,.63,1),transform 1.15s cubic-bezier(.37,0,.63,1),visibility 0s linear 1.15s}
.g-scroll-label{font-family:var(--serif);font-style:italic;font-size:10.5px;letter-spacing:.13em;
  padding-left:.13em;opacity:.86;line-height:1;color:var(--sub)}   /* line-height:1 — 없으면 알약이 청첩장(58px)보다 7px 두꺼워진다(실측 65px) · --gold-deep은 흰 카드 위에서 3.94:1 AA 미달(axe)이라 선만 골드로 남긴다 */
.g-scroll-chev{width:1px;height:22px;background:linear-gradient(to bottom,var(--gold-deep),transparent);
  animation:cueDrip 2.1s cubic-bezier(0.4,0,0.2,1) infinite}
@keyframes cueDrip{0%{transform:translateY(-4px);opacity:0}22%{opacity:.95}100%{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.g-scroll-chev{animation:none;opacity:.7}}
/* ★--faint(#A49D8E)로 두면 --bg2 위에서 2.4:1로 AA 미달이었다(axe 적발).
   위계는 색이 아니라 크기로 낸다 — 브랜드 규칙 그대로. */
.ps-t{font-family:var(--serif-ko);font-size:13px;color:var(--sub);text-align:center;margin-bottom:12px}
/* [PS_QUIET] 채움 골드 알약이 이 화면에서 가장 무거운 덩어리였다(2026-08-01 사용자 지시
   "진사 테두리나 색채움 없이"). 채움·진사 테두리 없이 얇은 헤어라인 + 먹색 글자로.
   존재감은 폭과 여백이 낸다 — 브랜드의 CTA_TYPE_QUIET와 같은 논리. */
.ps-btn{display:block;text-align:center;font-family:var(--serif-ko);font-size:14px;letter-spacing:.04em;
  color:var(--accent);background:transparent;border:1px solid var(--border);border-radius:4px;
  padding:15px 20px;text-decoration:none;min-height:48px;box-sizing:border-box;
  transition:border-color .3s var(--ease,ease),background .12s ease}
.ps-btn:active{background:var(--bg2);border-color:var(--faint)}
.ps-btn:active{background:var(--accent)}

/* ★라이브 섹션 복원 금지 — 2026-07-17 사용자 지시로 삭제(하객 안내=오프라인 하객용 · 라이브는 온라인 청첩장이 단일 창구) */

.foot{text-align:center;padding:20px 0 4px}
.foot .wm{font-family:var(--serif);font-size:14px;letter-spacing:.03em;color:var(--accent)}
.foot .tag{font-family:var(--serif);font-style:italic;font-size:10.5px;color:var(--faint);margin-top:5px}
/* [BUSY_ONE] 대기 표시는 사이트 한 벌 — 마이페이지·식순과 같은 '숨쉬는 점'(1.7s / 0.25→0.9).

<script>
const EXEC_URL = "https://script.google.com/macros/s/AKfycbyR3n9MrPJNQfBDPDocq4VeUd8y78TtyrMTZ3a3g_eOmYwOIc6im5yXo3z1pJv7QgSBEQ/exec";
function $(id){ return document.getElementById(id); }
// 뒤로 가기 — 청첩장 등 다른 페이지에서 넘어온 경우만 표시(QR·새 탭 직접 진입은 돌아갈 곳이 없어 숨김)
(function(){ try{
  // [GUIDE_INFRAME] 갤러리 폰 프레임 안에서는 '‹ 뒤로'를 켜지 않는다 — iframe의 history.back은
  //   프레임 밖으로 나가거나 아무 일도 안 해, 프레임 안에 낯선 문 하나가 떠 있는 꼴이 된다.
  var _inF=false; try{ _inF=(window.parent&&window.parent!==window); }catch(_){ _inF=true; }
  if(!_inF && history.length>1 && document.referrer){ $('backBar').style.display='block'; $('backBtn').addEventListener('click', function(){ history.back(); }); }
}catch(e){} })();
(function(){ // [GUIDE_SCROLLCUE] 렌더 뒤 호출된다(render 끝에서 gCue()) — 스크롤할 게 있을 때만 나타나고, 내리기 시작하면 사라진다
  var el=null;
  window.gCue=function(){
    try{
      if(el && el.parentNode) el.parentNode.removeChild(el);
      var de=document.documentElement;
      if(de.scrollHeight <= window.innerHeight + 40) return;   // 스크롤할 게 없으면 큐도 없다
      el=document.createElement('div'); el.className='g-scroll'; el.setAttribute('aria-hidden','true');
      el.innerHTML='<span class="g-scroll-label">Scroll</span><span class="g-scroll-chev"></span>';
      document.body.appendChild(el);
      /* [CUE_GLIDE] 리듬도 청첩장과 같다 — 0.5s 뒤 떠오르고, 2.2s 머물다 스스로 물러난다. */
      var _t=setTimeout(function(){ if(el) el.classList.add('in'); },500);
      var _h=setTimeout(function(){ if(el) el.classList.add('hide'); },500+2200);
      /* ★'스크롤 이벤트가 왔다'가 아니라 '실제로 내려갔다'로 판단한다 —
         렌더 직후 화면이 자리를 잡으며 scroll 이 한 번 튀면, 큐가 떠오르기도 전에 사라졌다(실측: 계속 0). */
      var off=function(){
        if ((window.scrollY||window.pageYOffset||0) < 40) return;
        clearTimeout(_t); clearTimeout(_h);
        if(el){ el.classList.add('in'); el.classList.add('hide'); }
        window.removeEventListener('scroll',off);
      };
      window.addEventListener('scroll',off,{passive:true});
    }catch(e){}
  };
})();
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function qp(n){ try{ return new URLSearchParams(location.search).get(n)||''; }catch(e){ return ''; } }
function fmtDate(ymd){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ymd||'')) return '';
  var p=ymd.split('-'), dt=new Date(+p[0],+p[1]-1,+p[2]);
  // [GUIDE_DATE_GUARD] 형식만 맞으면 통과시켜 2027-13-45가 '2027년 13월 45일 (월)'로 나왔다.

  if(dt.getFullYear()!==+p[0] || dt.getMonth()!==+p[1]-1 || dt.getDate()!==+p[2]) return '';
  var WD=['일','월','화','수','목','금','토'];
  return (+p[0])+'년 '+(+p[1])+'월 '+(+p[2])+'일 ('+WD[dt.getDay()]+')';
}

function bindGuestUpload(){
  var pick=document.getElementById('gpPick'), inp=document.getElementById('gpFile');
  if(!pick||!inp) return;
  var token=qp('g'); if(!token) return;
  var busy=false, failed=[];
  pick.addEventListener('click', function(){ if(!busy) inp.click(); });
  inp.addEventListener('change', function(){ var f=[].slice.call(inp.files||[],0,GP_ONCE); inp.value=''; if(f.length) send(f); });

  function one(file){
    return new Promise(function(res){
      if(file.size > GP_MAX_MB*1048576){ res({ok:false, big:true}); return; }
      var fr=new FileReader();
      fr.onerror=function(){ res({ok:false}); };
      fr.onload=function(){
        var d=String(fr.result||''); var i=d.indexOf(',');
        fetch(EXEC_URL,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({ action:'guestPhoto', g:token, name:file.name, mime:(file.type||'image/jpeg'), data:(i>=0?d.slice(i+1):d) }) })
          .then(function(r){ return r.json(); })
          .then(function(v){ res(v&&v.ok ? {ok:true} : {ok:false, msg:(v&&v.error)||'', stop:!!(v&&(v.expired||v.full))}); })
          .catch(function(){ res({ok:false}); });
      };
      fr.readAsDataURL(file);
    });
  }
  function send(files){
    busy=true; window.__gpBusy=true; failed=[]; var done=0, big=0, stopMsg='';   // [GP_NO_REPAINT] 올리는 동안 render 를 막는다
    pick.textContent='올리는 중이에요'; pick.classList.add('ps-btn-off');
    gpSay('0 / '+files.length+' 올리는 중이에요 · 창을 닫지 말아 주세요');
    (function next(i){
      if(i>=files.length || stopMsg){ finish(files.length, done, big, stopMsg); return; }
      one(files[i]).then(function(v){
        if(v.ok) done++; else if(v.big) big++; else { failed.push(files[i]); if(v.stop) stopMsg=v.msg||''; }
        gpSay((done)+' / '+files.length+' 올리는 중이에요 · 창을 닫지 말아 주세요');
        next(i+1);
      });
    })(0);
  }
  function finish(total, done, big, stopMsg){
    busy=false; window.__gpBusy=false; pick.classList.remove('ps-btn-off'); pick.textContent='사진 더 올리기';   // [GP_NO_REPAINT] 끝났으니 다시 그려도 된다
    if(stopMsg){ gpSay(esc(stopMsg), 'err'); return; }
    var msg=done?('<b>'+done+'장 전해졌어요</b> · 고맙습니다.'):'';
    if(big) msg+=(msg?'<br>':'')+'너무 큰 파일 '+big+'개는 빼고 보냈어요('+GP_MAX_MB+'MB까지).';
    if(failed.length){
      msg+=(msg?'<br>':'')+failed.length+'장이 전해지지 않았어요. <button type="button" class="gp-retry" id="gpRetry">다시 시도</button>';
      gpSay(msg,'err');
      var rb=document.getElementById('gpRetry');
      if(rb) rb.addEventListener('click', function(){ var again=failed.slice(); send(again); });
      return;
    }
    gpSay(msg||'보낼 사진이 없었어요.');
  }
}

function _mtPos(n,i){ var off=180/(n||1), a=(-90+off+i*(360/(n||1)))*Math.PI/180; return { x:Math.cos(a)*41, y:Math.sin(a)*41 }; }   // seat.html·좌석 편집기와 동일 반칸 회전(단상 쪽 비움)

function seatHitsHtml(v, hits){   // 서버 검색 결과 → 안내(0=못 찾음 · 1=단정+내 테이블 배치 · 2~3=후보 나열(동명이인 막다른길 방지) · 4+=성함 더 입력)

function bindSeatServer(seatToken, q){
