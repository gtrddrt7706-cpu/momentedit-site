<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin"><!-- 개인정보: URL의 좌석 토큰이 Referer로 제3자에 새지 않게 origin만 전송 -->
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FAFAF8">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>좌석 안내 · Moment Edit</title>
<meta property="og:title" content="MOMENT EDIT · 좌석 안내">
<meta property="og:description" content="예식 좌석을 확인해 보세요.">
<style>
:root{
  --bg:#FAFAF8; --accent:#3A2D22; --sub:#5A554C; --light:#75705F;
  --gold:#B89A75; --gold-deep:#9A7B4F; --seal:#6B2A24; --border:#DDD8D1; --bg2:#F5F3EF;
  --serif-ko:'Noto Serif KR','Nanum Myeongjo',serif;
  --card-white:#FFFFFF; --card-shadow:0 1px 2px rgba(28,27,25,.03),0 8px 30px rgba(28,27,25,.05);
}
*{box-sizing:border-box}
body{background:var(--bg);margin:0;padding:26px 15px 60px;font-family:var(--serif-ko);color:var(--accent);-webkit-text-size-adjust:100%}
.wrap{max-width:440px;margin:0 auto;position:relative}
.brand{text-align:center;font-size:11px;letter-spacing:.22em;color:var(--gold-deep);text-transform:uppercase;margin-bottom:18px}
.backbar{position:absolute;left:0;top:-4px}   /* guide.html과 동일 — 브랜드 줄 왼쪽 통합(두 페이지 뒤로 버튼 모양 일치 · 2026-07-18 점검) */
.backbar button{font-family:var(--serif-ko);font-size:12.5px;color:#A49D8E;background:transparent;border:none;padding:6px 8px;cursor:pointer}
.backbar button:active{color:var(--gold-deep)}
.card{background:var(--card-white);border:1px solid var(--border);border-radius:8px;padding:22px 18px 20px;box-shadow:var(--card-shadow)}
.head{text-align:center;margin-bottom:6px}
.couple{font-size:20px;font-weight:500;letter-spacing:.02em}
.heart{color:var(--gold);margin:0 8px}
.date{font-size:12.5px;color:var(--sub);margin-top:5px}
.lead{text-align:center;font-size:12.5px;line-height:1.6;color:var(--sub);margin:14px 0 4px}
.find{margin:14px 0 4px}
.find input{width:100%;border:1px solid var(--border);border-radius:8px;background:#fff;font-family:var(--serif-ko);font-size:14px;color:var(--accent);padding:11px 12px}
.find input:focus{outline:none;border-color:var(--gold-deep)}
.find-res{min-height:18px;text-align:center;font-size:12.5px;color:var(--gold-deep);margin-top:8px}
.find-res b{color:var(--seal);font-weight:600}
.stage{text-align:center;font-size:11px;letter-spacing:.1em;color:var(--light);border:1px dashed var(--border);border-radius:20px;padding:7px;margin:16px 0 6px}
.room{display:flex;gap:2px;align-items:stretch}
.aisle{position:relative;width:16px;flex-shrink:0;margin-top:22px;border-radius:9px;background:linear-gradient(180deg,rgba(184,154,117,.13),rgba(184,154,117,.04));border-left:1px dashed var(--border);border-right:1px dashed var(--border)}
.aisle span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);writing-mode:vertical-rl;font-size:8.5px;letter-spacing:.28em;color:var(--gold-deep);opacity:.65;white-space:nowrap}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;align-items:center}
.colh{font-size:10.5px;letter-spacing:.08em;color:var(--gold-deep);text-align:center;margin-bottom:-4px}
.tbl{position:relative;width:150px;height:150px;flex-shrink:0}
.tbl::before{content:'';position:absolute;left:50%;top:50%;width:66px;height:66px;transform:translate(-50%,-50%);border-radius:50%;background:#FCFBF9;border:1.5px solid var(--gold)}
.tbl-no{position:absolute;left:calc(50% - 33px);top:calc(50% - 33px);width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:9.5px;display:flex;align-items:center;justify-content:center;z-index:2}
.tbl-nm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;text-align:center;font-size:11px;font-weight:500;color:var(--accent);line-height:1.2;word-break:keep-all}
.seat{position:absolute;transform:translate(-50%,-50%);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:var(--sub);padding:3px 7px;border-radius:11px;background:#fff;border:1px solid var(--border);box-shadow:0 1px 2px rgba(28,27,25,.05)}
.seat.hit{background:#F4ECDD;border-color:var(--gold);color:var(--accent);font-weight:600;z-index:2}
.seat-dot{position:absolute;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#E9E2D5;border:1px solid var(--border)}   /* 익명 자리 점 — 검색 화면(내 자리만)에서 타인 자리 표시 */
.seat-dot.hit{width:13px;height:13px;background:#F4ECDD;border-color:var(--gold);z-index:2}   /* 다중 일치 강조(이름 없음) */
.tbl.hit::before{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,154,117,.25)}
.tbl-empty{position:absolute;left:50%;top:calc(50% + 44px);transform:translateX(-50%);font-size:10px;color:var(--light)}
.foot{text-align:center;font-size:11px;color:var(--light);margin-top:16px;line-height:1.6}
.state{text-align:center;padding:50px 20px;color:var(--sub);font-size:14px}
.state .sm{font-size:12px;color:var(--light);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="backbar" id="backBar" style="display:none"><button type="button" id="backBtn">‹ 뒤로</button></div>
  <div class="brand">Moment Edit</div>
  <div id="root"><div class="state">좌석 안내를 불러오는 중이에요…</div></div>
</div>
<script>
const EXEC_URL = "https://script.google.com/macros/s/AKfycbyR3n9MrPJNQfBDPDocq4VeUd8y78TtyrMTZ3a3g_eOmYwOIc6im5yXo3z1pJv7QgSBEQ/exec";
function $(id){ return document.getElementById(id); }
// 뒤로 가기 — 하객 안내 등 다른 페이지에서 넘어온 경우만 표시(QR·새 탭 직접 진입은 돌아갈 곳이 없어 숨김)
(function(){ try{ if(history.length>1 && document.referrer){ $('backBar').style.display='block'; $('backBtn').addEventListener('click', function(){ history.back(); }); } }catch(e){} })();
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function qp(n){ try{ return new URLSearchParams(location.search).get(n)||''; }catch(e){ return ''; } }
function fmtDate(ymd){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ymd||'')) return '';
  var p=ymd.split('-'), dt=new Date(+p[0],+p[1]-1,+p[2]); var WD=['일','월','화','수','목','금','토'];
  return (+p[0])+'년 '+(+p[1])+'월 '+(+p[2])+'일 ('+WD[dt.getDay()]+')';
}
function stateHtml(msg, sm){ return '<div class="card"><div class="state">'+esc(msg)+(sm?'<div class="sm">'+esc(sm)+'</div>':'')+'</div></div>'; }

var TABLES=[];   // 렌더된 테이블(하이라이트용)
var NUMS={};     // 배열 인덱스 → 행순서 표시 번호(지도 배지·검색 결과가 같은 번호를 쓰게)
// 편집기(mypage)·좌석표 프린트와 동일한 반 칸(180/n) 회전 — 단상 쪽은 비우고 정면에 자리. 세 화면의 자리 위치 일치
function seatPos(n,i,r){ var off=180/(n||1); var a=(-90+off+i*(360/(n||1)))*Math.PI/180; return {x:Math.cos(a)*r, y:Math.sin(a)*r}; }
function zig(row,side){ var s=(row%2===0)?1:-1; return (side==='R'?-s:s)*30; }
function render(seat){
  var couple=esc(seat.groom||'')+(seat.groom&&seat.bride?'<span class="heart">&#9825;</span>':'')+esc(seat.bride||'');
  var date=fmtDate(seat.date);
  var tables=(seat.tables||[]);
  TABLES=tables;
  // 테이블 번호 = 편집기·관리자 프린트와 동일한 '행 순서'(위→아래, 각 행 좌→우): 좌 1·3·5 / 우 2·4·6.
  //   data-g/data-tbl(자리 검색 하이라이트용 내부 키)는 배열 인덱스 유지, 화면 표시 번호만 행순서 num[i]로.
  var Ls=[], Rs=[]; tables.forEach(function(t,i){ (String(t.side||'L')==='R'?Rs:Ls).push(i); });
  var num={}, nn=1, mr=Math.max(Ls.length, Rs.length);
  for(var rr=0; rr<mr; rr++){ if(rr<Ls.length) num[Ls[rr]]=nn++; if(rr<Rs.length) num[Rs[rr]]=nn++; }
  function tblCard(t, gidx, row, no){
    // 자리 위치 = 원본 인덱스 기준(빈자리 포함 전체 n) — 부부가 편집기에서 띄워 배치한 그대로. 빈자리는 그리지 않되 위치는 보존(프린트 세팅과 동일 지오메트리)
    var all=(t.seats||[]), n=all.length, named=0, chips='';
    all.forEach(function(nm,i){ nm=String(nm||'').trim(); if(!nm) return; named++; var p=seatPos(n,i,54); chips+='<div class="seat" data-seat data-g="'+gidx+'" style="left:calc(50% + '+p.x.toFixed(1)+'px);top:calc(50% + '+p.y.toFixed(1)+'px)">'+esc(nm)+'</div>'; });
    if(!named){ chips='<div class="tbl-empty">준비 중</div>'; }
    var _custom=String(t.name||'').trim();
    var nm=(_custom && !/^테이블\s*\d+$/.test(_custom)) ? esc(_custom) : '';   // 번호중복 제거 2026-07-19: 기본명은 배지 번호로 충분 · 커스텀명만 가운데 텍스트로
    return '<div class="tbl" data-tbl="'+gidx+'" style="transform:translateX('+zig(row,String(t.side||'L'))+'px)"><span class="tbl-no">'+no+'</span>'+(nm?'<span class="tbl-nm">'+nm+'</span>':'')+chips+'</div>';
  }
  NUMS=num;   // 검색 결과(findSeat)도 지도 배지와 같은 행순서 번호를 쓰게 보관
  var L='', R='', li=0, ri=0;
  tables.forEach(function(t,i){ if(String(t.side||'L')==='R') R+=tblCard(t,i,ri++,num[i]); else L+=tblCard(t,i,li++,num[i]); });
  var room = '<div class="stage">&#9672; 단상 · 신랑 신부</div><div class="room">'
    +'<div class="col"><div class="colh">좌측</div>'+(L||'')+'</div>'
    +'<div class="aisle" aria-hidden="true"><span>버진로드</span></div>'
    +'<div class="col"><div class="colh">우측</div>'+(R||'')+'</div></div>';
  $('root').innerHTML =
    '<div class="card">'
    +'<div class="head"><div class="couple">'+couple+'</div>'+(date?'<div class="date">'+esc(date)+'</div>':'')+'</div>'
    +'<div class="lead">두 분의 결혼을 축하합니다.<br>아래에서 성함을 검색하시면 자리를 안내해 드려요.</div>'
    +'<div class="find"><input id="q" type="text" inputmode="search" autocomplete="off" placeholder="성함을 입력해 보세요"><div class="find-res" id="fr"></div></div>'
    + room
    +'<div class="foot">자리를 못 찾으셨다면 현장 안내를 참고해 주세요.</div>'
    +'</div>';
  var q=$('q'); if(q) q.addEventListener('input', function(){ findSeat(q.value); });
}
function findSeat(v){
  v=String(v||'').trim();
  var seatEls=document.querySelectorAll('[data-seat]'), tblEls=document.querySelectorAll('[data-tbl]');
  seatEls.forEach(function(el){ el.classList.remove('hit'); });
  tblEls.forEach(function(el){ el.classList.remove('hit'); });
  $('fr').innerHTML='';
  if(!v) return;
  var norm=function(s){ return String(s||'').replace(/[\s　]+/g,'').toLowerCase(); };   // 공백(전각 포함) 제거 — '김 민수' 입력·저장 어느 쪽이든 매칭
  var lc=norm(v), first=null, groups={};
  if(!lc) return;
  seatEls.forEach(function(el){
    var nm=norm(el.textContent);
    if(nm && nm.indexOf(lc)>=0){ el.classList.add('hit'); groups[+el.getAttribute('data-g')]=1; if(!first) first=el; }
  });
  var gk=Object.keys(groups);
  if(!gk.length){ $('fr').textContent='그 성함을 찾지 못했어요. 현장 안내를 참고해 주세요.'; return; }
  gk.forEach(function(g){ var tb=document.querySelector('[data-tbl="'+g+'"]'); if(tb) tb.classList.add('hit'); });   // 매칭된 테이블 모두 강조(지도로 눈으로도 확인)
  if(gk.length>1){   // 흔한 성·부분일치 → 텍스트로 한 자리만 단정하지 않음(엉뚱한 자리 방지). 지도엔 다 강조돼 있음.
    $('fr').innerHTML='<b>'+esc(v)+'</b> 님이 여러 자리에서 검색돼요 · 성함을 더 입력해 주세요.';
    if(first){ try{ first.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} }
    return;
  }
  var hitG=+gk[0];
  var t=TABLES[hitG]||{};
  var _no=NUMS[hitG]||(hitG+1);   // 지도 배지·좌석표 프린트와 동일한 행순서 번호
  var _c=String(t.name||'').trim();
  var _isCustom=(_c && !/^테이블\s*\d+$/.test(_c));   // 번호중복 제거 2026-07-19: 기본명이면 'N번 테이블'만, 커스텀명이면 이름 · N번 테이블
  $('fr').innerHTML=_isCustom ? ('<b>'+esc(_c)+'</b> 자리예요 · '+_no+'번 테이블') : ('<b>'+_no+'번 테이블</b> 자리예요');
  if(first){ try{ first.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} }
}
// '내 자리만' 모드(부부 설정 · 기본값) — 전체 배치도 대신 이름 검색 전용 화면. 명단은 기기로 받지 않고
//   서버 검색(seatView+q)으로 본인 테이블만 답한다. 이미 배포된 링크·QR도 이 화면으로 자연 전환(죽은 링크 없음).
function renderMineOnly(seat, t){
  seat=seat||{};
  var couple=esc(seat.groom||'')+(seat.groom&&seat.bride?'<span class="heart">&#9825;</span>':'')+esc(seat.bride||'');
  var date=fmtDate(seat.date);
  $('root').innerHTML =
    '<div class="card">'
    +'<div class="head"><div class="couple">'+couple+'</div>'+(date?'<div class="date">'+esc(date)+'</div>':'')+'</div>'
    +'<div class="lead">두 분의 결혼을 축하합니다.<br>성함을 검색하시면 자리를 안내해 드려요.</div>'
    +'<div class="find"><input id="q" type="text" inputmode="search" autocomplete="off" placeholder="성함을 입력해 보세요"><div class="find-res" id="fr"></div></div>'
    +'<div class="foot">연락처 없이 성함과 테이블만 안내돼요.<br>자리를 못 찾으셨다면 현장 안내를 참고해 주세요.</div>'
    +'</div>';
  // 검색·결과 규칙은 guide.html(bindSeatServer·seatHitsHtml)과 동일 — 문구·규칙 수정 시 두 파일 함께
  var q=$('q'), tm=null, seq=0, last=null;   // last={q,html} — 같은 검색 재입력 시 서버 재호출 없이 재사용
  var norm=function(s){ return String(s||'').replace(/[\s　]+/g,'').toLowerCase(); };
  function mineRoomHtml(hit){   // 홀 전체 배치(익명) — 위치는 다 보여주고 이름은 본인 것만(전체 배치도와 같은 지오메트리 · 2026-07-17)
    var room=(hit&&hit.room)||[]; if(!room.length) return '';
    var one=((hit.mi||[]).length===1);   // 일치 자리 1개일 때만 이름 칩 — 부분 일치 다수면 이름 없이 강조만(타인 자리 오표기 방지)
    function tblM(t, isHit){
      var chips='', n=(t.occ||[]).length;
      for(var i=0;i<n;i++){ var p=seatPos(n,i,54), pos='left:calc(50% + '+p.x.toFixed(1)+'px);top:calc(50% + '+p.y.toFixed(1)+'px)';
        if(isHit && (hit.mi||[]).indexOf(i)>=0){ chips+= one ? ('<div class="seat hit" style="'+pos+'">'+esc(hit.nm||'내 자리')+'</div>') : ('<div class="seat-dot hit" style="'+pos+'"></div>'); }
        else if(t.occ[i]){ chips+='<div class="seat-dot" style="'+pos+'"></div>'; }
      }
      var _lbl=String(t.label||'').trim(), _isC=(_lbl && !/^테이블\s*\d+$/.test(_lbl));   // 번호중복 제거 2026-07-19: 기본명은 배지 번호로 충분
      return '<div class="tbl'+(isHit?' hit':'')+'"><span class="tbl-no">'+t.no+'</span>'+(_isC?'<span class="tbl-nm">'+esc(_lbl)+'</span>':'')+chips+'</div>';
    }
    var L='', R='', li=0, ri=0;   // 지그재그 — 전체 배치도(render)와 같은 홀 모양(zig 재사용)
    for(var k=0;k<room.length;k++){ var h=(k===hit.hti), t=room[k], z=zig((String(t.side||'L')==='R')?ri++:li++, String(t.side||'L'));
      var w='<div style="transform:translateX('+z+'px)">'+tblM(t,h)+'</div>';
      if(String(t.side||'L')==='R') R+=w; else L+=w;
    }
    return '<div class="stage" style="margin:16px 0 6px">&#9672; 단상 · 신랑 신부</div>'
      +'<div class="room"><div class="col">'+L+'</div><div class="aisle" aria-hidden="true"><span>버진로드</span></div><div class="col">'+R+'</div></div>'
      +'<div class="foot" style="margin-top:8px">'+(one?'이름이 표시된 자리가 내 자리예요 · 다른 자리 성함은 보이지 않아요':'강조된 자리 중 하나가 내 자리예요 · 성함을 전체로 입력하면 정확히 표시돼요')+'</div>';
  }
  function hitsHtml(v, hits){   // 0=못 찾음 · 1=단정+홀 배치 · 2~3=후보 나열(동명이인 막다른길 방지) · 4+=성함 더 입력
    if(!hits.length) return '그 성함을 찾지 못했어요. 현장 안내를 참고해 주세요.';
    if(hits.length===1){ var h0=hits[0], _lc=String(h0.label||'').trim(), _cc=(_lc && !/^테이블\s*\d+$/.test(_lc)); return (_cc ? ('<b>'+esc(_lc)+'</b> 자리예요 · '+h0.no+'번 테이블') : ('<b>'+h0.no+'번 테이블</b> 자리예요'))+mineRoomHtml(h0); }   // 번호중복 제거 2026-07-19
    if(hits.length<=3){ var L=[]; for(var i=0;i<hits.length;i++) L.push('<b>'+esc(hits[i].label)+'</b>'); return '<b>'+esc(v)+'</b> 님 자리는 '+L.join(' · ')+' 중 하나예요 · 같은 성함이 있어요, 현장 안내에서 확인해 주세요.'; }
    return '<b>'+esc(v)+'</b> 님이 <b>여러 자리</b>에서 검색돼요 · 성함을 전체로 입력해 주세요.';
  }
  function search(v){
    var fr=$('fr'); if(!fr) return; v=String(v||'').trim();
    if(!v){ fr.innerHTML=''; return; }
    if(norm(v).length<2){ fr.textContent='성함을 두 글자 이상 입력해 주세요.'; return; }   // 한 글자(성씨만)는 어차피 다수 매칭 — 호출 절약
    if(last && last.q===v){ fr.innerHTML=last.html; return; }
    var my=seq;
    fr.textContent='자리를 찾는 중이에요…';
    fetch(EXEC_URL,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'seatView', t:t, q:v}) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(my!==seq) return;   // 더 최신 입력이 있었음 — 늦은 응답 무시(입력 역전·지운 뒤 잔상 방지)
        if(!d || !d.ok){ fr.textContent=(d&&d.error)||'잠시 후 다시 시도해 주세요.'; return; }
        var h=hitsHtml(v, d.hits||[]); last={q:v,html:h}; fr.innerHTML=h;
      })
      .catch(function(){ var fr2=$('fr'); if(my===seq && fr2) fr2.textContent='잠시 후 다시 시도해 주세요. 네트워크 상태를 확인해 주세요.'; });
  }
  if(q) q.addEventListener('input', function(){ seq++; if(tm) clearTimeout(tm); tm=setTimeout(function(){ search(q.value); }, 450); });   // 입력 즉시 이전 응답 무효화
}
(function boot(){
  var t=qp('t');
  if(!t){ $('root').innerHTML=stateHtml('잘못된 주소예요.','청첩장에 안내된 링크로 다시 들어와 주세요.'); return; }
  fetch(EXEC_URL,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'seatView', t:t}) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.ok && d.seat){ render(d.seat); }
      else if(d && d.mineOnly){ renderMineOnly(d.seat, t); }   // 부부가 '내 자리만'으로 설정 — 검색 전용 화면
      else if(d && d.expired){ $('root').innerHTML=stateHtml('예식이 끝나 좌석 안내가 닫혔어요.','함께해 주셔서 감사합니다.'); }
      else { $('root').innerHTML=stateHtml((d&&d.error)||'좌석 안내를 찾을 수 없어요.','링크가 만료되었거나 아직 준비 중일 수 있어요.'); }
    })
    .catch(function(){ $('root').innerHTML=stateHtml('잠시 후 다시 시도해 주세요.','네트워크 상태를 확인해 주세요.'); });
})();
</script>
