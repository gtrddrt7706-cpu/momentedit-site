<!-- [SEAT_FONT_NOBLOCK] guide.html과 같은 처방(2026-07-27). 하객이 예식장 와이파이로 여는 화면이라
     폰트 CSS를 렌더 블로킹으로 두면 폰트 CDN이 느린 만큼 백지가 길어지고, body 끝의 부트 스크립트도
     그 뒤에야 실행돼 좌석 데이터 요청 자체가 밀린다.
     media=print → onload로 all 전환. 한글은 시스템 서체로 먼저 읽히고 브랜드 세리프가 오면 바뀐다.
     ★폰트가 아예 안 와도 페이지는 읽힌다. 브랜드 세리프 자체는 유지(2026-07-20 취지) · 로드 '시점'만 바꿈. -->
<link rel="preconnect" href="https://script.google.com"><!-- 좌석 데이터가 오는 곳 — 폰트만 걸려 있고 정작 여기가 빠져 있었다 -->

<style>
/* [SEL_SEAL 2026-10-03 사장님 «파란 거 말고 우리 메인 홈페이지에서 사용한 진사 색상으로»] 글을 고를 때 진사 바탕 · 메인 페이지와 같은 줄 */
::selection{background:rgba(107,42,36,0.18);color:var(--accent)}::-moz-selection{background:rgba(107,42,36,0.18);color:var(--accent)}

html{font-synthesis:weight}/* ★★[KO_NO_FAUX_ITALIC 2026-09-25 코워크 3편 ③ · 사장님 선택 «바로 세우기»] 한글 글꼴(Noto Serif·Sans KR)엔 기울임꼴이 없어 italic 이 걸린 한글을 브라우저가 억지로 비틀었다(합성 기울임). 굵기 합성만 허용하고 기울임 합성을 끈다 — 한글은 바로 서고, Cormorant 처럼 진짜 기울임꼴이 있는 영문은 그대로 기운다. 지우지 말 것 · 공통 CSS 파일이 없어 고객 화면마다 한 줄씩 있다. */

:root{
  --bg:#FAFAF8; --accent:#3A2D22; --sub:#5A554C; --light:#6E6959;
  --gold:#B89A75; --gold-deep:#9A7B4F; --seal:#6B2A24; --border:#DDD8D1; --bg2:#F5F3EF;
  --serif-ko:'Noto Serif KR','Nanum Myeongjo',serif;
  --card-white:#FFFFFF; --card-shadow:0 1px 2px rgba(28,27,25,.03),0 8px 30px rgba(28,27,25,.05);
}
*{box-sizing:border-box}
body{background:var(--bg);margin:0;padding:26px 15px 60px;font-family:var(--serif-ko);color:var(--accent);-webkit-text-size-adjust:100%}
.wrap{max-width:440px;margin:0 auto;position:relative}
.brand{text-align:center;font-size:11px;letter-spacing:.22em;color:var(--gold-deep);text-transform:uppercase;margin-bottom:18px}
.backbar{position:absolute;left:0;top:-4px}   /* guide.html과 동일 — 브랜드 줄 왼쪽 통합(두 페이지 뒤로 버튼 모양 일치 · 2026-07-18 점검) */
.backbar button{font-family:var(--serif-ko);font-size:12.5px;color:#A49D8E;background:transparent;border:none;padding:6px 8px;cursor:pointer}
.backbar button:active{color:var(--gold-deep)}
.card{background:var(--card-white);border:1px solid var(--border);border-radius:8px;padding:22px 18px 20px;box-shadow:var(--card-shadow)}
.head{text-align:center;margin-bottom:6px}
.couple{font-size:20px;font-weight:500;letter-spacing:.02em}
.heart{color:var(--gold);margin:0 8px}
.date{font-size:12.5px;color:var(--sub);margin-top:5px}
.lead{text-align:center;font-size:12.5px;line-height:1.6;color:var(--sub);margin:14px 0 4px}
.find{margin:14px 0 4px}
.find input{width:100%;border:1px solid var(--border);border-radius:8px;background:#fff;font-family:var(--serif-ko);font-size:14px;color:var(--accent);padding:11px 12px}
.find input:focus{outline:none;border-color:var(--gold-deep)}
.find-res{min-height:18px;text-align:center;font-size:12.5px;color:var(--gold-deep);margin-top:8px}
.find-res b{color:var(--seal);font-weight:600}
.stage{text-align:center;font-size:11px;letter-spacing:.1em;color:var(--light);border:1px dashed var(--border);border-radius:20px;padding:7px;margin:16px 0 6px}
.room{display:flex;gap:2px;align-items:stretch}
.aisle{position:relative;width:16px;flex-shrink:0;margin-top:22px;border-radius:9px;background:linear-gradient(180deg,rgba(184,154,117,.13),rgba(184,154,117,.04));border-left:1px dashed var(--border);border-right:1px dashed var(--border)}
.aisle span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);writing-mode:vertical-rl;font-size:8.5px;letter-spacing:.28em;color:var(--gold-deep);opacity:.65;white-space:nowrap}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;align-items:center}
.colh{font-size:10.5px;letter-spacing:.08em;color:var(--gold-deep);text-align:center;margin-bottom:-4px}
.tbl{position:relative;width:150px;height:150px;flex-shrink:0}
.tbl::before{content:'';position:absolute;left:50%;top:50%;width:66px;height:66px;transform:translate(-50%,-50%);border-radius:50%;background:#FCFBF9;border:1.5px solid var(--gold)}
.tbl-no{position:absolute;left:calc(50% - 33px);top:calc(50% - 33px);width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:9.5px;display:flex;align-items:center;justify-content:center;z-index:2}
.seat{position:absolute;transform:translate(-50%,-50%);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:var(--sub);padding:3px 7px;border-radius:11px;background:#fff;border:1px solid var(--border);box-shadow:0 1px 2px rgba(28,27,25,.05)}
.seat.hit{background:#F4ECDD;border-color:var(--gold);color:var(--accent);font-weight:600;z-index:2}
.seat-dot{position:absolute;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#E9E2D5;border:1px solid var(--border)}   /* 익명 자리 점 — 검색 화면(내 자리만)에서 타인 자리 표시 */
.seat-dot.hit{width:13px;height:13px;background:#F4ECDD;border-color:var(--gold);z-index:2}   /* 다중 일치 강조(이름 없음) */
.tbl.hit::before{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,154,117,.25)}
.tbl-empty{position:absolute;left:50%;top:calc(50% + 44px);transform:translateX(-50%);font-size:10px;color:var(--light)}
.foot{text-align:center;font-size:11px;color:var(--light);margin-top:16px;line-height:1.6}
/* [BUSY_ONE] 대기 표시는 사이트 한 벌 — 마이페이지·식순과 같은 '숨쉬는 점'(1.7s / 0.25→0.9).
   이 페이지들은 글자만 있어 같은 흐름 안에서 어떤 화면엔 점이 있고 어떤 화면엔 없었다(2026-08-04 전수조사). */
.bdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--seal,#6B2A24);margin-right:8px;vertical-align:middle;animation:meBreath 1.7s ease-in-out infinite}
@keyframes meBreath{0%,100%{opacity:0.25;transform:scale(0.82)}50%{opacity:0.9;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.bdot{animation:none;opacity:.6}}  /* ★[BDOT_REDUCED 2026-09-12] 모션 최소화에서도 이 점이 계속 뛰고 있었다. 예식장 회선이 느리면 몇 초간 화면에 남는다 */
.state{text-align:center;padding:50px 20px;color:var(--sub);font-size:14px}
.state .sm{font-size:12px;color:var(--light);margin-top:8px}
/* [STATE_EXIT] 막다른 화면의 출구 — 카드 안쪽 여백(22px 18px 20px)을 가로질러 구분선을 긋는다 */
.state-x{margin:0 -18px -20px;padding:17px 18px 20px;border-top:1px solid var(--border);background:var(--bg2);border-radius:0 0 8px 8px}
/* ★★[STATE_HIER 2026-09-12] 위계가 뒤집혀 있었다 — 제목(「잘못된 주소예요」)이 14px/--sub 로 제일 옅은데
   보조 헤더(「이렇게 해 보세요」)가 13px/700/--accent 로 제일 진하고 굵었다. 안내문이 제목보다 크게 외쳤다.
   ★게다가 이 700 은 «없는 무게»다 — 이 페이지는 Noto Serif KR 300;400;500;600 만 받는다.
     브라우저가 합성 볼드로 그린다(350 유령값과 같은 계열의 사고). 있는 무게 600 으로 내린다.
   ★제목 쪽은 .state 에서 올린다 — 아래 참조. */
.state-x-h{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:6px;text-align:center}
.state-x-s{font-size:13px;color:var(--sub);line-height:1.65;word-break:keep-all;text-wrap:pretty;text-align:center;margin-bottom:13px}
.state-x-b{display:flex;align-items:center;justify-content:center;min-height:44px;padding:6px 12px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none;background:var(--gold-text);color:#fff;word-break:keep-all}
.state-x-b.sub{background:#fff;color:var(--gold-text);border:1px solid var(--border);margin-top:8px;font-weight:500}
/* ★[NO_CARET_ALL 2026-10-06 사장님 «홈페이지 전체 커서 안 생기게 해 줘»] 글 칸이 아닌 곳을 누르면 깜빡이는 커서가 생기던 것(포커스 받는 틀 · 크롬 «캐럿 브라우징» F7) ·
   페이지 전체 커서를 투명하게 · 글을 적는 칸만 되돌린다(caret-color 는 물려받는다). 글 고르기(복사)는 그대로 된다 */
html{caret-color:transparent}
html,body{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}   /* [NO_BAR_SHIFT 2026-10-06] 스크롤바 전역 숨김(브랜드 규칙) — 이 면만 빠져 있어 좌석을 펼치고 접을 때 화면이 좌우로 흔들렸다 */
input,textarea,select,[contenteditable]:not([contenteditable="false"]){caret-color:auto}
</style>
<style>
/* ════════════════════════════════════════════════════════════════
   좌석 안내 1라운드 (2026-07-27)
   guide.html 1~3라운드에서 고친 것들이 이 페이지에 그대로 남아 있었다.
   두 파일은 검색 로직·문구가 복제돼 있어(코드 주석에도 '두 파일 함께') 같은 처방을 적용한다.
   ★단, 캐시(GUIDE_CACHE)만은 가져오지 않는다 — 아래 SEAT_NOCACHE 참고.
   ════════════════════════════════════════════════════════════════ */

/* [SEAT_CONTRAST] --gold-deep(#9A7B4F)=3.82:1 · 하드코딩 #A49D8E=2.61:1이 글자에 쓰였다.
   글자엔 --gold-text(5.71:1), 선·테두리엔 --gold/--gold-deep 유지 — index·inquiry·live·guide와 같은 규칙. */
:root{ --gold-text:#7A5F37; }
.brand,
.find-res,
.colh{color:var(--gold-text)}
.backbar button{color:var(--light)}   /* 2.61 → 4.79 */
/* 이름 사이 '♡'는 두 사람을 가르는 유일한 표시다(아래 한글 줄이 따로 없다).
   guide.html .heart와 같은 판단 — 5.71:1로 올려도 이름(--accent 13.3:1)보다 한참 옅다. */
.heart{color:var(--gold-text)}

/* [SEAT_KO_TRACK] 영문 라벨용 트래킹이 한글에 걸린 곳. '버진로드'는 세로쓰기 장식이라 제외(aria-hidden). */
.stage{letter-spacing:.06em}
.colh{letter-spacing:.04em}

/* [SEAT_TAP40] '‹ 뒤로' 48×29 — 화면 맨 위 모서리라 더 누르기 어렵다.
   ★박스만 키우면 라벨이 내려가 브랜드 줄과 어긋난다 → .backbar top을 함께 올려 라벨 위치를 지킨다. */
.backbar{top:-9px}
.backbar button{min-height:40px;display:inline-flex;align-items:center;padding:0 8px}

/* [SEAT_HEADING] h1이 하나도 없어 화면낭독기에 구조가 없었다. 보이는 모습은 그대로. */
h1.couple{font-size:20px;font-weight:500;letter-spacing:.02em;margin:0;line-height:1.4}

/* [SEAT_SR] 배치도는 눈으로 보는 그림이라 낭독기엔 숫자·이름 파편으로 흘러나온다.
   ★display:none·visibility:hidden은 낭독기도 건너뛴다 — 반드시 이 클립 방식이어야 한다. */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* [SEAT_FOCUS] .find input:focus{outline:none}이 초점 링을 지우고 테두리 색만 바꾸고 있었다.
   ★:where()는 특이도 0이라 그것만으론 못 이긴다 — .find input:focus-visible 재선언이 함께 있어야 실제로 뜬다. */
:where(a,button,input,textarea,select,[tabindex]):focus-visible{outline:2px solid var(--seal);outline-offset:3px;border-radius:3px}
.find input:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* [SEAT_MAP_REFLOW] ★guide.html보다 심하다 — .tbl이 150px(guide 118px)에 지그재그도 ±30px(guide ±22px)이라
   200% 확대가 아니라 '작은 폰 320px'에서 이미 페이지가 가로로 밀리고 있었다(실측 336 > 320).
   좌석표는 2차원 배치 자체가 정보라 접을 수 없다 → 스크롤을 이 블록 안에 가둔다.
   ★★여기서 세 번 틀렸고 매번 스크린샷이 잡아냈다. 계측만 봤으면 다 통과로 넘어갔을 것이다.
   ① overflow만 걸었더니 표준 폭(414px)에서도 스크롤이 생겼다 — 전엔 지그재그로 밀린 테이블이
      카드 패딩 위로 번져 나가며 딱 들어맞고 있었기 때문이다.
   ② 패딩만큼 끌어냈더니 안쪽 패딩이 그만큼 다시 먹어 폭이 제자리였고, '장하늘' 칩이 잘렸다.
   ③ 안쪽 패딩을 빼고 카드 바깥선까지 넓혀도 여전히 잘렸다. 이유는 계산해 보니 구조적이다 —
      .col이 flex:1이라 스크롤 영역을 넓히면 열도 같이 넓어지고, 테이블이 열 중앙에서 다시
      ±30px 밀리면서 넘치는 양이 거의 그대로 따라온다. 넓혀서 해결되는 문제가 아니다.
   결론: 이 지오메트리는 폰 폭에 원래 안 들어간다. 414px에서는 카드·본문 여백 위로 번져 나가는
   지금 모습이 (잘림 없이) 성립하므로 손대지 않고, 실제로 페이지가 밀리던 좁은 폭에서만 가둔다.
   ★실측: 320px에서 페이지가 336>320으로 밀리고 있었다(guide.html은 118px 테이블이라 320px까진 버텼다).
   ★[SEAT_FIT 2026-10-09] 위 결론(«폰 폭에 원래 안 들어간다»)은 지그재그 ±30 · 반지름 54 를 고정으로 둔 판의 결론이다.
     폭에 따라 그 셋을 줄이니 들어간다(아래 SEAT_FIT) — 스크롤 가둠은 긴 이름에 대한 안전망으로만 남는다. */
@media(max-width:469px){
  .room{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
}
/* ★[SEAT_FIT 2026-10-09 고객 여정 점검 D-2] 폰 폭에서 바깥 이름표가 카드 밖으로 잘리고(390 약 22px · 360 최대 30px),
   지그재그로 통로 쪽에 붙은 표의 이름표가 «버진로드» 글자를 덮었다(1280 포함) · 3 · 4인 표 왼쪽 위 이름을 번호 배지가 덮었다.
   ★모양(행마다 같은 방향으로 엇갈림 · SEAT_ZIG)은 그대로 — 엇갈리는 폭 · 자리 원 반지름 · 이름표 크기만 폭에 맞춘다.
   ★맞춤 기준(3자 이름 이름표 · 칸 끝에서 6px 안쪽): 반 칸 폭(C/2) ≥ 엇갈림 + 반지름 + 이름표 반폭 + 6.
     칸 폭은 «카드 바깥선까지»(아래 음수 여백) — 폰(470 미만)에서 C/2 = (화면폭 − 50)/4 = 25vw − 12.5px.
   ★반지름은 6인 표의 위쪽 두 이름표가 맞닿지 않는 값에서 멈춘다(반지름 ≥ 이름표 폭 + 2) — 7명부터는 SEAT_CROWD 목록.
   ★번호 배지는 원 «위쪽 안»(12시) — 자리 배치가 단상 쪽 반 칸을 비우므로(seatPos 반 칸 회전) 어느 인원이든 이름표가 없는 자리다.
