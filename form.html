<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Moment Edit · 청첩장 정보 입력</title>
  <meta name="description" content="두 분의 청첩장은 마이페이지에서 만들어요.">
  <link rel="canonical" href="https://momentedit.kr/form">
  <!-- ★[FORM_ONE 2026-09-11 점검] 이 파일이 /form · /form/ · /form.html 을 모두 내주는 «한 장»이다.
       form/index.html 이라는 사본이 있었는데, 아무도 가리키지 않으면서 따로 늙었다 —
       og:title 이 집 관례(MOMENT EDIT · Invitation Form)에서 벗어났고, 브랜드 스크롤바 규칙이 빠졌고,
       og:image 는 한 판 뒤처져 #604 가 따라잡히느라 커밋을 한 번 썼다. 그래서 사본을 지웠다.
       ★되살리지 말 것 — 폼 문구를 고칠 일이 생기면 이 파일 하나만 고친다.
       /form/ 는 vercel.json 의 ^/form/?$ 가 여기로 보낸다(사본이 없어야 그 라우트가 산다). -->
  <!-- 카카오톡·SNS 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Moment Edit">
  <meta property="og:title" content="MOMENT EDIT · Invitation Form">
  <meta property="og:description" content="두 분의 청첩장은 마이페이지에서 만들어요.">
  <meta property="og:image" content="https://momentedit.kr/assets/og/og-espresso.png?v=5">
  <meta property="og:url" content="https://momentedit.kr/form">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex">
  <!-- ★[FORM_TO_MYPAGE 2026-09-25] 구글폼 부부폼은 은퇴했다(LETTER_MERGED) — 청첩장은 마이페이지에서 만든다.
       옛 폼은 처리기가 없어 제출해도 청첩장이 안 생기고 메일도 안 간다. 그래서 /form 은 마이페이지로 보낸다.
       ★구글폼 주소로 되돌리지 말 것. -->
  <meta http-equiv="refresh" content="0; url=/mypage.html">
  <script>location.replace("/mypage.html");</script>
  <style>
html{font-synthesis:weight}/* ★★[KO_NO_FAUX_ITALIC 2026-09-25 코워크 3편 ③ · 사장님 선택 «바로 세우기»] 한글 글꼴(Noto Serif·Sans KR)엔 기울임꼴이 없어 italic 이 걸린 한글을 브라우저가 억지로 비틀었다(합성 기울임). 굵기 합성만 허용하고 기울임 합성을 끈다 — 한글은 바로 서고, Cormorant 처럼 진짜 기울임꼴이 있는 영문은 그대로 기운다. 지우지 말 것 · 공통 CSS 파일이 없어 고객 화면마다 한 줄씩 있다. */

/* 스크롤바 전역 숨김(스크롤 기능은 유지) — 브랜드 규칙: 바는 보이지 않게 */
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0;height:0;display:none}

    html,body{margin:0;height:100%}
    /* ★★[FORM_EXIT_CONTRAST 2026-09-12] 이 화면은 «자동 이동이 실패했을 때만» 보인다.
       그런데 그 화면의 유일한 출구인 「여기를 눌러 주세요」가 --gold(#B89A75) = 크림 위 2.54:1 이었다.
       제일 필요한 순간에 제일 안 읽히는 글자였다. 글자에 쓰는 금색은 --gold-text(#7A5F37 · 5.71:1)다.
       ★본문색 #3d3d3a 도 팔레트 밖 값이라 --sub(#5A554C)로 맞췄다.
       ★폰트 링크는 «일부러» 안 넣는다 — 이 페이지는 meta refresh 로 즉시 떠나는 자리라
         웹폰트를 받으면 떠나는 것만 늦어진다. 시스템 서체로 읽히는 게 맞다. */
    body{display:flex;align-items:center;justify-content:center;background:#FAFAF8;color:#5A554C;font-family:'Noto Serif KR',serif;text-align:center;padding:24px}
    .ey{font-family:'Cormorant Garamond',serif;letter-spacing:.28em;font-size:13px;color:#7A5F37}
    .ms{font-size:15px;font-weight:300;margin:14px 0 18px}
    a{color:#7A5F37}
  </style>
</head>
<body>
  <div>
    <p class="ey">MOMENT EDIT</p>
    <p class="ms">마이페이지로 이동 중입니다…</p>
    <p style="font-size:13px;font-weight:300;">자동으로 넘어가지 않으면 <a href="/mypage.html">여기를 눌러 주세요</a>.</p>
  </div>
</body>
</html>
