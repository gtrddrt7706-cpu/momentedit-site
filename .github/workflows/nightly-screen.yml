# 야간 화면 검사 — 게이트 밖에 있던 브라우저 검사를 하루 한 번 돌린다 [NIGHTLY_SCREEN]
#
# ★왜 만들었나 (2026-08-11 · 실측이 근거다)
#   검사 파일이 51개인데 merge-guard 가 **실행**하는 것은 22개뿐이다. 나머지는 마커만 grep 하거나
#   사람이 손으로 돌려야 한다. 그 갈림이 우연이 아니다 — **브라우저가 필요한 검사가 정확히
#   게이트 밖에 있다.** 즉 눈으로 보는 것들만 자동에서 빠져 있었다.
#   실제 대가를 이미 치렀다:
#     · 우측 아이콘 레일이 FAQ 에서 사라지던 것 — 어떤 검사도 안 잡았고 사용자가 잡았다
#     · check-guest-skin 이 다른 세션에서 조용히 SKIP 되고 있었다(PW_FIND 로 고침)
#     · ritual-order-sim 등 감사 6종이 최대 9일간 죽어 있었다
#
# ★이 잡의 성격 — **막지 않고 알린다.**
#   배포를 막는 것은 merge-guard 하나로 충분하다. 브라우저 검사는 느리고 환경을 타서
#   게이트에 넣으면 잘 울고, 그러면 사람이 붉은 것을 무시하기 시작한다(이 저장소가 겪은 병).
#   그래서 여기서는 **결과만 남긴다** — 실패해도 배포는 그대로 간다.
#
# ★[CANT_LOOK] 0 통과 · 1 재서 틀림 · 2 재지 못함. 셋을 구분해서 적는다.
#   「못 잼」을 「통과」로 적지 않는 것이 이 저장소의 규칙이고, 요약에도 그대로 쓴다.
#
# 손으로 돌리기: Actions 탭 → Nightly Screen → Run workflow

name: Nightly Screen

on:
  schedule:
    - cron: '0 18 * * *'      # UTC 18:00 = 한국 03:00 (아무도 안 쓰는 시간)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 브라우저 준비
        run: npm i -g playwright@latest && npx --yes playwright install --with-deps chromium

      # ★서버는 **저장소 루트**에서 띄운다 — 다른 자리에서 띄우면 404 가 나고,
      #   그 404 를 화면 결함으로 읽는 사고를 이미 겪었다(page-probe 의 serverRooted 가 그래서 있다).
      - name: 로컬 서버
        run: |
          nohup python3 -m http.server 8895 --directory "$GITHUB_WORKSPACE" >/dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8895/assets/ritual-cue.js && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8895/assets/ritual-cue.js \
            || { echo "✗ 서버가 저장소 루트를 못 본다 — 재기 전에 멈춘다"; exit 1; }

      # ★★[FFMPEG_HERE 2026-08-16 · 코워크 실측] 이 잡에는 ffmpeg 이 없었다.
      #   그래서 build-listen-all --embed 가 rc1 로 죽고 **파일을 안 썼다**(코워크가 ffmpeg 을 지워 재현).
      #   ★그 결과 내가 붙인 artifact 단계는 «올릴 파일이 없어» 조용히 아무것도 안 남기고 있었다 —
      #     「검사가 붉어도 남긴다」고 적어 놨는데 남길 것 자체가 없었다. 내 배달 경로가 성립하지 않았다.
      #   ★같은 이유로 sentBounds(문장 구간)가 97/97 «못 정함»이었고 check-audio-sents 가 rc2 였다.
      #     둘 다 「환경이 없어서」였지 소리나 대장의 결함이 아니다.
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 화면 검사 4종
        id: run
        env:
          PW: playwright
        run: |
          summary() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          summary "## 야간 화면 검사 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          summary ""
          summary "| 검사 | 종료 코드 | 뜻 |"
          summary "|---|---|---|"
          worst=0
          # ★[EXPECTED_TWO 2026-08-11] 「늘 2 인 검사」의 2 는 요약 색을 바꾸지 않는다.
          #   왜 — check-mypage-shell 은 설계상 절대 0 을 내지 않는다(로그인 뒤가 사각지대라는
          #   사실을 매일 알리는 것이 목적). 그런데 그 2 를 worst 에 태우면 **모든 밤이 노란색**이 된다.
          #   시뮬레이션(실측): 전부 정상인 밤도 worst=2, guest-skin 이 진짜 고장난 밤도 worst=2 —
          #   요약 문구가 글자까지 같아 **구별이 불가능**하다.
          #   ★그러면 이 잡이 게이트에 안 넣은 이유(「잘 울면 사람이 무시한다」)를 스스로 저지르는 셈이다.
          #     늘 켜져 있는 신호는 신호가 아니다.
          #   → 셋째 인자 `expected` 를 주면 그 2 는 '알림'으로만 적고 worst 를 올리지 않는다.
          #     사각지대는 표에 그대로 남으므로 잊히지 않는다. 바뀌는 것은 **색뿐**이다.
          #   ★1(재서 틀림)은 expected 여도 그대로 붉다 — 못 잼과 틀림은 다른 일이다.
          # ★★[NOTE_TABLE 2026-08-11 · 코워크 적대검증] 「표에 붉게 적은 것은 요약도 붉어야 한다.」
          #   위 판이 0·1·2 만 보고 **나머지 종료 코드를 세지 않았다.** 실측한 구멍:
          #     127(파일 없음) · 124(시간초과) · 137(메모리 부족) · 139(충돌) · 빈 문자열
          #     → 표에는 ✗ 가 찍히는데 worst 는 0 · 요약은 「전부 통과」 · 알림도 초록.
          #   ★상상이 아니다. 이 잡은 chromium 을 5쪽×2폭 띄운다 — 러너 OOM(137)은 흔하다.
          #     그리고 이 저장소는 「감사 6종이 9일간 죽어 있었다」를 이미 겪었다.
          #   ★EXIT_TRAP · GUARD_FAIL_VAR 와 **같은 병**이다 — 붉게 적고 초록으로 끝내는 자리.
          #   → 0·1·2 는 규약이 정한 결론이고, 그 밖의 코드는 **검사가 제 결론에 닿지 못한 것**이다.
          #     못 잰 것(2)과 다르다. 2 는 검사가 "못 쟀다"고 말한 것이고, 이건 말하기 전에 죽은 것이다.
          #     아무도 안 보면 영영 모르므로 붉게 센다. 다만 라벨은 「죽었다」로 따로 적어
          #     사람이 '화면이 틀렸다'로 오해하지 않게 한다.
          #   ★automation/tests/nightly-note-table.sh 가 이 함수를 **yml 에서 떼어 와** 11갈림을 돌린다.
          #     베낀 사본이 아니라 진짜 이 줄들을 돌린다 — 여기를 고치면 그 검사가 따라온다.
          note() {                      # $1 이름 · $2 코드 · $3 expected(있으면 2를 늘 그런 것으로 봄)
            case "$2" in
              0) t="통과" ;;
              1) t="✗ 재서 틀림" ;;
              2) [ -n "${3:-}" ] && t="☐ 사각지대 알림 (설계상 늘 2 · 사람이 봐야 한다)" \
                                 || t="★재지 못함 (환경 · 화면 결함 아님)" ;;
              *) t="✗ 검사가 제 결론에 닿지 못했습니다 (종료 ${2:-없음} · 127 파일없음 124 시간초과 137 메모리 139 충돌)" ;;
            esac
            summary "| \`$1\` | $2 | $t |"
            # ★못 잼(2)은 틀림(1)보다 약하게 센다 — 둘을 같은 붉은색으로 만들면 구분이 사라진다.
            #   ★그러나 0·2 가 아닌 것은 전부 붉다. 세지 않는 코드를 남기면 그 자리가 조용해진다.
            case "$2" in
              0) ;;
              2) if [ -z "${3:-}" ] && [ "$worst" = "0" ]; then worst=2; fi ;;
              *) worst=1 ;;
            esac
          }
          set +e
          node scripts/audit/page-probe.mjs index.html order-preview.html console.html guide.html audio-review.html
          note "page-probe" $?
          node scripts/check-est-one.mjs;      note "check-est-one" $?
          node scripts/check-guest-skin.mjs;   note "check-guest-skin" $?
          # ★[LISTEN_EXPORT_REAL] 실청 페이지가 낸 대본을 **진짜 붙여넣기 검사에 그대로 넣는다.**
          #   「기존 파이프라인에 물린다」는 말을 매일 실행으로 다시 확인하는 자리다.
          node scripts/check-listen-export.mjs; note "check-listen-export" $?
          # [AUDIO_SENTS] 소리에 대본만큼의 문장이 실제로 있는가 — 91클립을 ffmpeg 로 재느라
          #   merge-guard 에 못 넣는다(3분+). 야간에 돌린다. 실사고: 4클립이 둘째 문장을 통째로 잃었다.
          node scripts/check-audio-sents.mjs; note "check-audio-sents" $?
          # ★[LISTEN_COVER] 2026-08-16 사용자 지시 "실청점검 확실하게 더블체크하자 —
          #   모든(기존에 있던 나레이션 전부 포함 대역 상황극까지) 알맞게 들어가있는지"
          #   왼쪽을 **대장이 아니라 엔진**에 둔다. 배역 상황극(castLive)·촬영 신호까지 훑고,
          #   엔진이 안 부르는 자리(수동 큐·폴백·폐지)는 대장↔실녹음으로 따로 맞댄다.
          node scripts/build-listen-all.mjs --out /tmp/실청_야간.html --embed >/dev/null 2>&1
          node scripts/check-listen-cover.mjs --file /tmp/실청_야간.html; note "check-listen-cover" $?
          # ★★[ASR_TRUTH] 소리를 받아 적어 대장과 맞댄다 — 글끼리 맞대는 검사가 전부 초록인데
          #   스피커에서 다른 말이 나던 자리를 잡는다. 받아쓰기 파일이 없으면 2(재지 못함)로 남는다.
          node scripts/check-audio-text.mjs; note "check-audio-text (소리 받아쓰기 대조)" $?
          # ★[MYPAGE_UNSEEN] 이 검사는 **일부러 절대 0 을 내지 않는다.** 로그인 뒤가 사각지대라는
          #   사실을 매일 다시 알리는 것이 목적이다. 2 로 나오는 것이 정상이고, 사람이 로그인해
          #   확인하기 전까지 계속 2 다. 초록으로 만들려고 이 검사를 고치지 말 것.
          node scripts/check-mypage-shell.mjs; note "check-mypage-shell (늘 2 · 사각지대 알림)" $? expected
          # ★[ORD_ASK_ONE][WAIT_PAST_PARENT] 2026-08-12 사용자 폰 스크린샷 — 알림 판이 두 개 겹쳐 떴다.
          #   판이 하나인가 · 스크롤 잠금이 풀리는가 · 부모(12초)보다 늦게 포기하는가를 매일 다시 잰다.
          node scripts/check-ord-dialog.mjs; note "check-ord-dialog (판 겹침·이른 포기)" $?
          # ★[ORD_SAVE_BTN] 2026-08-13 사용자 지시 "자동저장 말고 저장 버튼" — 자동을 걷고 손으로 바꿨다.
          #   지키는 것: 사람이 안 누르면 안 나가는가 · 안 누른 채 나가도 안 잃는가 ·
          #   저장 뒤 나가기가 또 저장 안 하는가 · 완성본을 초안으로 안 덮는가 · 실패를 말하는가.
          node scripts/check-ord-save.mjs; note "check-ord-save (사람이 누를 때만 · 그래도 안 잃음)" $?
          for p in index.html mypage.html console.html order-preview.html guide.html; do
            node scripts/check-tap-targets.mjs "$p"; note "tap-targets $p" $?
          done
          set -e
          summary ""
          case "$worst" in
            0) summary "**전부 통과.**" ;;
            2) summary "**일부를 재지 못했습니다** — 환경 문제입니다. 화면 결함이 아닙니다." ;;
            *) summary "**살펴볼 것이 있습니다.** 위 표에서 종료 코드 1 인 줄을 보세요." ;;
          esac
          echo "worst=$worst" >> "$GITHUB_OUTPUT"

      # ★[LISTEN_KEEP 2026-08-16] 만든 실청 판을 **남긴다.**
      #   전에는 /tmp 에 만들어 검사만 하고 버렸다. 그래서 사용자가 실제로 «들으려면»
      #   ffmpeg 이 있는 세션이 매번 새로 만들어 사람 손으로 넘겨야 했다 —
      #   실청은 이 상품에서 사람만 할 수 있는 마지막 검사인데, 그 판을 얻는 길이 사람 심부름이었다.
      #   ★한 파일 안에 소리가 다 들어 있어(--embed) 내려받아 열기만 하면 된다.
      #   ★검사가 붉어도 남긴다(if: always()) — 틀린 자리를 들어 보려고 받는 것이기도 하다.
      # ★★[LISTEN_HAS_SOUND 2026-08-16 · 코워크 지적] 「없으면 조용히 안 올리기」를 만들지 않는다.
      #   이 저장소가 네 번 앓은 병이 그거다(RECORDED_TRUTH · NOAUDIO_REAL · CONSOLE_TEXT · ASR_TRUTH).
      #   파일이 없거나 소리가 안 심겼으면 **붉어야 한다.** 조용히 넘어가면 사람은
      #   「오늘도 판이 나왔겠지」로 읽고, 안 나온 날을 영영 모른다.
      #   정상값은 data:audio/mpeg 283개 — 100 미만이면 속 빈 판이다.
      - name: 실청 판에 소리가 들어 있나
        if: always()
        run: |
          f=/tmp/실청_야간.html
          [ -f "$f" ] || { echo "✗ 실청 판이 아예 안 만들어졌다 — build-listen-all 이 멎었다(위 표의 종료 코드를 보라)"; exit 1; }
          n=$(grep -o 'data:audio/mpeg' "$f" | wc -l)
          echo "심긴 소리 $n개 ($(du -h "$f" | cut -f1))"
          [ "$n" -ge 100 ] || { echo "✗ 소리가 $n개뿐이다(정상 283) — 속 빈 판이라 올리지 않는다"; exit 1; }

      - name: 실청 판 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 실청_전체
          path: /tmp/실청_야간.html
          retention-days: 14
          if-no-files-found: warn

      # ★배포를 막지 않는다 — 이 잡은 알리는 자리다.
      #   실패를 사람에게 보이게만 하고, 종료는 항상 성공으로 둔다.
      #   (막는 일은 merge-guard 몫. 두 곳에서 막으면 사람이 어느 쪽을 봐야 할지 모른다.)
      - name: 결과 표시
        if: always()
        run: |
          case "${{ steps.run.outputs.worst }}" in
            0) echo "::notice title=야간 화면 검사::전부 통과" ;;
            2) echo "::warning title=야간 화면 검사::일부를 재지 못했습니다(환경 · 화면 결함 아님)" ;;
            *) echo "::warning title=야간 화면 검사::살펴볼 것이 있습니다 — Summary 표를 보세요" ;;
          esac
