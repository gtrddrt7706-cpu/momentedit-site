# GAS 자동 배포 — automation/ 이 바뀐 main 푸시에서 「Moment Edit 통합」에 반영 + 기존 배포 갱신.
#
# ★clasp push 를 쓰지 않는다 (2026-08-07 실측). 저장소와 원격의 파일명 규칙이 다르다:
#     저장소 platform/96_ai_cost.gs   ↔ 원격 96_ai_cost
#     저장소 consultation/consultation-booking.gs ↔ 원격 "Consultation booking"
#     저장소 platform/97_ai-handoff.gs ↔ 원격 97_aihandoff
#   clasp 는 상대경로를 그대로 파일명으로 쓰므로 push 시 23개 신규 생성 + 기존 23개 삭제 =
#   프로젝트 파괴. 저장소를 평면화하면 레터 프로젝트 파일과 섞인다.
#   → scripts/gas-sync.mjs 가 대응표를 명시하고 Apps Script API 로 직접 동기화한다.
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON        ← PC에서 `clasp login` 후 생긴 ~/.clasprc.json 전문
#   GAS_DEPLOYMENT_ID   ← 기존 배포 ID (없으면 스크립트가 일부러 중단 · 새 배포 방지)
# 그리고 script.google.com/home/usersettings 에서 Apps Script API '사용' ON.

name: GAS Deploy

on:
  push:
    branches: [main]
    paths:
      - 'automation/platform/**'
      - 'automation/consultation/**'
      - 'automation/admin/**'
      - 'scripts/gas-sync.mjs'
      - '.github/workflows/gas-deploy.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 반영·배포 (끄면 대조만)'
        type: boolean
        default: false

concurrency:
  group: gas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 어떤 경로로 들어와도 먼저 읽기 전용 대조를 남긴다(로그로 무엇이 바뀔지 확인 가능)
      - name: 대조 (읽기 전용)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node scripts/gas-sync.mjs --check

      - name: 반영 + 기존 배포 갱신
        if: github.event_name == 'push' || inputs.apply
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: node scripts/gas-sync.mjs --push --deploy
