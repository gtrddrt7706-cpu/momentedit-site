# 병렬 세션 역전 자동 감지 — main push마다 merge-guard 실행(낡은 버퍼 통째 커밋이 다른 세션 수정을 조용히 되돌리면 RED).
# 근거: CLAUDE.md '병렬 세션 병합 검증 규칙'. 실사고 다수(식순 AI·좌석·04호칭 등 반복 역전). 수동 실행에만 의존하던 걸 자동화.
name: Merge Guard
# push(main) = 사후 감지(이미 반영됨) · pull_request(main) = 병합 전 차단용(브랜치 보호에서 required check로 지정 시).
#   ★예방은 GitHub 브랜치 보호에서 이 체크를 '필수'로 + main 직접 push 금지(PR 필수)로 켜야 완성됨 — 파일만으론 차단 안 됨(사용자 설정 필요).
# ★★[GUARD_ALL_PATHS 2026-08-09] push(main) 의 paths 필터를 없앴다.
#   목록을 손으로 유지하는 한 새로 가드를 건 파일이 계속 빠진다 — 실제로 console.html ·
#   assets/ritual-cue.js · contract/v1-1.html 이 목록에 없어 두 번째 그물에 구멍이 있었다.
#   2026-08-08 에 시계 시간표 세 벌이 샌 것도 같은 종류(검사가 볼 수 있는 범위를 손으로 적어 둔 것)였다.
#   ★다시 넣지 말 것. 전부 도는 비용은 몇 초고, 빠뜨린 파일은 조용히 사고가 된다.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # ★★[GUARD_FULL_HISTORY 2026-08-30] 이력을 «전부» 가져온다. 얕게 받지 말 것.
      #   기본값(fetch-depth: 1)이면 커밋이 하나뿐이라 부모가 없다 — git 은 그것을 «모든 파일을 새로
      #   추가한 커밋»으로 본다. 그래서 `git log --since=… -p` 를 쓰는 검사(deploycheck-coverage)가
      #   저장소의 «모든» 표식을 「최근에 들어온 것」으로 세어 버렸다.
      #   실측: 로컬(전체 이력) 5개 vs CI(depth 1) 56개 — 이 차이 하나로 main 이 #602 부터 계속 붉었고
      #   그동안 모든 PR 이 막혔다. 검사가 틀린 게 아니라 «볼 수 있는 것»이 틀렸다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run merge-guard (마커 생존 + 식순 문안 단일 원천 정합)
        run: sh automation/tests/merge-guard.sh
