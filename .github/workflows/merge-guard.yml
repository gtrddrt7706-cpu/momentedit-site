# 병렬 세션 역전 자동 감지 — main push마다 merge-guard 실행(낡은 버퍼 통째 커밋이 다른 세션 수정을 조용히 되돌리면 RED).
# 근거: CLAUDE.md '병렬 세션 병합 검증 규칙'. 실사고 다수(식순 AI·좌석·04호칭 등 반복 역전). 수동 실행에만 의존하던 걸 자동화.
name: Merge Guard
# push(main) = 사후 감지(이미 반영됨) · pull_request(main) = 병합 전 차단용(브랜치 보호에서 required check로 지정 시).
#   ★예방은 GitHub 브랜치 보호에서 이 체크를 '필수'로 + main 직접 push 금지(PR 필수)로 켜야 완성됨 — 파일만으론 차단 안 됨(사용자 설정 필요).
# ★★[GUARD_ALL_PATHS 2026-08-09] push(main) 의 paths 필터를 없앴다.
#   목록을 손으로 유지하는 한 새로 가드를 건 파일이 계속 빠진다 — 실제로 console.html ·
#   assets/ritual-cue.js · contract/v1-1.html 이 목록에 없어 두 번째 그물에 구멍이 있었다.
#   2026-08-08 에 시계 시간표 세 벌이 샌 것도 같은 종류(검사가 볼 수 있는 범위를 손으로 적어 둔 것)였다.
#   ★다시 넣지 말 것. 전부 도는 비용은 몇 초고, 빠뜨린 파일은 조용히 사고가 된다.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ★[GUARD_TIME_1019 2026-10-19] 3 → 5분 — 3분은 게이트가 56초에 끝나던 때 값이다. 지금 165초 안팎이라 실행 속도가 조금만 흔들려도
    #   한도에 걸려 «취소»로 진다(10/19 main push 185초 취소 · PR #1316 두 번 취소). 검사를 빼지 않고 시간만 늘린다 · 브라우저는 여전히 깔지 않는다
    steps:
      # ★★[GUARD_FULL_HISTORY 2026-08-30] 이력을 «전부» 가져온다. 얕게 받지 말 것.
      #   기본값(fetch-depth: 1)이면 커밋이 하나뿐이라 부모가 없다 — git 은 그것을 «모든 파일을 새로
      #   추가한 커밋»으로 본다. 그래서 `git log --since=… -p` 를 쓰는 검사(deploycheck-coverage)가
      #   저장소의 «모든» 표식을 「최근에 들어온 것」으로 세어 버렸다.
      #   실측: 로컬(전체 이력) 5개 vs CI(depth 1) 56개 — 이 차이 하나로 main 이 #602 부터 계속 붉었고
      #   그동안 모든 PR 이 막혔다. 검사가 틀린 게 아니라 «볼 수 있는 것»이 틀렸다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # ★★[GUARD_FAIL_TAIL 2026-10-12] 출력을 파일로도 받아 두고, 빨개지면 다음 단계가 실패 줄을 끝에 모아 다시 찍는다.
      #   왜 — 게이트 출력이 만 줄을 넘는다. 로그를 «끝에서 몇천 줄»만 주는 도구로는 앞쪽의 빨간 줄이 안 보여
      #   PR #1205 에서 원인을 찾느라 로컬에서 게이트를 통째로 다시 돌렸다(15분 넘게). 끝에 모아 두면 꼬리 몇 줄로 끝난다.
      #   ★pipefail 이 없으면 tee 의 종료코드(0)가 판정이 된다 — 게이트가 빨개도 초록으로 지는 길이니 지우지 말 것.
      - name: Run merge-guard (마커 생존 + 식순 문안 단일 원천 정합)
        shell: bash
        run: |
          set -o pipefail
          sh automation/tests/merge-guard.sh 2>&1 | tee "$RUNNER_TEMP/merge-guard.txt"
      #   ★실패 줄이 늘 FAIL 로 시작하지는 않는다 — 시간표 검사는 «DRIFT?», 몇몇은 «✗»·«MISSED» 로 알린다.
      #     첫 판은 FAIL · REVERT? 만 골라 «못 찾았다»로 끝났다(PR #1205 · 원인은 DRIFT? 줄). 그래서 둘째 칸에
      #     «ok · skip 이 아닌 줄»을 함께 싣는다(로컬 실측 백 줄 안팎 · 끝 150줄까지).
      - name: 빨간 줄만 다시 보기
        if: failure()
        shell: bash
        run: |
          F="$RUNNER_TEMP/merge-guard.txt"
          echo '── FAIL · REVERT? 줄'
          grep -nE '^(FAIL|REVERT\?)' "$F" || echo '(없음 — 아래 칸에서 찾을 것)'
          echo '── 그 밖의 줄(ok · skip 이 아닌 것 · DRIFT? · ✗ · MISSED 같은 실패가 여기 있다)'
          grep -nvE '^(ok |skip |FAIL|REVERT\?)' "$F" | cut -c1-300 | tail -n 150
  # ★★[BGM_SOUND_CI 2026-10-30 BGM 섹션 «다시 안 깨지게 bgm-preview(최소 D6)를 merge-guard / CI 에»]
  #   guard 는 브라우저를 깔지 않아 bgm-preview · bgm-seg8 · bgm-console2 가 늘 «브라우저 없음(2)»으로 건너뛰어졌다 —
  #   END_FLOW_1030(#1428)이 축배 순간을 «위하여»에서 끝내 미리 듣기의 축배 곡(M7)이 사라졌는데 PR 마다 초록이었다(D6 · CHEER_TAIL_1030).
  #   그래서 소리 검사 셋만 브라우저를 깔고 따로 돈다(guard 와 나란히 · guard 의 시간은 그대로). 2(못 잼)도 빨강이다 — 여기서는 브라우저가 있어야 한다.
  #   ★[BGM_SOUND_SPLIT_1101] 검사가 늘어 한 칸이 20분을 넘겼다(#1508 · listen-pace 5.7분 · bgm-preview 3.7분 · knobs 3.4분 · 합 18분 + 새 검사).
  #   두 칸으로 나눠 다른 기계에서 나란히 돈다(소리 타이밍 검사가 한 기계에서 CPU 를 다투지 않게) · 새 브라우저 소리 검사는 짧은 쪽 칸에 더한다.
  bgm-sound:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: a, tests: 'bgm-preview bgm-seg8 bgm-console2 music-fold' }
          - { name: c, tests: 'entry-carry bridge-first bgm-timing' }   # [ENTRY_CARRY_1101] · [BRIDGE_FIRST_1101] 입장 · 이음말 차례 검사(a 칸이 20분에 가까워 나눔)
          - { name: b, tests: 'listen-pace knobs' }
          - { name: d, tests: 'bgm-timing2 bed-load' }   # [BGM_TIMING2_1101] 축사 · 편지 «음악과 함께» 곡 바꿈 · 피크
    name: bgm-sound (${{ matrix.part.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 브라우저 준비
        run: npm i --no-save --no-package-lock playwright@1.56.1 && npx --yes playwright install --with-deps chromium
      - name: 구간 음악 소리 검사 (${{ matrix.part.tests }})   # [MUSIC_FOLD_1031] 곡 목록 접기도 브라우저로 · [BGM_SOUND_SPLIT_1101]
        shell: bash
        run: |
          set +e
          rc=0
          for t in ${{ matrix.part.tests }}; do   # [LISTEN_PACE_1031] · [KNOBS_1031] · 목록은 위 matrix
            node "scripts/audit/$t.mjs" > "$RUNNER_TEMP/$t.txt" 2>&1; r=$?
            echo "── $t exit=$r"
            grep -E '^(FAIL|못 쟀다)' "$RUNNER_TEMP/$t.txt" | cut -c1-500
            tail -n 1 "$RUNNER_TEMP/$t.txt"
            [ "$r" -ne 0 ] && rc=1
          done
          exit $rc
